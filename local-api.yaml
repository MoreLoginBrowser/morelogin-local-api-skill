            Action after startup. Default:1.
            1 = Continue last page,
            2 = Open specified URLs,
            3 = Open URLs + platform,
            4 = Continue last page + platform.
        autoOpenUrls:
          type: array
          items:
            type: string
            format: uri
          description: List of valid URLs to open automatically (required for options 2–3).
    browser_CiphersConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: TLS cipher policy. Default:1. 1 = Default, 2 = Custom.
        value:
          type: string
