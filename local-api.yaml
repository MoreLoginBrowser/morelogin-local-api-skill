            Required when switcher=2.
            Comma-separated list of TLS protocols to disable (e.g., "TLSv1,TLSv1.1").
    browser_BrowserPhoneList:
      type: object
      properties:
        code:
          description: Return result code 0:Normal Other codes are exceptions.
