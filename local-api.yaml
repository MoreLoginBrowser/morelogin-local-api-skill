  /api/env/core/download:
    post:
      operationId: downloadBrowserKernelsLocal
      summary: Download browser kernel
      deprecated: false
      description: >
        Download and install browser kernel(s). Supports batch downloading up to 20 kernels per request. The timeout for
        this operation can be up to approximately 30 minutes; callers should set their timeout to greater than 1805
        seconds.


        Requires MoreLogin client version **2.61.1** or higher.


        ### Duplicate Request Handling


        - If the same browser type and major version appears multiple times in a single request, only one lookup and
        download is performed, but each entry gets its own result.

        - Concurrent requests for the same version will join the in-flight task instead of starting a new download.

        - If the requested version is already installed with the latest minor version, the status will be
        `already_installed`.

        - If an older minor version is installed, it will be updated to the latest available minor version.


        ### Error Code Reference


        | errorCode | Description |

        |---|---|

        | `INVALID_JSON` | Malformed JSON body |

        | `INVALID_REQUEST` | Invalid request structure |

        | `BATCH_LIMIT_EXCEEDED` | `Cores` array exceeds 20 items |

        | `UNSUPPORTED_BROWSER_TYPE` | Unsupported browser type |

        | `INVALID_VERSION` | Invalid version format |

        | `METADATA_LOOKUP_FAILED` | Failed to query kernel metadata |

        | `UNSUPPORTED_VERSION` | Kernel version does not exist or is not supported on this platform |

        | `CLIENT_NOT_READY` | Client not ready |

        | `SDK_NOT_READY` | SDK not initialized |

        | `INSUFFICIENT_DISK_SPACE` | Insufficient disk space |

        | `DOWNLOAD_FAILED` | Download failed |

        | `CHECKSUM_MISMATCH` | MD5 checksum verification failed |

        | `EXTRACTION_FAILED` | Extraction or installation failed |

        | `TIMEOUT` | Operation timed out |

        | `UNKNOWN` | Unknown error |
      tags:
        - Runtime
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Cores:
                  type: array
                  description: List of kernels to download (1–20 items)
                  items:
                    type: object
                    properties:
                      BrowserType:
                        type: integer
                        description: Browser type. `1`:Chrome, `2`:Firefox
                      Version:
                        type: string
                        description: Kernel major version number, e.g. `"124"`, `"146"`
                    required:
                      - BrowserType
                      - Version
              required:
                - Cores
            example:
              Cores:
                - BrowserType: 1
                  Version: "124"
      responses:
        "200":
          description: Success. `data` is an object with the fields `total`, `succeeded`, `failed` and `results`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response code. `0`:all succeeded; `-1`:partial success; `-2`:all failed
                  msg:
                    type:
                      - string
                      - "null"
                    description: Request-level error message; normally `null` on success
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Total number of requested tasks
                      succeeded:
                        type: integer
                        description: Number of succeeded tasks (including already installed)
                      failed:
                        type: integer
                        description: Number of failed tasks
                      results:
                        type: array
                        description: Execution result for each input item, in the same order as the request
                        items:
                          type: object
                          properties:
                            index:
                              type: integer
                              description: Corresponding index in the `Cores` array (0-based)
                            browserType:
                              type:
                                - integer
                                - "null"
                              description: Browser type
                            requestedVersion:
                              type:
                                - string
                                - "null"
                              description: The requested major version
                            resolvedVersion:
                              type: string
                              description: The actual full version resolved; returned on success or when metadata is resolved
                            status:
                              type: string
                              description: Task status:`installed`, `already_installed`, or `failed`
                            source:
                              type: string
                              description: Download source:`downloaded`, `already_installed`, or `joined_in_flight`
                            errorCode:
                              type: string
                              description: Stable error classification code returned on failure
                            serverCode:
                              type: integer
                              description: Optional. Original business error code from the platform service
                            msg:
                              type: string
                              description: Display message; may vary by client language. Do not use for programmatic result checking
                    required:
                      - total
                      - succeeded
                      - failed
                      - results
                  requestId:
                    type: string
                    description: Unique request identifier; include it when contacting support
                required:
                  - code
                  - data
              example:
                code: 0
                msg: null
                data:
                  total: 1
                  succeeded: 1
                  failed: 0
                  results:
                    - index: 0
                      browserType: 1
                      requestedVersion: "124"
                      resolvedVersion: "124.5"
                      status: installed
                      source: downloaded
                      msg: Download successful
          headers: {}
      security: []
  /api/cloudbrowser/start:
    post:
      summary: Start cloud runtime
      description: >-
        Start a browser profile as a cloud runtime.


        - **Preconditions**: the profile must exist in your team and must not be end-to-end encrypted or mid-transfer.
        **A proxy is required** and its reachability is checked before the start is accepted. The browser kernel must be
        one the cloud browser supports, which rules out Firefox. Team open limits are enforced, and on deployments with
        cloud-browser billing enabled the AI credit balance is checked too.

        - **One run per profile**: a member may hold only one active run for a profile. When the team enables the
        security lock, another member's run blocks yours.

        - **Completion**: **accepted, not complete.** `data` is empty; the runtime is provisioned asynchronously. Poll
        `/cloudbrowser/page` until `cloudBrowserStatus` is `RUNNING`, then call `/cloudbrowser/connect` for `cdpUrl`. A
        start can be accepted and still fail later, which surfaces on that page.

        - **Concurrency**: concurrent starts for one profile are serialized by a lock; the loser is rejected rather than
        queued.

        - **Retry**: after a timeout, read `/cloudbrowser/page` — do not resend.


        Documented business errors: `19039`, `19065`, `40001`, `40003`, `40015`, `40016`, `40021`, `40023`, `40024`,
        `40025`, `40026`, `40027`, `40028`, `40029`, `40037`. See [Error Codes](../Getting%20Started/error-codes.md) for
        what each code means. Any operation can additionally return the common codes.
      operationId: startCloudRuntimeLocal
      tags:
        - Cloud Runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/browser_CloudBrowserStartRequest"
            example:
              envId: "1800000000000001"
      responses:
        "200":
          $ref: "#/components/responses/browser_VoidDataResponse"
      security: []
  /api/cloudbrowser/stop:
    post:
      summary: Stop cloud runtime
      description: >-
        Stop the cloud runtime a profile is running in.


        - **Preconditions**: there must be an active run started by you for that profile. Calling it while the runtime
        is already stopped or releasing succeeds without doing anything.

        - **Effect**: stops billing, settles usage, releases the profile lock, and asks the client to archive the
        profile and cookies back to the cloud before the runtime is released.

        - **Completion**: **accepted, not complete.** Poll `/cloudbrowser/page` until `cloudBrowserStatus` is `CLOSED`
        and `cloudBrowserArchiveStatus` reaches `COMPLETED` or `FAILED`.

        - **When archiving fails**: the run stays billable and still shows as `RUNNING`. `force` is honoured **only** in
        that state: it skips archiving and releases the runtime, which discards this session's profile changes.

        - **Concurrency**: concurrent stops for one run are serialized, so a duplicate call is safe.


        Documented business errors: `40002`, `40006`, `40008`, `40020`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means. Any operation can additionally return the
        common codes.
      operationId: stopCloudRuntimeLocal
      tags:
        - Cloud Runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/browser_CloudBrowserStopRequest"
            example:
              envId: "1800000000000001"
              force: false
      responses:
        "200":
          $ref: "#/components/responses/browser_VoidDataResponse"
      security: []
  /api/cloudbrowser/page:
    post:
      summary: Page cloud runtimes
      description: >-
        List browser profiles together with the cloud runtime state for the calling member.


        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Status values**: `cloudBrowserStatus` is only ever `STARTING`, `RUNNING` or `CLOSED`. **`RUNNING` does not
        mean the browser is usable** — a runtime that is stopping, archiving, or that failed to stop is also reported as
        `RUNNING`. `cloudBrowserArchiveStatus` (`PENDING`, `ARCHIVING`, `COMPLETED`, `FAILED`) tells the two apart and
        is null when there is no activity.

        - **Consistency**: the runtime lookup is all-or-nothing. If it cannot be resolved for the whole page the call
        fails rather than returning partial data.
      operationId: pageCloudRuntimesLocal
      tags:
        - Cloud Runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/browser_CloudBrowserPageRequest"
            example:
              pageNo: 1
              pageSize: 10
              keyword: marketing
      responses:
        "200":
          $ref: "#/components/responses/browser_CloudBrowserPageResponse"
      security: []
  /api/cloudbrowser/connect:
    post:
      summary: Connect cloud runtime
      description: >-
        Return the connection details for a running cloud runtime.


        - **Preconditions**: the runtime must be exactly in the `RUNNING` state and must have been started by you. A
        runtime that is stopping or archiving is rejected even though `/cloudbrowser/page` still reports `RUNNING`.

        - **Effect**: mints a fresh desktop access token and records you as the connected member.

        - **Repeat calls**: the returned `cdpUrl` is stable and existing CDP sessions keep working, but each call issues
        a new desktop token and overwrites the recorded connected member. **Earlier desktop URLs are not revoked**, so
        treat every returned URL as a live credential: do not log or persist them.

        - **Session limit**: the runtime is stopped automatically once it reaches its maximum duration, and archiving
        starts shortly before that, so a long-lived automation run must handle the runtime disappearing.

        - **Use**: attach Puppeteer, Playwright or Selenium to `cdpUrl`.


        Documented business errors: `40008`, `40009`, `40010`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the common codes.
      operationId: connectCloudRuntimeLocal
      tags:
        - Cloud Runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/browser_CloudBrowserConnectRequest"
            example:
              envId: "1800000000000001"
      responses:
        "200":
          $ref: "#/components/responses/browser_CloudBrowserConnectResponse"
      security: []
  /api/balance:
    get:
      operationId: getAccountAndCloudPhoneQuotasLocal
      summary: Get Account Balance and Cloud Phone Quotas
      description: >-
        Return the team's wallet balance and Cloud Phone usage allowances.


        - **Preconditions**: the calling member needs the cost permission. The wallet is looked up by team, so the
        figures are team-wide rather than per member.

        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Units**: `balance` is the wallet balance **in cents**, not in currency units. `remainingDuration` is Cloud
        Phone minutes and `remainingConcurrency` a slot count; both are clamped at 0 rather than going negative.

        - **Contents**: exactly these three figures. Frozen wallet amounts, used-versus-granted minute splits and expiry
        dates exist upstream but are deliberately not exposed here.

        - **Note**: the call fails as a whole if either the wallet or the quota lookup fails; it never returns partial
        figures.
      tags:
        - Account & Quotas
      responses:
        "200":
          $ref: "#/components/responses/cloudphone_BalanceResponse"
  /api/cloudphone/monthly/skus:
    get:
      operationId: listMonthlyCloudPhoneSkus
      summary: List Purchasable Monthly Cloud Phone Plans
      description: >-
        Return the monthly Cloud Phone products currently available to the calling team.


        - **Effect**: none. The call does not reserve capacity or charge the wallet. Read-only. Safe to retry with
        bounded backoff.

        - **Use**: pass the returned `skuId` to [`/api/cloudphone/create`](./local-api.yaml#operation/createUsingPOST).
        The price is in US cents and the current monthly term is 30 days.

        - **Empty result**: an empty `data` array means no monthly product is currently available.


        See [Error Codes](../Getting%20Started/error-codes.md) for common business errors.

        - **Client version**: requires MoreLogin desktop client v2.65.0 or later; older clients do not expose this Local
        API route.
      tags:
        - Monthly Billing
      responses:
        "200":
          $ref: "#/components/responses/cloudphone_MonthlyCloudPhoneSkusResponse"
  /api/cloudphone/monthly/activate:
    post:
      operationId: activateMonthlyCloudPhones
      summary: Purchase and Activate Monthly Cloud Phones
      description: >-
        Purchase and activate one to ten monthly Cloud Phones for 30 days.


        - **Billing warning**: **this operation charges the team wallet.**

        - **Permission**: the calling member must have **Fees / Payment Management** permission; otherwise the request
        returns `99012`.

        - **Create first**: create the phones with
        [`/api/cloudphone/create`](./local-api.yaml#operation/createUsingPOST). Creation only provisions inactive
        records and does not charge.

        - **Selection rules**: IDs must be distinct, belong to the team, use active 30-day monthly products and have
        compatible purchase states. Different monthly SKUs may be purchased together. Mixing paid and unpaid phones,
        phones from different paid orders, pending client orders or concurrent purchases rejects the entire request.

        - **Charging and restoration**: validation and charging are all-or-nothing, so there is no partial charge. If
        every phone belongs to the same paid order, the server restores the existing paid entitlement and does not
        charge again. The Local API, Open API and desktop client share the same order state.

        - **Completion**: success means every phone was confirmed active for 30 days. It does not power the phones on
        and does not enable automatic renewal.

        - **Unconfirmed activation**: when the service returns `33422`, `data.results` is still complete and preserves
        request order. Inspect each `status`, `expireTime` and `errorCode`; do not treat the whole result as missing.

        - **Retry**: there is no caller-supplied idempotency key. After a timeout, query
        [`/api/cloudphone/info`](./local-api.yaml#operation/infoUsingPOST) or
        [`/api/cloudphone/page`](./local-api.yaml#operation/pageUsingPOST) and inspect billing and expiry state before
        deciding whether to retry.

        - **Client version**: requires MoreLogin desktop client v2.65.0 or later; older clients do not expose this Local
        API route.


        Documented business errors: `20002`, `20003`, `20004`, `20008`, `20041`, `20055`, `20068`, `20070`, `20071`,
        `33420`, `33421`, `33422`, `99001`, `99002`, `99012`. See [Error Codes](../Getting%20Started/error-codes.md) for
        what each code means. Any operation can additionally return the common codes.

        - **Client version**: requires MoreLogin desktop client v2.65.0 or later; older clients do not expose this Local
        API route.
      tags:
        - Monthly Billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudphone_MonthlyCloudPhoneActivateRequest"
            example:
              ids:
                - "1724032706822188"
                - "1724032729890861"
      responses:
        "200":
          $ref: "#/components/responses/cloudphone_MonthlyCloudPhoneActivateResponse"
  /api/cloudphone/live/start:
    post:
      operationId: startCloudPhoneLiveStreamingLocal
      summary: Start Live Streaming
      description: >-
        Start live streaming an uploaded MP4 on a Cloud Phone.


        - **Preconditions**: the phone must be powered on and not held by another member, and the device must support
        live streaming. The `fileId` must refer to a file uploaded as live-stream media that finished uploading;
        anything else is rejected as invalid or expired.

        - **Completion**: **accepted, not complete.** The response only confirms the service took the request. Poll
        `/cloudphone/live/status` until `liveStatus` is `1`.

        - **Note**: the MP4-only restriction is enforced when you upload the file, not here.

        - **Retry**: no deduplication; a repeat call re-issues the start command.


        Documented business errors: `33300`, `33301`, `33401`, `33418`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means. Any operation can additionally return the
        common codes.
      tags:
        - Live Streaming
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudphone_CloudPhoneLiveStartRequest"
            example:
              phoneId: "190000000000000001"
              fileId: "820000000000000001"
      responses:
        "200":
          $ref: "#/components/responses/cloudphone_CloudPhoneLiveBooleanResponse"
  /api/cloudphone/live/status:
    post:
      operationId: getCloudPhoneLiveStreamingStatusLocal
      summary: Get Live Streaming Status
      description: >-
        Report whether a Cloud Phone is currently live streaming.


        - **Preconditions**: the phone must belong to your team and the device must support live streaming. Unlike start
        and stop, this does **not** require the phone to be powered on or claimed by you.

        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Values**: `liveStatus` is `0` (not streaming) or `1` (streaming). **There is no failure state** — a start
        that never took effect simply stays at `0`, so bound your polling with a timeout.


        Documented business errors: `33300`, `33401`. See [Error Codes](../Getting%20Started/error-codes.md) for what
        each code means. Any operation can additionally return the common codes.
      tags:
        - Live Streaming
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudphone_CloudPhoneLivePhoneRequest"
            example:
              phoneId: "190000000000000001"
      responses:
        "200":
          $ref: "#/components/responses/cloudphone_CloudPhoneLiveStatusResponse"
  /api/cloudphone/live/end:
    post:
      operationId: stopCloudPhoneLiveStreamingLocal
      summary: Stop Live Streaming
      description: >-
        Stop live streaming on a Cloud Phone.


        - **Preconditions**: the phone must be powered on and not held by another member, and the device must support
        live streaming. **Whether a stream is actually running is not checked** — the stop command is sent regardless.

        - **Completion**: accepted, not complete. Poll `/cloudphone/live/status` until `liveStatus` is `0`.

        - **Retry**: idempotent in effect; a repeat call simply re-sends the stop command.


        Documented business errors: `33300`, `33301`, `33401`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the common codes.
      tags:
        - Live Streaming
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudphone_CloudPhoneLivePhoneRequest"
            example:
              phoneId: "190000000000000001"
      responses:
        "200":
          $ref: "#/components/responses/cloudphone_CloudPhoneLiveBooleanResponse"
  /api/cloudphone/uploadFile:
    post:
      summary: Upload File (Multipart)
      deprecated: false
      description: >-
        Upload a local file straight to a Cloud Phone (legacy multipart flow).


        - **Preconditions**: the phone must be powered on and not held by another member. The upload code obtained from
        the signed-URL step is single-use.

        - **Completion**: the response only confirms the Local API accepted the transfer. **No task id and no polling
        state are exposed**, so progress cannot be observed.

        - **Use instead**: `/api/cloudphone/upload/file/signedUrl` → `PUT` → `/api/cloudphone/upload/file` →
        `/api/cloudphone/upload/file/result` when you need observable progress and retry handling.

        - **Note**: this path is not the same operation as `/cloudphone/uploadFile` on the Open API, which registers an
        already-uploaded object.


        Documented business errors: `33401`, `33419`. See [Error Codes](../Getting%20Started/error-codes.md) for what
        each code means. Any operation can additionally return the common codes.
      operationId: fileUploadUsing
      tags:
        - Files
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - id
                - file
                - uploadDest
              properties:
                id:
                  description: Cloud phone ID
                  type: string
                  examples:
                    - "1661515884160372"
                  example: "1661515884160372"
                file:
                  format: binary
                  type: string
                  description: File to upload
                  examples:
                    - file://D:\application\apifox\LICENSE.electron.txt
                  example: file://D:\application\apifox\LICENSE.electron.txt
                uploadDest:
                  description: Upload destination directory
                  type: string
                  examples:
                    - /Download
                  example: /Download
            example:
              id: "1661515884160372"
              file: file://D:\application\apifox\LICENSE.electron.txt
              uploadDest: /Download
      responses:
        "200":
          description: The Local API accepted the direct upload and returns an empty JSON object.
          content:
            application/json:
              schema:
                type: object
                maxProperties: 0
                properties: {}
              example: {}
      security: []
  /api/cloudphone/upload/file/signedUrl:
    post:
      operationId: getCloudPhoneUploadSignedUrlLocal
      summary: Request Temporary Upload URL
      deprecated: false
      description: >-
        Request a pre-signed URL for uploading a file that a Cloud Phone will receive.


        - **Preconditions**: the phone must be powered on and not held by another member.

        - **Completion**: synchronous. **The pre-signed URL is valid for one hour.** `PUT` the file content to it, then
        register the upload with `/api/cloudphone/upload/file`.

        - **Note**: temporary objects are removed automatically after 7 days.

        - **Surface note**: this is the same implementation as `/cloudphone/uploadUrl` on the Open API.
      tags:
        - Files
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
