  /api/cloudstorage/info:
    get:
      summary: Query Cloud Storage Information
      description: >-
        Return the team's Cloud Storage quota and current usage.


        - **Preconditions**: the team must already have a Cloud Storage record. **A team that has never had Cloud
        Storage provisioned gets an error, not a zero-capacity reading** — the record is created when storage is
        purchased, not lazily by this call.

        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Units**: `capacity` and `usedCapacity` are byte counts.

        - **Accuracy**: `usedCapacity` is a running counter maintained on upload and delete, not a live sum over the
        file table, so it can drift from the total of `fileSize` in `/cloudstorage/file/page`.

        - **Values**: `capacityStatus` is `1` only when a positive quota is fully consumed; `isExpired` compares the
        expiry date to now. Files whose upload was never confirmed do not count toward `usedCapacity`.


        Documented business errors: `39001`. See [Error Codes](../Getting%20Started/error-codes.md) for what each code
        means. Any operation can additionally return the common codes.
      operationId: queryCloudStorageInfoLocal
      tags:
        - Cloud Storage
      responses:
        "200":
          $ref: "#/components/responses/cloudstorage_StorageInfoResponse"
  /api/cloudstorage/file/page:
    post:
      summary: Page Cloud Storage Files
      description: >-
        List Cloud Storage files, page by page.


        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Visibility**: **only files whose upload was confirmed are listed** — a file with a pre-signed URL that was
        never completed does not appear. Members without the all-data permission see only files they uploaded.

        - **Filtering**: `fileName` matches partially; `tagIds` is an OR match; results are ordered newest first and the
        order cannot be changed.

        - **Caveat**: an entry in `tagInfo` can be null when a tag was deleted while still attached to the file.
      operationId: pageCloudStorageFilesLocal
      tags:
        - Cloud Storage Files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudstorage_FilePageRequest"
            example:
              pageNo: 1
              pageSize: 20
              fileName: report
              tagIds:
                - "1800000000000001"
      responses:
        "200":
          $ref: "#/components/responses/cloudstorage_FilePageResponse"
  /api/cloudstorage/upload/init:
    post:
      summary: Batch Request Presigned Upload URLs
      description: >-
        Reserve Cloud Storage records and get pre-signed upload URLs.


        - **Preconditions**: the team must have a Cloud Storage record and it must not be expired. Each base file name
        is limited to 60 characters and must be unique both within the request and against every existing file in the
        team — **matched on the name without its extension**, so `a.png` collides with an existing `a.mp4`.

        - **Limits**: at most 100 uploads may sit unconfirmed at once across the team.

        - **Effect**: inserts one file record per name with an uploading status and a zero size, and returns `{id,
        fileName, presignedUrl}` for each.

        - **Quota**: **space is not checked here.** It is charged when you confirm the upload, so init can succeed and
        complete can still fail for lack of space.

        - **Completion**: synchronous. **Each pre-signed URL is valid for one hour**; `PUT` the bytes to it, then call
        `/cloudstorage/upload/complete`.


        Documented business errors: `39001`, `39037`, `39044`, `39045`, `39047`, `39050`, `39051`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means. Any operation can additionally return the
        common codes.
      operationId: batchRequestCloudStoragePresignedUploadUrlsLocal
      tags:
        - Cloud Storage Files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudstorage_UploadInitRequest"
            example:
              fileNames:
                - example.jpg
      responses:
        "200":
          $ref: "#/components/responses/cloudstorage_UploadInitResponse"
  /api/cloudstorage/upload/complete:
    post:
      summary: Confirm Upload Completion
      description: >-
        Confirm an uploaded Cloud Storage file.


        - **Preconditions**: the file record must belong to your team and the object must already be in storage — the
        service reads its ETag and length to verify. Size must be greater than 0 and under 2 GB.

        - **Effect**: charges the team's storage quota atomically, then marks the record uploaded and stores the real
        size. Until this succeeds the file **does not appear in `/cloudstorage/file/page`** and keeps occupying one of
        the 100 pending slots.

        - **On failure the uploaded object is deleted.** Calling this too early, over the size limit, or with no space
        left removes the bytes from storage and leaves the record unconfirmed. Recovery is a fresh
        `/cloudstorage/upload/init` and a re-upload, not a retry of this call.

        - **Completion**: synchronous and idempotent once it has succeeded — a second call returns the same file without
        charging quota again.

        - **Note**: a record that is never confirmed is cleaned up automatically after 24 hours.


        Documented business errors: `39001`, `39011`, `39014`, `39041`, `39046`, `39047`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means. Any operation can additionally return the
        common codes.
      operationId: confirmCloudStorageUploadCompleteLocal
      tags:
        - Cloud Storage Files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudstorage_UploadCompleteRequest"
            example:
              id: "1800000000000001"
      responses:
        "200":
          $ref: "#/components/responses/cloudstorage_UploadCompleteResponse"
  /api/cloudstorage/file/delete/batch:
    post:
      summary: Batch Delete Cloud Storage Files
      description: >-
        Delete Cloud Storage files by id.


        - **Preconditions**: every id must resolve within your team; **the whole batch is rejected and rolled back if
        any one does not**, including ids that were already deleted.

        - **Effect**: a soft delete. Quota is released in the same transaction, and the stored objects are removed on a
        best-effort basis — a storage failure is logged but does not fail the call, so an object can outlive its record.
        Tag assignments are not cleaned up.

        - **Completion**: synchronous. Confirm released space with `/cloudstorage/info`.


        Documented business errors: `39011`. See [Error Codes](../Getting%20Started/error-codes.md) for what each code
        means. Any operation can additionally return the common codes.
      operationId: batchDeleteCloudStorageFilesLocal
      tags:
        - Cloud Storage Files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudstorage_FileDeleteRequest"
            example:
              ids:
                - "1800000000001001"
                - "1800000000001002"
      responses:
        "200":
          $ref: "#/components/responses/cloudstorage_VoidDataResponse"
  /api/cloudstorage/file/tag/set:
    post:
      summary: Set File Tags
      description: >-
        Replace the tags on a Cloud Storage file.


        - **Preconditions**: one `fileId` per call, and `tagIds` must be non-empty and reference Cloud Storage tags
        belonging to your team. Profile tags are rejected.

        - **Effect**: tags not present in the request are removed from the file and missing ones are added. **There is
        no way to clear all tags here** because an empty list is rejected.

        - **Completion**: synchronous and idempotent for the same body.


        Documented business errors: `39011`, `39048`, `39049`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the common codes.
      operationId: setCloudStorageFileTagsLocal
      tags:
        - Cloud Storage File Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudstorage_FileTagChangeRequest"
            example:
              fileId: "1800000000001001"
              tagIds:
                - "1800000000000101"
                - "1800000000000102"
      responses:
        "200":
          $ref: "#/components/responses/cloudstorage_VoidDataResponse"
  /api/cloudstorage/file/tag/add:
    post:
      summary: Add File Tags
      description: >-
        Add tags to a Cloud Storage file without removing existing ones.


        - **Preconditions**: one `fileId` per call, and `tagIds` must be non-empty and reference Cloud Storage tags
        belonging to your team.

        - **Effect**: only adds; existing tags are left in place. Use the set variant to replace them.

        - **Completion**: synchronous and idempotent — adding a tag the file already has changes nothing.


        Documented business errors: `39011`, `39048`, `39049`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the common codes.
      operationId: addCloudStorageFileTagsLocal
      tags:
        - Cloud Storage File Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudstorage_FileTagChangeRequest"
            example:
              fileId: "1800000000001001"
              tagIds:
                - "1800000000000103"
      responses:
        "200":
          $ref: "#/components/responses/cloudstorage_VoidDataResponse"
  /api/cloudstorage/file/tag/query:
    post:
      summary: Query File Tags
      description: >-
        Return the tags attached to one or more Cloud Storage files.


        - **Preconditions**: every `fileId` must resolve within your team; **one unknown id fails the whole call**
        rather than returning partial data.

        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Caveat**: `tagIds` is read from the assignments while the tag details come from live tags, so a tag deleted
        while still attached appears in `tagIds` with no matching entry in the details. The two can differ in length.
      operationId: queryCloudStorageFileTagsLocal
      tags:
        - Cloud Storage File Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudstorage_FileTagQueryRequest"
            example:
              fileIds:
                - "1800000000001001"
      responses:
        "200":
          $ref: "#/components/responses/cloudstorage_FileTagsResponse"
  /api/cloudstorage/tag/all:
    get:
      summary: Query All Cloud Storage File Tags
      description: >-
        Return every Cloud Storage file tag in the team.


        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Note**: not paginated, and Cloud Storage tags have no server-side count limit, so the response grows with
        the number of tags your team creates.
      operationId: queryAllCloudStorageFileTagsLocal
      tags:
        - Cloud Storage File Tags
      responses:
        "200":
          $ref: "#/components/responses/cloudstorage_TagListResponse"
  /api/cloudstorage/tag/create:
    post:
      summary: Create Cloud Storage File Tag
      description: >-
        Create a Cloud Storage file tag.


        - **Preconditions**: `tagName` must not be blank.

        - **Effect**: creates the tag with a colour picked from a fixed palette. **Names are not checked for duplicates
        and there is no count limit**, so repeating the call creates a second tag with the same name.

        - **Completion**: synchronous; the response carries the new tag.
      operationId: createCloudStorageFileTagLocal
      tags:
        - Cloud Storage File Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudstorage_TagCreateRequest"
            example:
              tagName: Invoice
      responses:
        "200":
          $ref: "#/components/responses/cloudstorage_TagResponse"
  /api/cloudstorage/tag/edit:
    post:
      summary: Edit Cloud Storage File Tag
      description: >-
        Rename a Cloud Storage file tag.


        - **Preconditions**: the tag must exist in your team and be a Cloud Storage tag.

        - **Effect**: only the name changes; the colour and every existing assignment are kept, so files show the new
        name immediately.

        - **Completion**: synchronous. No optimistic locking — concurrent renames are last-write-wins.
      operationId: editCloudStorageFileTagLocal
      tags:
        - Cloud Storage File Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudstorage_TagEditRequest"
            example:
              id: "1800000000000101"
              tagName: Invoice 2026
      responses:
        "200":
          $ref: "#/components/responses/cloudstorage_BooleanDataResponse"
  /api/cloudstorage/tag/delete/batch:
    post:
      summary: Delete Cloud Storage File Tags
      description: >-
        Delete Cloud Storage file tags.


        - **Preconditions**: every id must be a Cloud Storage tag in your team; **one invalid id fails the whole
        batch**.

        - **Effect**: the tags are deleted but **their file assignments are not cleaned up**. Two consequences to
        expect: `/cloudstorage/file/tag/query` keeps returning the deleted tag id with no matching detail, and `tagInfo`
        in `/cloudstorage/file/page` can contain null entries. Filtering files by a deleted tag id returns nothing.

        - **Completion**: synchronous, and not wrapped in a transaction.
      operationId: deleteCloudStorageFileTagsLocal
      tags:
        - Cloud Storage File Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudstorage_TagDeleteRequest"
            example:
              ids:
                - "1800000000000101"
      responses:
        "200":
          $ref: "#/components/responses/cloudstorage_BooleanDataResponse"
components:
  schemas:
    browser_CreateEnvironmentRequest:
      allOf:
        - $ref: "#/components/schemas/browser_EnvironmentBase"
        - type: object
          required:
            - browserTypeId
            - operatorSystemId
          properties:
            proxy:
              type: object
              properties:
                proxyId:
                  description: Proxy ID
                  type: string
                proxyName:
                  description: Proxy name (maximum 600 characters)
                  type: string
                proxyType:
                  description: "Proxy type, 0: http, 1: https. Cannot be empty when proxyProvider is 7/8"
                  type: integer
                proxyProvider:
                  description: "Proxy type 0: http, 1: https, 2: socks5, 3: ssh, 4: Oxylabs, 5: Proxys.io, 7: Luminati, 8: Lumauto, 9:
                    Oxylabsauto, 10: Trojan, 11: Shadowsocks, 13: ABCPROXY, 14: LunaProxy, 15: IPHTML, 16: PiaProxy, 17:
                    922S5, 18: 360Proxy"
                  type: string
                proxyIp:
                  description: Proxy IP. Can be empty when proxyProvider is 16/17/18; required for others
                  type: string
                proxyPort:
                  description: Proxy port (only numbers 1-65535 allowed). Can be empty when proxyProvider is 16/17/18; required for others
                  type: integer
                username:
                  description: Username (maximum 200 characters)
                  type: string
                password:
                  description: Password (maximum 100 characters)
                  type: string
                refreshUrl:
                  description: Refresh URL
                  type: string
                country:
                  description: Country code (e.g. `us`). See [Country Time Zone Table](/api-reference/appendix/country-time-zone) for
                    supported codes. Required when proxyProvider is 16/17/18
                  type: string
                city:
                  description: City
                  type: string
                state:
                  description: State/Province
                  type: string
                encryptionType:
                  description: "Encryption method. Cannot be empty when proxyProvider is 11. 1: aes-128-gcm, 2: aes-192-gcm, 3:
                    aes-256-gcm, 4: aes-128-cfb, 5: aes-192-cfb, 6: aes-256-cfb, 7: aes-128-ctr, 8: aes-192-ctr, 9:
                    aes-256-ctr, 10: rc4-md5, 11: chacha20-ietf, 12: xchacha20, 13: chacha20-ietf-poly1305, 14:
                    xchacha20-ietf-poly1305"
                  type: integer
                ipMonitor:
                  description: "Enable IP change monitoring? true: On, false: Off"
                  type: boolean
                ipChangeAction:
                  description: "IP change monitoring 0: Block access, 1: Warn"
                  type: integer
              description: Proxy information
    browser_UpdateEnvironmentRequest:
      allOf:
        - $ref: "#/components/schemas/browser_EnvironmentBase"
        - type: object
          required:
            - envId
          properties:
            envId:
              type: string
              description: Environment ID
    browser_EnvironmentBase:
      type: object
      properties:
        browserTypeId:
          type: integer
          description: Browser type ID; 1=Chrome, 2=Firefox
        operatorSystemId:
          type: integer
          description: OS type ID; 1:Windows 2:macOS 3:Android 4:IOS 5:Linux
        isEncrypt:
          type: integer
          description: Whether to encrypt the profile; 0=No, 1=Yes
        startupParams:
          type: array
          items:
            type: string
          description: Additional browser startup parameters
        accountInfo:
          description: Account information
          $ref: "#/components/schemas/browser_AccountInfo"
        advancedSetting:
          description: Advanced browser fingerprint settings
          $ref: "#/components/schemas/browser_AdvancedSetting"
        afterStartupConfig:
          description: Configurations after startup
          $ref: "#/components/schemas/browser_AfterStartupConfig"
        browserCore:
          type: integer
          description: Kernel version; default:0 (auto-match). Fetch available versions via `/api/env/advanced/ua/versions`.
        cookies:
          type: string
          description: Cookie string to preload (optional)
        envName:
          type: string
          description: Environment name
        envRemark:
          type: string
          description: Environment remark; max length:1500 chars
        groupId:
          type: string
          description: Environment group ID; default:ungrouped (0)
        groupName:
          type: string
          maxLength: 50
          description: "Group name (max 50 characters). If provided, the system first checks groupId: if a valid group is found,
            it is used; otherwise, it searches by groupName. If a group with that name exists, it is referenced; if not,
            a new group is created. Each team is limited to 1,000 groups."
        proxyId:
          type: string
          description: Proxy ID; default:0
        tagIds:
          type: array
          items:
            type: string
          description: Tag IDs; default:none
        uaVersion:
          type: integer
          description: UA preset version; default:0 (all)
        disableAudio:
          type: integer
          description: Disable audio:0 = off, 1 = on
        disableImg:
          type: integer
          description: Disable image loading:0 = off, 1 = on
        disableVideo:
          type: integer
          description: Disable video loading:0 = off, 1 = on
        imgLimitSize:
          type: integer
          description: Max image size (KB)
    browser_AccountInfo:
      type: object
      properties:
        customerUrl:
          type: string
          description: Custom platform URL — required if platformId=9999, must be a valid URL
        password:
          type: string
          description: Password; max length:50 characters
        platformId:
          type: string
          description: Platform ID; use 9999 for custom URL. Refer to /api/system/platform/list.
        siteId:
          type: string
          description: Site ID; obtain via ""Get Configurable Platforms"" API (/api/system/platform/list)
        username:
          type: string
          maxLength: 64
          description: Username; max length:64 characters
    browser_AdvancedSetting:
      type: object
      description: Advanced browser fingerprint and behavior configuration.
      properties:
        ua:
          type: string
          description: |
            Customize the profile User-Agent (UA). Must follow standard UA format.
            Available via the “Get Browser UA” API.
        time_zone:
          description: Timezone settings
          $ref: "#/components/schemas/browser_TimeZoneConfig"
        web_rtc:
          description: WebRTC settings
          $ref: "#/components/schemas/browser_WebRTCConfig"
        geo_location:
          description: Geolocation settings
          $ref: "#/components/schemas/browser_GeoLocationConfig"
        language:
          description: Language
          $ref: "#/components/schemas/browser_LanguageConfig"
        resolution:
          description: Resolution settings
          $ref: "#/components/schemas/browser_ResolutionConfig"
        font:
          description: Font settings
          $ref: "#/components/schemas/browser_FontConfig"
        canvas:
          description: Canvas fingerprinting setting
          $ref: "#/components/schemas/browser_CanvasConfig"
        webgl_image:
          description: WebGL image settings
          $ref: "#/components/schemas/browser_WebGLImageConfig"
        webgl_metadata:
          description: WebGL metadata settings
          $ref: "#/components/schemas/browser_WebGLMetadataConfig"
        audio_context:
          description: "AudioContext: 1 = noise, 2 = authentic"
          $ref: "#/components/schemas/browser_AudioContextConfig"
        media_device:
          description: "Media device: 1 = noise, 2 = authentic"
          $ref: "#/components/schemas/browser_MediaDeviceConfig"
        client_rects:
          description: "ClientRects: 1 = noise, 2 = authentic"
          $ref: "#/components/schemas/browser_ClientRectsConfig"
        speech_voise:
          description: "Speech voice: 1 = privacy, 2 = authentic"
          $ref: "#/components/schemas/browser_SpeechVoiseConfig"
        hardware_concurrency:
          type: integer
          description: |
            Simulated number of logical CPU cores.
            default:4. Options: 0 (real), 2, 3, 4, 6, 8, 10, 12.
        memery_device:
          type: integer
          description: |
            Simulated device memory (GB).
            default:8. Options: 0 (real), 2, 4, 6, 8.
        do_not_track:
          type: integer
          description: Do Not Track setting. Default:2. 1 = on, 2 = off.
        bluetooth:
          description: "Bluetooth: 1 = privacy, 2 = authentic"
          $ref: "#/components/schemas/browser_BluetoothConfig"
        battery:
          description: "Battery: 1 = privacy, 2 = authentic"
          $ref: "#/components/schemas/browser_BatteryConfig"
        port_scan_protection:
          description: Port scan protection
          $ref: "#/components/schemas/browser_PortScanProtectionConfig"
        os_version:
          type: string
          description: macOS system version (e.g., macOS 12, macOS 13, macOS 14).
        web_gpu:
          description: WebGPU settings
          $ref: "#/components/schemas/browser_WebGPUConfig"
        ciphers:
          description: Cipher suite configurations
          $ref: "#/components/schemas/browser_CiphersConfig"
        mobile_device:
          type: string
          description: |
            Phone model ID (as string). Obtain via "Get Phone Model List" API.
            Example: "1826502391344832512"
    browser_TimeZoneConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Timezone option. Default:1. 1 = Match IP, 2 = Custom.
        value:
          type: string
          description: |
            Required when switcher=2.
            Timezone ID from “Get Timezone & Language List” API.
    browser_WebRTCConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: |
            WebRTC policy. Default:2. 1 = Privacy, 2 = Replacement, 3 = Real, 4 = Disabled, 5 = Forwarding.
    browser_GeoLocationConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Geolocation policy. Default:1. 1 = Prompt, 2 = Disabled.
        base_on_ip:
          type: boolean
          description: Generate location based on IP? Default:true. true = prompt, false = manual.
        latitude:
          type: number
