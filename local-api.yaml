      description: Batch ADB info query result
      properties:
        id:
          type: string
          description: Environment ID
        supportAdb:
          type: boolean
          description: Whether ADB is supported
        enableAdb:
          type: boolean
          description: Enable ADB 0 = Disabled, 1 = Enabled
        envStatus:
          type: integer
          description: |
            Environment status:
            - 0: New
            - 1: Creation failed
            - 2: Powered off
            - 3: Booting
            - 4: Powered on
            - 5: Resetting
            - 6: Restarting
            - 7: One-click new machine in progress
        adbIp:
          type:
            - string
            - "null"
          description: ADB connection IP address
        adbPassword:
          type:
            - string
            - "null"
          description: ADB connection password
        adbPort:
          type:
            - string
            - "null"
          description: ADB connection port
        command:
          type:
            - string
            - "null"
          description: ADB SSH tunnel connection command
        expireTime:
          type:
            - string
            - "null"
          description: ADB connection expiration time
        remark:
          type:
            - string
            - "null"
          description: |
            Remark info. When ADB info cannot be retrieved, the reason is provided:
            - Environment does not exist
            - Environment is not powered on, unable to query ADB info
            - This environment does not support ADB
            - Failed to retrieve ADB info
    cloudphone_ResponseDataListApiBatchAdbInfoResultDto:
      type: object
      properties:
        code:
          type: integer
          description: Response code, 0 indicates success
          example: 0
        msg:
          type:
            - string
            - "null"
          description: Response message
          example: success
        data:
          type: array
          description: ADB info list, in the same order as the requested envIds
          items:
            $ref: "#/components/schemas/cloudphone_ApiBatchAdbInfoResultDto"
    cloudphone_TouchClickRequest:
      type: object
      required:
        - id
        - pos
      properties:
        id:
          type: string
          description: Cloud Phone ID
          example: "1558968155668507"
        pos:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
          description: Tap coordinates [x, y]. The coordinate system uses the top-left corner as origin (0, 0).
          example:
            - 540
            - 960
        duration:
          type: integer
          description: Press duration in milliseconds (used for long press). If omitted, the default duration is used.
          example: 2000
    cloudphone_TouchSwipeRequest:
      type: object
      required:
        - id
        - pos1
        - pos2
      properties:
        id:
          type: string
          description: Cloud Phone ID
          example: "1558968155668507"
        pos1:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
          description: Start coordinates [x, y]
          example:
            - 540
            - 1500
        pos2:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
          description: End coordinates [x, y]
          example:
            - 540
            - 500
        duration:
          type: integer
          description: Swipe/drag duration in milliseconds. A larger value results in a slower action.
          example: 300
    cloudphone_TouchResultResponse:
      type: object
      properties:
        code:
          type: integer
          description: Status code, 0 means success
          example: 0
        msg:
          type:
            - string
            - "null"
          description: Response message
          example: success
        data:
          type: object
          properties:
            status:
              type: string
              description: Execution status
              example: finish
    cloudphone_ResponseEnvelopeBase:
      type: object
      required:
        - code
        - msg
        - requestId
      properties:
        code:
          type: integer
          description: Business result code; `0` indicates success
          example: 0
        msg:
          type:
            - string
            - "null"
          description: Error message; null when successful
          example: null
        requestId:
          type: string
          description: Request ID for troubleshooting
          example: 1d4f3ea968664593860b94b35d4ebf5e
    cloudphone_MonthlyCloudPhoneSkuPrice:
      type: object
      required:
        - price
        - period
        - periodUnit
      properties:
        price:
          type: integer
          minimum: 0
          description: Configured price in US cents
        period:
          type: integer
          description: Billing-period count returned by the product service
        periodUnit:
          type: string
          description: Localized billing-period unit returned by the product service
        priceDesc:
          type:
            - string
            - "null"
          description: Localized display price, when configured
    cloudphone_MonthlyCloudPhoneSku:
      type: object
      required:
        - skuId
        - skuName
        - prices
      properties:
        skuId:
          type: string
          description: Monthly Cloud Phone product ID
        skuName:
          type: string
          description: Product name returned in the product-service language
        cloudPhoneAndroidVersion:
          type:
            - string
            - "null"
          description: Android version, or null when the product has no configured value
        cloudPhoneStorage:
          type:
            - integer
            - "null"
          description: Storage capacity in GB, or null when the product has no configured value
        prices:
          type: array
          minItems: 1
          description: Active monthly price configurations
          items:
            $ref: "#/components/schemas/cloudphone_MonthlyCloudPhoneSkuPrice"
    cloudphone_MonthlyCloudPhoneActivateRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: One to ten distinct positive Cloud Phone IDs, encoded as strings to preserve 64-bit precision
          items:
            type: string
            pattern: ^[1-9][0-9]*$
    cloudphone_MonthlyCloudPhoneActivationResult:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          description: Cloud Phone ID
        status:
          type: string
          enum:
            - ACTIVATED
            - FAILED
            - UNKNOWN
          description: Activation result
        expireTime:
          type:
            - string
            - "null"
          pattern: ^[0-9]+$
          description: Unix time in milliseconds; present for a successful activation
        errorCode:
          type:
            - integer
            - "null"
          description: Business error code for a failed item
    cloudphone_MonthlyCloudPhoneActivationData:
      type: object
      required:
        - orderId
        - orderStatus
        - results
      properties:
        orderId:
          type: string
          description: Paid balance-order ID
        orderStatus:
          type: integer
          enum:
            - 1
          description: Order status; 1 means completed
        results:
          type: array
          description: One result per requested ID, in request order
          items:
            $ref: "#/components/schemas/cloudphone_MonthlyCloudPhoneActivationResult"
    cloudphone_CloudPhoneLiveStartRequest:
      type: object
      required:
        - phoneId
        - fileId
      properties:
        phoneId:
          type: string
          description: Cloud phone ID
          example: "190000000000000001"
        fileId:
          type: string
          description: ID of an uploaded MP4 live-streaming file (`uploadType=2`)
          example: "820000000000000001"
    cloudphone_CloudPhoneLivePhoneRequest:
      type: object
      required:
        - phoneId
      properties:
        phoneId:
          type: string
          description: Cloud phone ID
          example: "190000000000000001"
    cloudstorage_ApiResponseBase:
      type: object
      properties:
        code:
          type: integer
          description: Return result code. `0` means success; other codes indicate exceptions.
          example: 0
        msg:
          type:
            - string
            - "null"
          description: Error message.
          example: null
        requestId:
          type: string
          description: Operation request ID. This field may be present when the request passes through the API gateway.
          example: 1d4f3ea968664593860b94b35d4ebf5e
      required:
        - code
        - msg
    cloudstorage_StorageInfo:
      type: object
      properties:
        capacity:
          type: string
          description: Total cloud storage capacity in bytes.
          example: "10737418240"
        usedCapacity:
          type: string
          description: Used cloud storage capacity in bytes.
          example: "536870912"
        expireDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
          description: Cloud storage expiration date.
        capacityStatus:
          type: integer
          description: "Capacity status: 0 = normal, 1 = full."
          example: 0
        isExpired:
          type: boolean
          description: Whether the subscription plan has expired.
          example: false
    cloudstorage_FilePageRequest:
      type: object
      properties:
        pageNo:
          type: integer
          description: Current page number, starting from 1. Default is 1.
          minimum: 1
          default: 1
          example: 1
        pageSize:
          type: integer
          description: Number of items per page. Default is 10.
          minimum: 1
          default: 10
          example: 20
        fileName:
          type: string
          description: File name keyword for fuzzy search.
          example: report
        tagIds:
          type: array
          description: Filter files by tag IDs.
          items:
            type: string
          example:
            - "1800000000000101"
        fileType:
          type: integer
          description: "File type filter: 0 = image, 1 = video, 2 = application, 3 = audio, 4 = document, 5 = other."
          example: 0
        fileIds:
          type: array
          description: Filter files by file IDs.
          items:
            type: string
          example:
            - "1800000000001001"
    cloudstorage_TagInfo:
      type: object
      properties:
        id:
          type: string
          description: Tag ID.
          example: "1800000000000101"
        tagSource:
          type: string
          description: Tag source, e.g. ENV, PROXY.
          example: ENV
        tagName:
          type: string
          description: Tag name.
          example: Invoice
        tagType:
          type: string
          description: "Tag type: TAG or GROUP."
          example: TAG
        tagIcon:
          type: string
          description: Tag icon.
          example: ""
    cloudstorage_CloudStorageFile:
      type: object
      properties:
        id:
          type: string
          description: Cloud storage file ID.
          example: "1800000000001001"
        fileName:
          type: string
          description: File name (without extension).
          example: example
        fileExt:
          type: string
          description: File extension.
          example: jpg
        fileSize:
          type: string
          description: File size in bytes.
          example: "204800"
        fileType:
          type: integer
          description: "File type: 0 = image, 1 = video, 2 = application, 3 = audio, 4 = document, 5 = other."
          example: 0
        tagInfo:
          type: array
          description: Tag details attached to the file.
          items:
            $ref: "#/components/schemas/cloudstorage_TagInfo"
        createDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
          description: Upload time.
        updateDate:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
          description: Update time.
    cloudstorage_FilePageData:
      type: object
      properties:
        current:
          type: string
          example: "1"
        pages:
          type: string
          example: "7"
        total:
          type: string
          example: "128"
        dataList:
          type: array
          items:
            $ref: "#/components/schemas/cloudstorage_CloudStorageFile"
      required:
        - current
        - pages
        - total
        - dataList
    cloudstorage_UploadInitRequest:
      type: object
      properties:
        fileNames:
          type: array
          minItems: 1
          description: List of file names to upload (with extensions), e.g. photo.jpg, video.mp4.
          items:
            type: string
          example:
            - photo.jpg
            - video.mp4
      required:
        - fileNames
    cloudstorage_UploadInitResult:
      type: object
      properties:
        id:
          type: string
          description: Cloud storage file ID.
          example: "1800000000000001"
        fileName:
          type: string
          description: File name (with extension).
          example: photo.jpg
        presignedUrl:
          type: string
          description: S3 presigned upload URL. Use HTTPS PUT to upload the file content.
          example: https://example.com/presigned-upload-url
    cloudstorage_UploadCompleteRequest:
      type: object
      properties:
        id:
          type: string
          description: Cloud storage file ID returned by the presigned upload URL API.
          example: "1800000000000001"
      required:
        - id
    cloudstorage_FileDeleteRequest:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: string
          description: Cloud storage file IDs to delete.
          example:
            - "1800000000001001"
            - "1800000000001002"
      required:
        - ids
    cloudstorage_FileTagChangeRequest:
      type: object
      properties:
        fileId:
          type: string
          description: Cloud storage file ID.
          example: "1800000000001001"
        tagIds:
          type: array
          minItems: 1
          items:
            type: string
          description: Tag IDs.
          example:
            - "1800000000000101"
            - "1800000000000102"
      required:
        - fileId
        - tagIds
    cloudstorage_FileTagQueryRequest:
      type: object
      properties:
        fileIds:
          type: array
          minItems: 1
          items:
            type: string
          description: Cloud storage file IDs.
          example:
            - "1800000000001001"
      required:
        - fileIds
    cloudstorage_FileTagResultData:
      type: object
      properties:
        fileId:
          type: string
          description: Cloud storage file ID.
          example: "1800000000001001"
        tagIds:
          type: array
          items:
            type: string
          description: Tag IDs attached to the file.
          example:
            - "1800000000000101"
        tagInfo:
          type: array
          description: Tag details.
          items:
            $ref: "#/components/schemas/cloudstorage_TagInfo"
    cloudstorage_TagCreateRequest:
      type: object
      properties:
        tagName:
          type: string
          description: Tag name.
          example: Invoice
      required:
        - tagName
    cloudstorage_TagEditRequest:
      type: object
      properties:
        id:
          type: string
          description: Tag ID.
          example: "1800000000000101"
        tagName:
          type: string
          description: Tag name.
          example: Invoice 2026
      required:
        - id
        - tagName
    cloudstorage_TagDeleteRequest:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          items:
            type: string
          description: Tag IDs to delete.
          example:
            - "1800000000000101"
      required:
        - ids
  responses:
    browser_VoidDataResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/browser_ApiResponseBase"
              - type: object
                properties:
                  data:
                    type: "null"
                    example: null
    browser_CloudBrowserPageResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/browser_ApiResponseBase"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/browser_CloudBrowserPageData"
                required:
                  - data
    browser_CloudBrowserConnectResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/browser_ApiResponseBase"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/browser_CloudBrowserConnectResult"
                required:
                  - data
          example:
            code: 0
            msg: null
            data:
              cdpUrl: https://runtime1.morelogin.com:16167?token=c62fedaaac524e41a0f02fc4345d41cb
              accessUrl: https://official-website.morelogin.com/browser-remote?token=eyJkZXNrdG9wVXJsIjoi...ZW52SWQiOiIyMDczMzk1NDg5NzM4OTE5OTM2In0%3D&envName=P-1267&lang=en-US
            requestId: 1d4f3ea968664593860b94b35d4ebf5e
    cloudphone_BalanceResponse:
      description: Request processed; inspect `code` for the business result
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/cloudphone_ResponseEnvelopeBase"
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - balance
                      - remainingDuration
                      - remainingConcurrency
                    properties:
                      balance:
                        type: integer
                        format: int32
                        description: Available wallet balance in cents
                      remainingDuration:
                        type: string
                        pattern: ^[0-9]+$
                        description: Remaining cloud phone duration in minutes, serialized as a numeric string
                      remainingConcurrency:
                        type: integer
                        minimum: 0
                        description: Remaining team-level cloud phone concurrency
          example:
            code: 0
            msg: null
            data:
              balance: 12500
              remainingDuration: "120"
              remainingConcurrency: 3
            requestId: 1d4f3ea968664593860b94b35d4ebf5e
    cloudphone_MonthlyCloudPhoneSkusResponse:
      description: Request processed; `data` is an empty array when no monthly product is available
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/cloudphone_ResponseEnvelopeBase"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/cloudphone_MonthlyCloudPhoneSku"
          example:
            code: 0
            msg: null
            data:
              - skuId: "10015"
                skuName: Android 14
                cloudPhoneAndroidVersion: Android 14
                cloudPhoneStorage: 64
                prices:
                  - price: 2500
                    period: 30
                    periodUnit: days
                    priceDesc: $25/30 days
            requestId: 36d574df5b9e41b5b3c796133ff5a079
    cloudphone_MonthlyCloudPhoneActivateResponse:
      description: Request processed; inspect `code`, and inspect `data.results` when returned
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/cloudphone_ResponseEnvelopeBase"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/cloudphone_MonthlyCloudPhoneActivationData"
          example:
            code: 0
            msg: null
            data:
              orderId: "1724032801202461"
              orderStatus: 1
              results:
                - id: "1724032706822188"
                  status: ACTIVATED
                  expireTime: "1791103955843"
                  errorCode: null
            requestId: db5e04c2eb804cdfb96b1469c7379bbc
    cloudphone_CloudPhoneLiveBooleanResponse:
      description: Request processed; inspect `code` for the business result
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/cloudphone_ResponseEnvelopeBase"
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: boolean
                    description: Whether the live-streaming operation succeeded
          example:
            code: 0
            msg: null
            data: true
            requestId: 1d4f3ea968664593860b94b35d4ebf5e
    cloudphone_CloudPhoneLiveStatusResponse:
      description: Request processed; inspect `code` for the business result
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/cloudphone_ResponseEnvelopeBase"
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      liveStatus:
                        type: integer
                        enum:
                          - 0
                          - 1
                        description: Live status (`0` = stopped, `1` = running)
                      writeFileId:
                        type:
                          - string
                          - "null"
                        description: Current file ID, when available
                      liveFilePath:
                        type:
                          - string
                          - "null"
                        description: Current file path or URL, when available
          example:
            code: 0
            msg: null
            data:
              liveStatus: 1
              writeFileId: "820000000000000001"
              liveFilePath: null
            requestId: 1d4f3ea968664593860b94b35d4ebf5e
    cloudstorage_StorageInfoResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/cloudstorage_ApiResponseBase"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/cloudstorage_StorageInfo"
                required:
                  - data
    cloudstorage_FilePageResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/cloudstorage_ApiResponseBase"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/cloudstorage_FilePageData"
                required:
                  - data
    cloudstorage_UploadInitResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/cloudstorage_ApiResponseBase"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/cloudstorage_UploadInitResult"
                required:
                  - data
    cloudstorage_UploadCompleteResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/cloudstorage_ApiResponseBase"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/cloudstorage_CloudStorageFile"
                required:
                  - data
    cloudstorage_VoidDataResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/cloudstorage_ApiResponseBase"
              - type: object
                properties:
                  data:
                    type: "null"
                    example: null
    cloudstorage_FileTagsResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/cloudstorage_ApiResponseBase"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/cloudstorage_FileTagResultData"
                required:
                  - data
    cloudstorage_TagListResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/cloudstorage_ApiResponseBase"
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/cloudstorage_TagInfo"
                required:
                  - data
    cloudstorage_TagResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/cloudstorage_ApiResponseBase"
              - type: object
                properties:
                  data:
                    $ref: "#/components/schemas/cloudstorage_TagInfo"
                required:
                  - data
    cloudstorage_BooleanDataResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/cloudstorage_ApiResponseBase"
              - type: object
                properties:
                  data:
                    type: boolean
                    example: true
                required:
                  - data
