openapi: 3.1.0
info:
  title: MoreLogin Local API (Combined)
  version: 2026-09-05
servers:
  - url: http://127.0.0.1:40000
paths:
  /api/env/start:
    post:
      summary: Start browser profile
      operationId: startBrowserProfileUsingPOST
      deprecated: false
      description: >-
        Used to start the profile; you must specify the profile ID. After

        successful startup, you can obtain the profile debug interface for

        executing Selenium and Puppeteer automation. For Selenium, use the

        WebDriver matching the corresponding kernel version. The WebDriver path

        can be retrieved from the response after profile startup. Requires

        MoreLogin client version 2.15.0 or higher.


        Documented business errors: `19099`, `19143`. See [Error Codes](../Getting%20Started/error-codes.md) for what
        each code means. Any operation can additionally return the common codes.
      tags:
        - Runtime
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                envId:
                  type: string
                  description: |
                    Environment ID. At least one of `envId` or `uniqueId` must be provided.
                    If both are given, `envId` takes precedence.
                  example: "1993244721490239488"
                uniqueId:
                  type: integer
                  description: >
                    Environment serial number (small integer ID). At least one of `envId` or `uniqueId` must be
                    provided.

                    If both are given, `envId` takes precedence.
                  example: 1
                encryptKey:
                  type: string
                  description: |
                    Encryption key. Required only if end-to-end encryption is enabled for the environment.
                  example: xxx
                isHeadless:
                  type: boolean
                  description: |
                    Whether to start in headless mode. Defaults to `false` if omitted.
                    Note: Requires client version v2.36.0 or higher.
                  default: false
                  example: false
                cdpEvasion:
                  type: boolean
                  description: |
                    Enable CDP fingerprint evasion to reduce detection risk.
                    Only applies to PC environments.
                    default:`false`.
                    Note: Requires client version v2.36.0 or higher.
                  default: false
                  example: false
                closeCheckIPPage:
                  type: boolean
                  description: |
                    Whether to skip opening the detection page.
                    true: Proxy detection before execution
                    false: Proxy detection after execution
                    Note: Requires client version v2.56.0 or higher.
                  default: false
                  example: false
                checkIPErrorHandle:
                  type: integer
                  description: |
                    Action to take if proxy detection fails
                    Numeric type: 1 or 2
                    1: Do not start the environment if proxy detection fails
                    2: Start the environment even if proxy detection fails
                    If closeCheckIPPage is passed a parameter, this parameter is omitted; default: 1
                    Note: Requires client version v2.56.0 or higher.
                  default: 1
                  example: 1
            example:
              envId: "1993244721490239488"
              isHeadless: false
              cdpEvasion: true
      responses:
        "200":
          description: Success. `data` is an object with the fields `envId`, `debugPort`, `type`, `version` and `webdriver`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: object
                    properties:
                      envId:
                        type: string
                        description: profile
                      debugPort:
                        type: string
                      type:
                        type: string
                      version:
                        type: integer
                      webdriver:
                        type: string
                    required:
                      - envId
                      - debugPort
                      - type
                      - version
                      - webdriver
                  requestId:
                    type: string
                    description: Unique request identifier; include it when contacting support
                required:
                  - data
              example:
                code: 0
                msg: null
                data:
                  envId: "1673823102599682"
                  debugPort: "9222"
                  type: string
                  version: 1
                  webdriver: string
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
          headers: {}
      security: []
  /api/env/close:
    post:
      operationId: closeBrowserProfileLocal
      summary: Stop browser profile
      deprecated: false
      description: >-
        Close a running browser profile.


        - **Where it runs**: the MoreLogin desktop client handles this entirely on your machine. There is no server-side
        implementation, so there are no account, team or state preconditions beyond the client having the profile open,
        and nothing is recorded in the cloud.

        - **Effect**: limited to local browser processes and windows. Profile data, fingerprints and cloud cache are
        untouched.

        - **Completion**: synchronous — the client answers once it has acted.

        - **Availability**: Local API only. There is no Open API equivalent, because the Open API has no local browser
        to operate on. Use the cloud runtime endpoints instead.

        - **Note**: because the client owns this, the response shape depends on the installed client version rather than
        on a service contract.
      tags:
        - Runtime
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                envId:
                  description: Environment ID or serial number — at least one must be provided; if both, envId takes precedence.
                  type: string
                uniqueId:
                  description: Environment serial number — at least one of 'envId' or 'uniqueId' must be provided; if both, 'envId' takes
                    precedence.
                  type: integer
            example:
              envId: "1869649942658850816"
              uniqueId: 0
      responses:
        "200":
          description: Success. `data` is an object with the fields `envId` and `debugPort`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: object
                    properties:
                      envId:
                        type: string
                      debugPort:
                        type: string
                    required:
                      - envId
                      - debugPort
                  requestId:
                    type: string
                    description: Unique request identifier; include it when contacting support
                required:
                  - code
                  - msg
                  - data
              example:
                code: 0
                msg: null
                data:
                  envId: "1673823102599682"
                  debugPort: "9222"
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
          headers: {}
      security: []
  /api/env/create/quick:
    post:
      operationId: createBrowserProfileQuickLocal
      summary: Quick create browser profile
      deprecated: false
      description: >-
        Create 1 to 200 browser profiles that share one configuration.


        - **Preconditions**: the team plan must have enough remaining profiles, and the daily creation quota must not be
        exhausted. `isEncrypt=1` requires the team to have an encryption key configured. Firefox is only available on
        Windows and macOS. A `groupId` must already exist, but passing `groupName` instead creates the group
        automatically.

        - **Effect**: inserts the profiles, consumes plan capacity, and increments the daily creation counter. Passing
        proxy connection details can also create a proxy record.

        - **Completion**: synchronous. `data` holds the new profile IDs in creation order.

        - **Retry**: not idempotent, and there is no idempotency key. Confirm with `/env/page` instead of retrying.

        - **Local API**: kernel candidates are filtered by the running desktop client version, and concurrent calls from
        one team are serialized by a team-level lock.


        Documented business errors: `19002`, `19063`, `19064`, `19104`, `19106`, `19107`, `19108`, `19111`, `19112`,
        `14023`. See [Error Codes](../Getting%20Started/error-codes.md) for what each code means. Any operation can
        additionally return the common codes.
      tags:
        - Profiles
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                browserTypeId:
                  description: 1:Chrome, 2:Firefox
                  type: integer
                  example: 1
                groupId:
                  description: Environment group ID; default:ungrouped (0)
                  type: string
                  example: "0"
                groupName:
                  description: "Group name (max 50 characters). If provided, the system first checks groupId: if a valid group is found,
                    it is used; otherwise, it searches by groupName. If a group with that name exists, it is referenced;
                    if not, a new group is created. Each team is limited to 1,000 groups."
                  type: string
                  maxLength: 50
                  example: ""
                isEncrypt:
                  description: Enable end-to-end encryption? 0:No, 1:Yes; default:0
                  type: integer
                operatorSystemId:
                  description: OS type 1:Windows, 2:macOS, 3:Android, 4:iOS
                  type: integer
                  example: 1
                quantity:
                  description: Number of environments to create; range:[1–50]
                  type: integer
                  minimum: 1
                  maximum: 50
                  example: 1
                browserCore:
                  description: Browser kernel version; default:0 (auto-match). Obtain available versions via
                    '/api/env/advanced/ua/versions'
                  type: integer
                  example: 140
                proxy:
                  type: object
                  properties:
                    proxyId:
                      description: Proxy ID
                      type: string
                    proxyName:
                      description: Proxy name (maximum 600 characters)
                      type: string
                    proxyType:
                      description: "Proxy type, 0: http, 1: https. Cannot be empty when proxyProvider is 7/8"
                      type: integer
                    proxyProvider:
                      description: "Proxy type 0: http, 1: https, 2: socks5, 3: ssh, 4: Oxylabs, 5: Proxys.io, 7: Luminati, 8: Lumauto, 9:
                        Oxylabsauto, 10: Trojan, 11: Shadowsocks, 13: ABCPROXY, 14: LunaProxy, 15: IPHTML, 16: PiaProxy,
                        17: 922S5, 18: 360Proxy"
                      type: string
                    proxyIp:
                      description: Proxy IP. Can be empty when proxyProvider is 16/17/18; required for others
                      type: string
                    proxyPort:
                      description: Proxy port (only numbers 1-65535 allowed). Can be empty when proxyProvider is 16/17/18; required for others
                      type: integer
                    username:
                      description: Username (maximum 200 characters)
                      type: string
                    password:
                      description: Password (maximum 100 characters)
                      type: string
                    refreshUrl:
                      description: Refresh URL
                      type: string
                    country:
                      description: Country code (e.g. `us`). See [Country Time Zone Table](/api-reference/appendix/country-time-zone) for
                        supported codes. Required when proxyProvider is 16/17/18
                      type: string
                    city:
                      description: City
                      type: string
                    state:
                      description: State/Province
                      type: string
                    encryptionType:
                      description: "Encryption method. Cannot be empty when proxyProvider is 11. 1: aes-128-gcm, 2: aes-192-gcm, 3:
                        aes-256-gcm, 4: aes-128-cfb, 5: aes-192-cfb, 6: aes-256-cfb, 7: aes-128-ctr, 8: aes-192-ctr, 9:
                        aes-256-ctr, 10: rc4-md5, 11: chacha20-ietf, 12: xchacha20, 13: chacha20-ietf-poly1305, 14:
                        xchacha20-ietf-poly1305"
                      type: integer
                    ipMonitor:
                      description: "Enable IP change monitoring? true: On, false: Off"
                      type: boolean
                    ipChangeAction:
                      description: "IP change monitoring 0: Block access, 1: Warn"
                      type: integer
                  description: Proxy information
              required:
                - browserTypeId
                - operatorSystemId
                - quantity
            example:
              browserTypeId: 1
              operatorSystemId: 1
              quantity: 1
      responses:
        "200":
          description: Success. `data` is an array of strings, and an empty array when there is nothing to return.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: array
                    items:
                      type: string
                  requestId:
                    type: string
                required:
                  - code
                  - msg
                  - data
                  - requestId
              example:
                code: 0
                msg: null
                data:
                  - string
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
          headers: {}
      security: []
  /api/env/create/advanced:
    post:
      operationId: createBrowserProfileAdvancedLocal
      summary: Advanced create browser profile
      deprecated: false
      description: >-
        Create one browser profile with a full fingerprint configuration.


        - **Preconditions**: same plan and daily quota checks as quick create. The profile name must be unique within
        the team, coordinates must fall outside mainland China, and `advancedSetting.ua` must agree with `uaVersion`. A
        supplied `proxyId` must already exist in the team.

        - **Effect**: inserts the profile, its account credentials (encrypted at rest) and post-start configuration;
        consumes plan capacity and the daily creation counter. A custom platform URL also creates a site record.

        - **Completion**: synchronous. `data` holds the new profile ID.

        - **Retry**: not idempotent. A second call with the same explicit `envName` fails on the uniqueness check;
        without a name it creates a duplicate. There is no idempotency key. Do not retry blindly after a timeout — query
        state first.

        - **Local API**: kernel candidates are filtered by the running desktop client version, and concurrent calls from
        one team are serialized by a team-level lock.


        Documented business errors: `19001`, `19002`, `19004`, `19005`, `19063`, `19064`, `19100`, `19101`, `19102`,
        `19103`, `19104`, `19105`, `19106`, `19107`, `19108`, `19109`, `19110`, `19111`, `19112`, `19141`, `19175`. See
        [Error Codes](../Getting%20Started/error-codes.md) for what each code means. Any operation can additionally
        return the common codes.
      tags:
        - Profiles
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/browser_CreateEnvironmentRequest"
            example:
              browserTypeId: 1
              operatorSystemId: 1
              isEncrypt: 1
      responses:
        "200":
          description: Success. `data` is a single string value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: string
                  requestId:
                    type: string
                required:
                  - code
                  - msg
                  - data
                  - requestId
              example:
                code: 0
                msg: null
                data: string
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
          headers: {}
      security: []
  /api/env/update:
    post:
      operationId: updateBrowserProfileLocal
      summary: Modify browser profile
      deprecated: false
      description: >-
        Update an existing browser profile. Only the fields present in the request are changed.


        - **Preconditions**: the profile must exist in the team. End-to-end encrypted profiles cannot be updated. The
        operating system and browser type cannot be changed. A running profile can be updated.

        - **Effect**: writes the profile row, its expanded settings and cookies, and merges the advanced fingerprint
        settings (existing values are kept unless overwritten).

        - **Completion**: synchronous.

        - **Retry**: safe to repeat with the same body. Note there is no optimistic locking: concurrent updates to one
        profile are last-write-wins, and the fingerprint merge reads before it writes, so concurrent callers can lose
        changes.


        Documented business errors: `19001`, `19039`, `19104`, `19105`, `19106`, `19107`, `19108`, `19142`, `19159`,
        `19160`, `19175`, `19193`. See [Error Codes](../Getting%20Started/error-codes.md) for what each code means. Any
        operation can additionally return the common codes.
      tags:
        - Profiles
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/browser_UpdateEnvironmentRequest"
            example:
              browserTypeId: 1
              operatorSystemId: 1
              isEncrypt: 1
              envId: "1661515884160372"
      responses:
        "200":
          description: Success. `data` is always null for this operation; the outcome is carried by `code`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: "null"
                  requestId:
                    type: string
                required:
                  - code
                  - msg
                  - data
                  - requestId
              example:
                code: 0
                msg: null
                data: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
          headers: {}
      security: []
  /api/env/removeToRecycleBin/batch:
    post:
      summary: Delete browser profile
      operationId: batchDeleteBrowserProfilesUsingPOST
      deprecated: false
      description: >-
        Move one or more browser profiles to the recycle bin.


        - **Preconditions**: the profile must not already be in the recycle bin, must not be running, and must not be
        mid-transfer. Close the browser first.

        - **Effect**: a soft delete. The row, fingerprint and cloud cache are kept and the profile is flagged as
        recycled with a timestamp. Plan capacity is released immediately, but the daily creation counter is not
        refunded.

        - **Completion**: synchronous.

        - **Recovery**: restoring from the recycle bin is not exposed on the API surface — use the MoreLogin client or
        web console.

        - **Retry**: repeating the call reports the profile as already deleted; it cannot double-delete.
      tags:
        - Profiles
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - envIds
              properties:
                envIds:
                  type: array
                  description: List of environment (browser profile) IDs to delete.
                  items:
                    type: string
                    example: "1868548141708648448"
                  minItems: 1
                  example:
                    - "1868548141708648448"
                    - "1868548141708648449"
                removeEnvData:
                  type: boolean
                  description: |
                    Also delete local configuration files?
                    Supported in v2.28.0+.
                  default: false
                  example: false
            example:
              envIds:
                - "1868548141708648448"
              removeEnvData: false
      responses:
        "200":
          description: Success. `data` is a single boolean value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: boolean
                  requestId:
                    type: string
                required:
                  - code
                  - msg
                  - data
                  - requestId
              example:
                code: 0
                msg: null
                data: true
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
          headers: {}
      security: []
  /api/env/page:
    post:
      summary: Get a list of browser profiles
      operationId: listBrowserProfilesUsingPOST
      deprecated: false
      description: >-
        List the browser profiles visible to the authenticated member, page by page.


        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Filtering**: `keyword` matches profile name, remark, tag name and group name. `groupId` of `0` means
        ungrouped.

        - **Note**: proxy passwords are withheld for ordinary members and for platform or dynamic proxies.
      tags:
        - Profiles
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                envName:
                  type: string
                  description: Filter by environment (profile) name. Empty string returns all.
                  example: ""
                groupId:
                  type: string
                  description: Filter by group ID. Use 0 for ungrouped profiles.
                  default: 0
                  example: "0"
                envId:
                  type: string
                  description: |
                    Filter by specific environment ID.
                    If provided, other filters may be ignored.
                  example: "1869988538611834880"
                pageNo:
                  type: integer
                  description: Page number (1-based index).
                  default: 1
                  minimum: 1
                  example: 1
                pageSize:
                  type: integer
                  description: Number of items per page.
                  default: 10
                  minimum: 1
                  maximum: 100
                  example: 10
            example:
              pageNo: 1
              pageSize: 10
      responses:
        "200":
          description: Success. `data.dataList` holds the records for the requested page and is an empty array when there are no
            matches; `data.total`, `data.current` and `data.pages` describe the paging.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: object
                    properties:
                      total:
                        type: string
                      current:
                        type: string
                      pages:
                        type: string
                      dataList:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: Browser profile ID
                            envName:
                              type: string
                              description: Profile name
                            groupId:
                              type: string
                              description: Group ID
                            groupName:
                              type:
                                - string
                                - "null"
                              description: Group name. `null` when the profile is ungrouped
                            tagInfos:
                              type: array
                              description: Tag details. Empty array when no tags are assigned
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: Tag ID
                                  tagName:
                                    type: string
                                    description: Tag name
                                required:
                                  - id
                                  - tagName
                            envRemark:
                              type:
                                - string
                                - "null"
                              description: Profile remark
                            proxyId:
                              type: string
                              description: Proxy ID. `0` means no proxy
                            proxy:
                              type:
                                - object
                                - "null"
                              description: Proxy configuration. `null` when no proxy is assigned
                              properties:
                                id:
                                  type: string
                                  description: Proxy ID
                                proxyName:
                                  type: string
                                  description: Proxy name
                                proxyType:
                                  type: integer
                                  description: Proxy type
                                proxyProvider:
                                  type: integer
                                  description: Proxy type
                                proxyCategoryType:
                                  type: integer
                                  description: Proxy category type
                                proxyCheckStatus:
                                  type: integer
                                  description: Proxy check status
                                proxyStatus:
                                  type: integer
                                  description: Proxy status
                                state:
                                  type:
                                    - string
                                    - "null"
                                  description: Proxy state or province. Uses detected exit-IP location when available, otherwise the configured location;
                                    may be null or empty.
                                  example: California
                                city:
                                  type:
                                    - string
                                    - "null"
                                  description: Proxy city. Uses detected exit-IP location when available, otherwise the configured location; may be null
                                    or empty.
                                  example: Los Angeles
                                proxyPort:
                                  type:
                                    - integer
                                    - "null"
                                  format: int32
                                  description: Proxy connection port, not a port inferred from the proxy name. May be null when unavailable.
                                  example: 1080
                                proxyIp:
                                  type: string
                                  description: Proxy IP address
                                exportIp:
                                  type: string
                                  description: Export IP address
                                countryCode:
                                  type: string
                                  description: Country code
                                expiryTime:
                                  type:
                                    - string
                                    - "null"
                                  description: Expiry timestamp
                                username:
                                  type: string
                                  description: Proxy username
                                password:
                                  type:
                                    - string
                                    - "null"
                                  description: Proxy password
                                refreshUrl:
                                  type:
                                    - string
                                    - "null"
                                  description: Proxy refresh URL
                    required:
                      - total
                      - current
                      - pages
                      - dataList
                  requestId:
                    type: string
                required:
                  - code
                  - msg
                  - data
                  - requestId
              example:
                code: 0
                msg: null
                data:
                  total: "1"
                  current: "1"
                  pages: "1"
                  dataList:
                    - id: "1673823102599682"
                      envName: example-name
                      groupId: "1673823102599682"
                      groupName: example-name
                      tagInfos:
                        - id: "1673823102599682"
                          tagName: example-name
                      envRemark: example remark
                      proxyId: "1673823102599682"
                      proxy:
                        id: "1673823102599682"
                        proxyName: example-name
                        proxyType: 1
                        proxyProvider: 1
                        proxyCategoryType: 1
                        proxyCheckStatus: 1
                        proxyStatus: 1
                        state: California
                        city: Los Angeles
                        proxyPort: 1080
                        proxyIp: string
                        exportIp: "9222"
                        countryCode: string
                        expiryTime: 2026-09-01 12:00:00
                        username: example-name
                        password: string
                        refreshUrl: https://example.com/resource
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
          headers: {}
      security: []
  /api/env/detail:
    post:
      summary: Get browser profile details
      operationId: getBrowserProfileDetailsUsingPOST
      deprecated: false
      description: >-
        Return the full configuration of a single browser profile, including advanced fingerprint settings and cookies.


        - **Preconditions**: the profile must exist in the team and the caller must be authorized for it.

        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Note**: account passwords and 2FA secrets are only returned to the team owner, or when the profile is not
        configured to hide them.
      tags:
        - Profiles
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - envId
              properties:
                envId:
                  type: string
                  description: Target environment (browser profile) ID
                  example: "1869988538611834880"
            example:
              envId: "1869988538611834880"
      responses:
        "200":
          description: Success. `data` is an object with the fields `id`, `envName`, `browserTypeId`, `operatorSystemId`,
            `groupId`, `groupName`, ….
          content:
            application/json:
              schema:
                type: object
