  /api/cloudphone/download:
    post:
      operationId: downloadCloudPhoneFileLocal
      summary: Request File Download
      deprecated: false
      description: >-
        Download a file from a Cloud Phone.


        - **Preconditions**: the phone must be powered on and not held by another member.

        - **Effect**: the service scans the parent directory first and only then starts the transfer, so a missing path
        fails **here** rather than on the status poll. It must match a regular file, not a directory.

        - **Completion**: **accepted, not complete.** The response returns `downId`; poll `/cloudphone/download/result`
        until the status is succeeded, failed or cancelled. The status endpoint re-checks that the phone is still
        powered on and still yours.

        - **Retry**: not idempotent — each call rescans and issues a new `downId`.


        Documented business errors: `33300`, `33301`, `33507`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the common codes.
      tags:
        - Files
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Cloud phone ID
                filePath:
                  type: string
                  description: |
                    file path: /sdcard/Download/a.txt
              required:
                - filePath
                - id
            example:
              filePath: /sdcard/Download/report.csv
              id: "1661515884160372"
        required: true
      responses:
        "200":
          description: Success. `data` is an object with the fields `id` and `downId`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response code, 0 indicates success,>0 indicates failure
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Cloud phone id
                      downId:
                        type: string
                        description: "File download id "
                    required:
                      - id
                      - downId
                  requestId:
                    type: string
                required:
                  - code
                  - msg
                  - data
