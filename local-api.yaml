  /api/cloudphone/powerOff:
    post:
      summary: Stop Cloud Phone
      description: >-
        Stop a Cloud Phone.


        - **Preconditions**: the phone must be booting or powered on. It cannot be stopped while held by another member,
        or while a one-click new device, restart or reset is in progress.

        - **Effect**: stops billing, releases the concurrency slot, settles usage, and invalidates the connection
        credentials issued for the session. Stopping a phone that was still booting interrupts the start instead.

        - **Completion**: billing and local state are settled synchronously; device shutdown continues afterwards, so
        confirm with `/cloudphone/info`.

        - **Retry**: a second call reports the phone as not running. Batches abort on the first failure, so re-read
        state before retrying.


        Documented business errors: `33300`, `33301`, `33308`, `33331`, `33332`, `33333`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means. Any operation can additionally return the
        common codes.
      operationId: powerOffUsingPOST
      tags:
        - Cloud Phone Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
            example:
              id: "1596527092376632"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Return result code 0:Normal Other codes are exceptions.
                  msg:
                    type:
                      - string
                      - "null"
                    description: Error message
                  requestId:
                    type: string
                    description: Operation Request ID
                required:
                  - code
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/edit/batch:
    post:
      summary: Update Cloud Phone Profile
      description: >-
        Update the configuration of one or more Cloud Phones.


        - **Preconditions**: the phones must belong to the team. Region, language and coordinate values are validated
        for each device model, exactly as on create. Moving a phone into a group you are not authorized for is rejected.

        - **Effect**: overwrites the phone settings and refreshes the GPS configuration; may create tag bindings.
        Nothing is charged and concurrency is unaffected.

        - **Completion**: synchronous, and idempotent for the same body.
      operationId: editBatchUsingPOST
      tags:
        - Cloud Phone Management
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: array
                  items:
                    type: string
                  description: Cloud phone IDs
                envName:
                  type: string
                  maxLength: 64
                  minLength: 1
                  description: Cloud phone name (≤64 chars)
                phoneNumber:
                  type: string
                  description: Customize your phone number. Format requirements:Must begin with a + sign, country code must be 1-3 digits
                    (excluding 86), total length 8-14 digits, and contain only + and numbers.
                powerOnBillingStrategy:
                  type: integer
                  enum:
                    - 0
                    - 1
                  description: Non-Monthly cloud phone billing method (0:default, 1:parallel pack only)
                proxyId:
                  type: string
                  description: Proxy ID
                groupId:
                  type: string
                  description: Environment group ID
                groupName:
                  type: string
                  maxLength: 50
                  description: Existing group name, or a new group name to create when no matching group exists.
                tags:
                  type: array
                  items:
                    type: string
                  description: Replacement tag names. Blank values are ignored.
                envRemark:
                  type: string
                  maxLength: 1500
                  description: Environment remark (≤1500 chars, line breaks supported)
                automaticGeo:
                  type: boolean
                  description: Auto geolocation
                automaticLanguage:
                  type: boolean
                  description: Auto language
                automaticLocation:
                  type: boolean
                  description: Auto location (timezone & country)
                country:
                  type: string
                  description: Country
                timezone:
