  /api/cloudphone/setProxy:
    post:
      tags:
        - Cloud Phone Management
      summary: Set cloud phone proxy
      description: >-
        Bind a proxy to one or more Cloud Phones.


        - **Preconditions**: provide at least one of `ids` or `uniqueIds`. The phones must belong to your team; they do
        **not** need to be powered on. A supplied `proxyId` must exist, otherwise the call is rejected.

        - **Effect**: when `proxyId` is omitted or `0`, an existing proxy with identical connection details is reused
        and **a new proxy record is created in your team if none matches**. The proxy check state is reset and the
        previous proxy is remembered.

        - **Completion**: synchronous. **Phones that are powered on receive the new proxy immediately — no restart is
        needed**; powered-off phones pick it up on next start.

        - **Retry**: rebinding an existing `proxyId` is idempotent, but repeating a call that carries raw connection
        details can create another proxy record each time deduplication misses.


        Documented business errors: `33300`, `33303`, `33320`, `14023`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means. Any operation can additionally return the
        common codes.
      operationId: setProxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudphone_CloudPhoneSetProxyApiDto"
            example:
              ids:
                - "1558968155668507"
              uniqueIds:
                - 1001
              proxy:
                proxyIp: 192.168.1.100
                proxyPort: 8080
                proxyProvider: 2
      responses:
        "200":
          description: Success. `data` is always null for this operation; the outcome is carried by `code`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: "Response code: 0 = success, >0 = error"
                  data:
                    type: "null"
                  msg:
                    type:
                      - string
                      - "null"
                    description: Message; populated if code > 0
                  requestId:
                    type: string
                    description: Unique request identifier; include it when contacting support
              example:
                code: 0
                data: null
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/delete/batch:
    post:
      summary: Delete Cloud Phone
      description: >-
        Release one or more Cloud Phones.


        - **Preconditions**: the phones must not be mid-transfer and the team must have no unpaid order for them. The
        phone does not have to be powered off.

        - **Effect**: the Cloud Phone instance is released immediately. A phone that was never activated is deleted
        outright; an activated phone is retained as a deactivated record, so it keeps appearing in listings with a
        deactivated status.

        - **Completion**: synchronous.

        - **Retry**: phones are processed one by one and the call aborts on the first failure, so a partially applied
        batch is possible. Re-read `/cloudphone/page` before retrying, and retry only the phones that are still active.
      operationId: deleteUsingPOST
      tags:
        - Cloud Phone Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
              required:
                - ids
            example:
              ids:
                - "1595755686723985"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Return result code 0:Normal Other codes are exceptions.
                  msg:
                    type:
                      - string
                      - "null"
                    description: Error message
                  requestId:
                    type: string
                    description: Operation Request ID
                required:
                  - code
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/newMachine:
    post:
      summary: One-click new machine
      description: >-
        Replace a Cloud Phone's device identity in place (one-click new device).


        - **Preconditions**: the phone must be powered on and not held by another member. A supplied brand and model
        must be one the phone's SKU supports. **This consumes the daily Cloud Phone creation quota**, the same quota
        `/cloudphone/create` uses.

        - **Effect**: pushes a new brand and model to the device, clears the installed-app records for that phone,
        resets its phone number, and aborts any running AI task. The exact set of identifiers the service regenerates is
        not defined by MoreLogin.

        - **Completion**: **accepted, not complete.** The phone sits in a one-click-new-device state; poll
        `/cloudphone/info` until it leaves that state.

        - **Concurrency**: while it runs, power on, power off and every command that needs a running phone are rejected.
        A concurrent second call is rejected rather than queued.


        Documented business errors: `33300`, `33301`, `33326`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the common codes.
      operationId: oneNewUsingPOST
      tags:
        - Cloud Phone Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Cloud phone ID
                brand:
                  type: string
                  description: Brand
                modelId:
                  type: integer
                  description: Model ID
            example:
              id: "1595372958075305"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response code:0 indicates success, >0 indicates failure
                  msg:
                    type:
                      - string
                      - "null"
                  requestId:
                    type: string
                    description: Unique request identifier; include it when contacting support
                required:
                  - code
                  - msg
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
