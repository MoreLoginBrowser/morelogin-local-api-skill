                  items:
                    type: string
                    description: Environment IDs, array type, must choose one between this and serial IDs
                groupName:
                  description: Group name, string type, required
                  type: string
                uniqueIds:
                  type: array
                  items:
                    type: string
                  description: Serial IDs, array type, must choose one between this and environment IDs
              required:
                - groupName
            example:
              groupName: example-name
        required: true
      responses:
        "200":
          description: Success. `data` is a single boolean value.
          content:
            application/json:
              schema:
                type: object
                properties:
