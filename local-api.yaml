  /api/cloudphone/rpa/subTask/cancel/{id}:
    post:
      operationId: cancelCloudPhoneRpaSubTaskLocal
      summary: Cancel Execution
      deprecated: false
      description: >-
        Cancel a single RPA execution without touching its schedule.


        - **Preconditions**: the execution record must exist in the team. A finished one cannot be cancelled; an already
        cancelled one returns success without doing anything.

        - **Effect**: **queues a cancel request only — no state is written by this call.** The schedule keeps running
        and later executions are unaffected. Use `/cloudphone/rpa/task/cancel` to stop the schedule itself.

        - **Completion**: asynchronous. Poll `/cloudphone/rpa/subTask/page` or the execution detail until the state
        becomes cancelled. An execution that is already running is not stopped instantly.

        - **Retry**: idempotent; a repeat only re-queues the request.
      tags:
        - Schedules
      parameters:
        - name: id
          in: path
          description: ""
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Plan id
              required:
                - id
            example:
              id: "1678919049331329"
        required: true
      responses:
        "200":
          description: Success. `data` is always null for this operation; the outcome is carried by `code`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response code, 0 indicates success,>0 indicates failure
                  msg:
                    type:
                      - string
                      - "null"
                    description: Error msg
                  requestId:
                    type: string
                    description: Request trace id
                  data:
                    type: "null"
                required:
                  - code
                  - data
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
                data: null
          headers: {}
      security: []
  /api/cloudphone/touch/click:
    post:
      tags:
        - Touch
      summary: Touch - Click
      description: >-
        Tap a point on the Cloud Phone screen.


        - **Preconditions**: the phone must be powered on and not held by another member. Supported on compatible device
        models only; incompatible models reject the call.

        - **Coordinates**: `pos` must hold exactly two values, `[x, y]`. **They are not checked against the screen
        resolution** — an off-screen point is passed through to the service.

        - **Completion**: synchronous. `data.status` is `finish` when the gesture completed, or `pending` when the
        service queued it. Some models always report `finish`. There is no endpoint to poll a `pending` gesture.

        - **Retry**: no deduplication. Two calls are two taps, so a blind retry after a timeout can double-tap.

        - **Note**: `duration` is accepted but ignored here; only long press reads it.


        Documented business errors: `33300`, `33301`, `33401`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the common codes.
      operationId: touchClick
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudphone_TouchClickRequest"
            example:
              id: "1558968155668507"
              pos:
                - 540
                - 960
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cloudphone_TouchResultResponse"
              example:
                code: 0
                msg: success
                data:
                  status: finish
  /api/cloudphone/touch/doubleClick:
    post:
      tags:
        - Touch
      summary: Touch - Double Click
      description: >-
        Double-tap a point on the Cloud Phone screen.


        - **Preconditions**: the phone must be powered on and not held by another member. Supported on compatible device
        models only; incompatible models reject the call.

        - **Effect**: on some models this is emulated as four touch events with fixed 50/100/50 ms gaps, so the tap
        rhythm is not configurable. `duration` is ignored.

        - **Completion**: synchronous. `data.status` is `finish` or `pending`, as for a single tap.

        - **Retry**: no deduplication; a repeat call double-taps again.


        Documented business errors: `33300`, `33301`, `33401`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the common codes.
      operationId: touchDoubleClick
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudphone_TouchClickRequest"
            example:
              id: "1558968155668507"
              pos:
                - 540
                - 960
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cloudphone_TouchResultResponse"
              example:
                code: 0
                msg: success
                data:
                  status: finish
  /api/cloudphone/touch/longClick:
    post:
      tags:
        - Touch
      summary: Touch - Long Press
      description: >-
        Press and hold a point on the Cloud Phone screen.


        - **Preconditions**: the phone must be powered on and not held by another member. Supported on compatible device
        models only; incompatible models reject the call.

        - **Values**: `duration` is the hold time in milliseconds, capped at 60000. **There is no lower bound**, so a
        negative value passes validation and is handed to the service. On some models an omitted `duration` defaults to
        1000 ms.

        - **Completion**: synchronous. `data.status` is `finish` or `pending`.

        - **Retry**: no deduplication; a repeat call presses again.


        Documented business errors: `33300`, `33301`, `33401`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the common codes.
      operationId: touchLongClick
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudphone_TouchClickRequest"
            example:
              id: "1558968155668507"
              pos:
                - 540
                - 960
              duration: 2000
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cloudphone_TouchResultResponse"
              example:
                code: 0
                msg: success
                data:
                  status: finish
  /api/cloudphone/touch/swipe:
    post:
      tags:
        - Touch
      summary: Touch - Swipe
      description: >-
        Swipe between two points on the Cloud Phone screen.


        - **Preconditions**: the phone must be powered on and not held by another member. Supported on compatible device
        models only; incompatible models reject the call.

        - **Values**: `pos1` is the start point and `pos2` the end point, each exactly `[x, y]`. `duration` is the
        gesture time in milliseconds, capped at 60000; on some models it defaults to 300 ms and the path is interpolated
        into five intermediate move events.

        - **Completion**: synchronous. `data.status` is `finish` or `pending`.

        - **Retry**: no deduplication; a repeat call swipes again.


        Documented business errors: `33300`, `33301`, `33401`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the common codes.
      operationId: touchSwipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudphone_TouchSwipeRequest"
            example:
              id: "1558968155668507"
              pos1:
                - 540
                - 1500
              pos2:
                - 540
                - 500
              duration: 300
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cloudphone_TouchResultResponse"
              example:
                code: 0
                msg: success
                data:
                  status: finish
  /api/cloudphone/touch/drag:
    post:
      tags:
        - Touch
      summary: Touch - Drag
      description: >-
        Drag between two points on the Cloud Phone screen.


        - **Preconditions**: the phone must be powered on and not held by another member. Supported on compatible device
        models only; incompatible models reject the call.

        - **Note**: **on some models this is the same implementation as swipe** — the service delegates drag straight to
        the swipe routine, so the two are indistinguishable there. Other models have a separate drag action.

        - **Completion**: synchronous. `data.status` is `finish` or `pending`.

        - **Retry**: no deduplication; a repeat call drags again.


        Documented business errors: `33300`, `33301`, `33401`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the common codes.
      operationId: touchDrag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cloudphone_TouchSwipeRequest"
            example:
              id: "1558968155668507"
              pos1:
                - 200
                - 500
              pos2:
                - 800
                - 500
              duration: 500
      responses:
        "200":
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cloudphone_TouchResultResponse"
              example:
                code: 0
                msg: success
                data:
                  status: finish
  /api/proxyInfo/page:
    post:
      summary: Getting a list of proxies
      deprecated: false
      description: >-
        List the team's proxy configurations, page by page.


        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Note**: passwords are withheld from ordinary members and for cloud and dynamic proxies. Dynamic proxies
        appear here but are managed elsewhere and cannot be edited through the proxy endpoints.
      operationId: queryProxyInfoPageUsingPOST
      tags:
        - Proxies
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  pattern: ^\d+$
                  description: Optional proxy ID for an exact match. Send the 64-bit ID as a decimal string to avoid precision loss. Omit
                    it to query without an ID filter. Other filters and pagination still apply.
                  example: "1800000000000101"
                pageNo:
                  type: integer
                  description: Current page number (starts from 1)
                  example: 1
                pageSize:
                  type: integer
                  description: Number of items per page
                  example: 10
                isCloudPhoneProxy:
                  type: boolean
                  description: |
                    Whether the proxy is for cloud phone usage.
                    - `true`: Exclude local/private IPs (e.g., 127.0.0.1, 360, pia, private ranges)
                    - `false`: Return all proxies
                  example: false
                proxyCategoryType:
                  type: integer
                  description: |
                    Proxy category type:
                    - `1` = Cloud platform
                    - `2` = Self-owned IP
                  example: 2
                proxyIp:
                  type: string
                  description: Filter by proxy IP address (partial match)
                  example: ""
                proxyName:
                  type: string
                  description: Filter by proxy name (partial match)
                  example: ""
                proxyProviders:
                  type: array
                  items:
                    type: integer
                  description: |
                    List of Proxy type IDs. Supported values:
                    - `0` = HTTP
                    - `1` = HTTPS
                    - `2` = SOCKS5
                    - `3` = SSH
                    - `4` = Oxylabs
                    - `5` = Proxys.io
                    - `6` = GeoSurf
                    - `7` = Luminati
                    - `8` = Lumauto
                    - `9` = Oxylabsauto
                    - `10` = Trojan
                    - `11` = Shadowsocks
                    - `12` = vmess
                    - `13` = ABCPROXY
                    - `14` = LunaProxy
                    - `15` = IPHTML
                    - `16` = PiaProxy
                    - `17` = 922S5
                  example: []
                proxyStatus:
                  type: integer
                  description: |
                    Proxy assignment status:
                    - `0` = Normal
                    - `1` = Unassigned
                    - `2` = Upgrading
                    - `3` = Expired
                    - `4` = Expiring soon  
                    > Note: Self-owned proxies always use status `1`.
                  example: 1
                proxyCheckStatus:
                  type: integer
                  description: |
                    Proxy health check status:
                    - `0` = Pending
                    - `1` = Success
                    - `2` = Failed
                    - `3` = Unknown error
                  example: 1
                proxyTypes:
                  type: array
                  items:
                    type: integer
                  description: |
                    Proxy protocol types:
                    - `0` = HTTP
                    - `1` = HTTPS
                    - `2` = SOCKS5
                    - `3` = SSH
                  example: []
              required: []
            example:
              id: "1800000000000101"
              pageNo: 1
              pageSize: 10
              isCloudPhoneProxy: false
              proxyCategoryType: 2
              proxyIp: ""
              proxyName: ""
              proxyProviders: []
              proxyStatus: 1
              proxyCheckStatus: 1
              proxyTypes: []
      responses:
        "200":
          description: Success. `data.dataList` holds the records for the requested page and is an empty array when there are no
            matches; `data.total`, `data.current` and `data.pages` describe the paging.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    description: Return result code 0:Normal Other codes are exceptions.
                    type: integer
                  msg:
                    description: Error message
                    type:
                      - string
                      - "null"
                  data:
                    type: object
                    properties:
                      current:
                        type: string
                      dataList:
                        type: array
                        items:
                          type: object
                          properties:
                            expiryTime:
                              description: Expiration time
                              type: string
                            id:
                              description: Primary key
                              type: string
                            proxyCategoryType:
                              description: Proxy type 1:Platform proxy; 2:Self-owned proxy
                              type: integer
                            proxyCheckStatus:
                              description: Detection status 0-pending detection 1-monitoring success 2-detection failure 3-unknown error
                              type: integer
                            state:
                              type:
                                - string
                                - "null"
                              description: Proxy state or province. Uses detected exit-IP location when available, otherwise the configured location;
                                may be null or empty.
                              example: California
                            city:
                              type:
                                - string
                                - "null"
                              description: Proxy city. Uses detected exit-IP location when available, otherwise the configured location; may be null
                                or empty.
                              example: Los Angeles
                            proxyPort:
                              type:
                                - integer
                                - "null"
                              format: int32
                              description: Proxy connection port, not a port inferred from the proxy name. May be null when unavailable.
                              example: 1080
                            proxyIp:
                              description: Proxy IP
                              type: string
                            exportIp:
                              description: export IP
                              type: string
                            countryCode:
                              description: countryCode
                              type: string
                            proxyName:
                              description: Proxy Name
                              type: string
                            proxyProvider:
                              description: >
                                Proxy type:default value 0-HTTP 1-HTTPS 2-SOCKS5 3-SSH 4-Oxylabs 5-Proxys.io 7-Luminati
                                8-Lumauto 9-Oxylabsauto 10-Trojan，11-Shadowsocks 13-ABCPROXY 14-LunaProxy 15-IPHTML
                                16-PiaProxy 17-922S5
                              type: integer
                            proxyType:
                              description: Proxy Type:0-http 1-https 2-socks5 3-ssh
                              type: integer
                            username:
                              description: Proxy username
                              type: string
                            password:
                              description: Proxy password
                              type: string
                            refreshUrl:
                              description: Proxy refresh URL
                              type: string
                      pages:
                        type: string
                      total:
                        type: string
                    required:
                      - current
                      - dataList
                      - pages
                      - total
                  requestId:
                    description: Operation Request ID
                    type: string
                required:
                  - code
                  - msg
                  - data
                  - requestId
