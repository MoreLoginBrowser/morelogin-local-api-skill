          description: Response data
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              resolution:
                type: string
              os:
                type: integer
              platform:
                type: string
        requestId:
          description: Operation request ID
          type: string
      required:
        - code
        - msg
        - data
        - requestId
    browser_EnvironmentId:
      type: string
      pattern: ^[1-9]\d*$
      description: |
        Browser profile (environment) ID. Serialized as a decimal string to avoid JavaScript
        precision loss on 64-bit integers.
      example: "1800000000000001"
    browser_CloudBrowserStartRequest:
      type: object
      properties:
        envId:
          $ref: "#/components/schemas/browser_EnvironmentId"
      required:
        - envId
    browser_ApiResponseBase:
      type: object
      properties:
        code:
          type: integer
          description: Return result code. `0` means success; other codes indicate exceptions.
          example: 0
        msg:
          type:
            - string
            - "null"
          description: Error message. Usually `null` on success.
          example: null
        requestId:
          type: string
          description: Operation request ID. This field may be present when the request passes through the API gateway.
          example: 1d4f3ea968664593860b94b35d4ebf5e
      required:
        - code
        - msg
    browser_CloudBrowserStopRequest:
      type: object
      properties:
        envId:
          $ref: "#/components/schemas/browser_EnvironmentId"
        force:
          type: boolean
          description: |
            Whether to forcibly release the cloud runtime. Only takes effect when the current run has
            an archive status of `FAILED`; in that case the archive step is skipped and runtime
            resources are reclaimed. Ignored in all other cases.
          default: false
          example: false
      required:
        - envId
    browser_CloudBrowserPageRequest:
      type: object
      properties:
        uniqueIds:
          type: array
          description: Environment sequence numbers. Up to 100 items.
          maxItems: 100
          items:
            type: integer
            format: int32
          example:
            - 1001
            - 1002
        envId:
          allOf:
            - $ref: "#/components/schemas/browser_EnvironmentId"
          description: Environment ID. The request also accepts the field alias `id`.
        envName:
          type: string
          description: Environment name.
          example: marketing-01
        keyword:
          type: string
          description: Keyword filter. Matches environment name, group name, tag name, and remark.
          example: marketing
        groupId:
          type: string
          pattern: ^\d+$
          description: Group ID. `0` means ungrouped.
          example: "0"
        pageNo:
          type: integer
          format: int64
          description: Current page number, starting from 1. Default is 1.
          minimum: 1
          default: 1
          example: 1
        pageSize:
          type: integer
          format: int64
          description: Number of items per page. Default is 10, maximum 100.
          minimum: 1
          maximum: 100
          default: 10
          example: 10
      required:
        - pageNo
        - pageSize
    browser_CloudBrowserStatus:
      type: string
      description: |
        Cloud runtime status:
        - `STARTING` — starting up
        - `RUNNING` — running and ready to connect
        - `CLOSED` — not started, closed, or failed to start
      enum:
        - STARTING
        - RUNNING
        - CLOSED
      example: RUNNING
    browser_CloudBrowserArchiveStatus:
      type:
        - string
        - "null"
      description: |
        Archive status of the current cloud run. `null` when there is no active run record:
        - `PENDING` — pending archive
        - `ARCHIVING` — archiving
        - `COMPLETED` — archive completed
        - `FAILED` — archive failed
      enum:
        - PENDING
        - ARCHIVING
        - COMPLETED
        - FAILED
        - null
      example: null
    browser_CloudBrowserPageItem:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/browser_EnvironmentId"
        envName:
          type: string
          description: Environment name.
          example: marketing-01
        proxyId:
          type:
            - string
            - "null"
          pattern: ^\d+$
          description: Proxy ID currently bound to the profile. `null` when no proxy is configured.
          example: "1800000000000101"
        cloudBrowserStatus:
          $ref: "#/components/schemas/browser_CloudBrowserStatus"
        cloudBrowserArchiveStatus:
          $ref: "#/components/schemas/browser_CloudBrowserArchiveStatus"
        startDate:
          type:
            - string
            - "null"
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
          description: Cloud runtime start time. `null` while starting, or when not started or closed.
          example: 2026-01-15 10:30:00
      required:
        - id
        - envName
        - cloudBrowserStatus
