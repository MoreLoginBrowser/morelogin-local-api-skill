              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: object
                    properties:
                      presignedUrl:
                        type: string
                        description: Upload file url.Please use HTTP PUT request for file upload
                    required:
                      - presignedUrl
                  requestId:
                    type: string
                required:
                  - code
                  - msg
                  - data
                  - requestId
                description: Response code, 0 indicates success,>0 indicates failure
              example:
                code: 0
                msg: null
                data:
                  presignedUrl: https://example-bucket.s3.amazonaws.com/prod/cloudPhoneOpenApi/1666625111121936/20260901/demo.mp4?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=3600&X-Amz-Signature=EXAMPLE
                requestId: d0b850e2c3d54279b524e9540a358e0a
          headers: {}
      security: []
  /api/cloudphone/upload/file:
    post:
      operationId: uploadCloudPhoneFileByUrlLocal
      summary: Upload File via URL
      deprecated: false
      description: >-
        Register an uploaded file so the Cloud Phone downloads it.


        - **Preconditions**: the phone must be powered on and not held by another member, and **the object must already
