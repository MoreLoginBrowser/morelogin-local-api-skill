        render:
          type: string
          description: WebGL renderer string (e.g., "ANGLE (...)")
    browser_AudioContextConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: AudioContext policy. Default:1. 1 = Noise, 2 = Realistic.
    browser_MediaDeviceConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Media device policy. Default:1. 1 = Noise, 2 = Real.
    browser_ClientRectsConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: ClientRects policy. Default:1. 1 = Noise, 2 = Real.
    browser_SpeechVoiseConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: SpeechVoices policy. Default:1. 1 = Privacy, 2 = Real
    browser_BluetoothConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Bluetooth policy. Default:1. 1 = Privacy, 2 = Authenticity.
    browser_BatteryConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Battery policy. Default:1. 1 = Privacy, 2 = Authenticity.
    browser_PortScanProtectionConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Port scan protection. Default:1. 1 = On, 2 = Off.
        value:
