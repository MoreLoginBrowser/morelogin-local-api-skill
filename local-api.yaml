  /api/cloudphone/app/page:
    post:
      operationId: listCloudPhoneAppsLocal
      summary: List Available Apps
      deprecated: false
      description: >-
        List apps that can be installed on a Cloud Phone.


        - **Effect**: none. Read-only. Safe to retry with bounded backoff. No Cloud Phone is involved, so the phone does
        not need to be running.

        - **Contents**: the public app catalogue — globally available apps plus apps published to your team. Each entry
        carries its versions in `appVersionList`, newest first; take `appVersionList[].id` as the `appVersionId` for
        `/cloudphone/app/install`.

        - **Paging caveat**: results are re-sorted after the page is fetched, so ordering is stable only within a page
        and `total` reflects the current page rather than the whole catalogue. Use `pages` for navigation.
      tags:
        - Apps
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                appName:
                  description: App name (partial match)
                  type: string
                pageNum:
                  description: Page number; Default:1
                  type: integer
                pageSize:
                  description: Items per page; Default:10
                  type: integer
            example:
              appName: de
              pageNum: 1
              pageSize: 10
      responses:
        "200":
          description: Success. `data.dataList` holds the apps available to your team for the requested page; each app carries its
            versions in `appVersionList`, newest first. `data.total` is the number of records on this page, not the
            overall count — use `data.pages` for paging.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: object
                    properties:
                      total:
                        type: string
                        description: Number of records on the current page
                      current:
                        type: string
                        description: Current page number
                      pages:
                        type: string
                        description: Total number of pages
                      dataList:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: App ID. This is not the value `/cloudphone/app/install` expects.
                            appName:
                              type: string
                              description: App name
                            appIcon:
                              type: string
                              description: App icon URL
                            packageName:
                              type: string
                              description: Android package name
                            categoryValue:
                              type: integer
                              description: Category ID
                            sortNo:
                              type: integer
                              description: Sort order used by the app library
                            appVersionList:
                              type: array
                              description: Versions of this app, ordered by `versionCode` descending (newest first)
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: App version ID. Pass this as `appVersionId` to `/cloudphone/app/install`.
                                  versionCode:
                                    type: string
                                    description: Version code
                                  versionName:
                                    type: string
                                    description: Version display name
                                  installStatus:
                                    type:
                                      - integer
                                      - "null"
                                    description: Always null for this operation. Query installation state with `/cloudphone/app/installedList`.
                                  packageName:
                                    type:
                                      - string
                                      - "null"
                                    description: Always null for this operation; read `packageName` from the app instead.
                  requestId:
                    type: string
              example:
                code: 0
                msg: null
                data:
                  total: "1"
                  current: "1"
                  pages: "1"
                  dataList:
                    - id: "1672940217990529"
                      appName: Depop
                      appIcon: https://cdn.morelogin.com/app/depop.png
                      packageName: com.depop
                      categoryValue: 1
                      sortNo: 0
                      appVersionList:
                        - id: "1672940217990530"
                          versionCode: "450000000"
                          versionName: 4.50.0
                          installStatus: null
                          packageName: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
          headers: {}
      security: []
