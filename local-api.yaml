                msg: null
                data: true
                requestId: a416bb98f6d240c3bb79e7b2cf6e7ad4
          headers: {}
      security: []
  /api/env/setProxy/batch:
    post:
      operationId: setBrowserProxiesBatchLocal
      summary: Batch modify profiles proxy
      deprecated: false
      description: >-
        Bind a proxy to multiple browser profiles.


        - **Preconditions**: provide at least one of `envIds` or `uniqueIds`. A supplied `proxyId` must already exist in
        the team, otherwise the call is rejected rather than creating one.

        - **Effect**: writes `proxyId` on each profile. When `proxyId` is omitted or `0`, an existing proxy with
        identical connection details is reused, and if none matches **a new proxy record is created in the calling
        team**.

        - **Completion**: synchronous. Running browsers keep the proxy they started with.

        - **Retry**: rebinding the same `proxyId` is idempotent, but repeating a call that carries raw connection
        details can create another proxy record each time deduplication misses.


        Documented business errors: `19106`, `19193`, `14023`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the common codes.
      tags:
        - Profiles
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                envIds:
                  type: array
                  items:
                    type: string
                  description: Choose one with serial IDs, must fill one
                proxy:
                  type: object
                  properties:
                    city:
                      type: string
                      description: City
                    state:
                      type: string
                      description: State/Province
                    country:
                      type: string
                      description: Country code (e.g. `us`). See [Country Time Zone Table](/api-reference/appendix/country-time-zone) for
                        supported codes. Required when proxyProvider is 16/17/18
                    encryptionType:
                      type: integer
                      description: "Encryption method. Cannot be empty when proxyProvider is 11. 1: aes-128-gcm, 2: aes-192-gcm, 3:
                        aes-256-gcm, 4: aes-128-cfb, 5: aes-192-cfb, 6: aes-256-cfb, 7: aes-128-ctr, 8: aes-192-ctr, 9:
                        aes-256-ctr, 10: rc4-md5, 11: chacha20-ietf, 12: xchacha20, 13: chacha20-ietf-poly1305, 14:
                        xchacha20-ietf-poly1305"
                    proxyId:
                      type: string
                      description: Proxy ID
                    proxyIp:
                      description: Proxy IP. Can be empty when proxyProvider is 16/17/18; required for others
                      type: string
                    proxyPort:
                      type: integer
                      description: Proxy port (only numbers 1-65535 allowed). Can be empty when proxyProvider is 16/17/18; required for others
                    proxyType:
                      type: integer
                      description: "Proxy type, 0: http, 1: https. Cannot be empty when proxyProvider is 7/8"
                    proxyProvider:
                      type: string
                      description: "Proxy type 0: http, 1: https, 2: socks5, 3: ssh, 4: Oxylabs, 5: Proxys.io, 7: Luminati, 8: Lumauto, 9:
                        Oxylabsauto, 10: Trojan, 11: Shadowsocks, 13: ABCPROXY, 14: LunaProxy, 15: IPHTML, 16: PiaProxy,
                        17: 922S5, 18: 360Proxy"
                    proxyName:
                      type: string
                      description: Proxy name (maximum 600 characters)
                    password:
                      type: string
                      description: Password (maximum 100 characters)
                    refreshUrl:
                      type: string
                      description: Refresh URL
                    ipMonitor:
                      type: boolean
                      description: "Enable IP change monitoring? true: On, false: Off"
                    ipChangeAction:
                      type: integer
                      description: "IP change monitoring 0: Block access, 1: Warn"
                    username:
                      type: string
                      description: Username (maximum 200 characters)
                  required:
                    - city
                    - country
                    - encryptionType
                    - ipChangeAction
                    - ipMonitor
                    - password
                    - proxyId
                    - proxyIp
                    - proxyName
                    - proxyPort
                    - proxyProvider
                    - proxyType
                    - refreshUrl
                    - state
                    - username
                  description: Used to change the bound proxy for environments. If proxyId is provided, bind to the proxy represented by
                    that ID; otherwise, bind to a newly added proxy. If proxy information remains unchanged, no
                    rebinding occurs (any change in proxyIp, proxyPort, proxyType, or proxyProvider is considered a new
                    proxy, and rebinding succeeds)
                uniqueIds:
                  type: array
                  items:
                    type: string
                  description: Choose one with environment ID, must fill one
              required:
                - proxy
            example:
              proxy:
                city: string
                country: string
                encryptionType: 1
                ipChangeAction: 1
                ipMonitor: true
                password: string
                proxyId: "1661515884160372"
                proxyIp: string
                proxyName: example-name
                proxyPort: 1
                proxyProvider: string
                proxyType: 1
                refreshUrl: https://example.com/resource
                state: string
                username: example-name
        required: true
      responses:
        "200":
          description: Success. `data` is a single boolean value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: boolean
                  requestId:
                    type: string
                required:
                  - requestId
              example:
                code: 0
                msg: null
                data: true
                requestId: d57cfecfc6904fcaa57da9f65b2a15fd
          headers: {}
      security: []
