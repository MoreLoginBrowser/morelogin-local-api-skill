    post:
      summary: Clear local profile cache
      operationId: clearLocalProfileCacheUsingPOST
      deprecated: false
      description: >-
        Ask the local MoreLogin client to clear cached data for a browser profile.


        - **Preconditions**: identify the profile by `envId` or `uniqueId` and select at least one cache type. Firefox
        profiles must select every type at once.

        - **Effect**: the service validates the request and records it; **the deletion itself is performed by the
        desktop client on local disk.** Cloud-side cache is untouched — use the cloud cache endpoint for that.

        - **Completion**: the response confirms the request was accepted by the service, not that local files were
        removed. No endpoint reports local disk state.
      tags:
        - Cache & Window
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - envId
              properties:
                envId:
                  type: string
                  description: |
                    Environment ID. Exactly one of `envId` or `uniqueId` must be provided.
                localStorage:
                  type: boolean
                  description: Clear LocalStorage Default:false
                  default: false
                indexedDB:
                  type: boolean
                  description: Clear IndexedDB Default:false
                  default: false
                cookie:
                  type: boolean
                  description: Clear cookies Default:false
                  default: false
                extension:
                  type: boolean
                  description: |
                    Clear extension data. If `extensionFile` is not provided,
                    clears both extension name and data. Default:false
                  default: false
                extensionFile:
                  type: boolean
                  description: |
                    Clear extension files (effective from v3.36).
                  default: false
            example:
              envId: "1924340272932134912"
              localStorage: false
              indexedDB: false
              cookie: false
              extension: false
              extensionFile: true
      responses:
        "200":
          description: Success. `data` is an object with the fields `envId`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: object
                    properties:
                      envId:
                        type: string
                  requestId:
                    type: string
                    description: Unique request identifier; include it when contacting support
              example:
                code: 0
                msg: null
                data:
                  envId: "1673823102599682"
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
      security: []
  /api/env/cache/cleanCloud:
    post:
      operationId: cleanCloudCacheLocal
      summary: Clean Environment Cloud Cache
      deprecated: false
      description: >-
        Clear the cloud-side cache of a browser profile.


        - **Preconditions**: identify the profile by `envId` or `uniqueId`, select at least one cache class, and the
        profile must not be mid-transfer. Local client cache is untouched.

        - **Effect**: clearing the general class removes cloud LocalStorage, IndexedDB and extension data, unbinds the
        profile's extensions, and **resets the profile encryption type**; clearing cookies resets the cookie encryption
        type. Both changes are persisted, so an encrypted profile becomes unencrypted for the cleared class.

        - **Completion**: synchronous — the cloud storage service has accepted and returned before the response. There
        is no task id to poll.


        Documented business errors: `19039`, `19149`. See [Error Codes](../Getting%20Started/error-codes.md) for what
        each code means. Any operation can additionally return the common codes.
      tags:
        - Cache & Window
      parameters:
        - name: Accept-Language
          in: header
          description: Default request language
          required: false
          example: zh-CN
          schema:
            type: string
            default: zh-CN
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cookie:
                  description: Whether to clear cookies
                  type: boolean
                envId:
                  description: Environment ID, must fill one with serial ID
                  type: string
                others:
                  description: Whether to clear other cache
                  type: boolean
                uniqueId:
                  description: Serial ID, must fill one with environment ID
                  type: integer
            example:
              cookie: true
              envId: "1661515884160372"
              others: true
        required: true
      responses:
        "200":
          description: Success. `data` is always null for this operation; the outcome is carried by `code`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: "null"
                  requestId:
                    type: string
              example:
                code: 0
                msg: null
                data: null
                requestId: ca3b32431c264b6c94187fde14d23229
          headers: {}
      security: []
  /api/env/fingerprint/refresh:
    post:
      summary: Refresh fingerprint
      operationId: refreshFingerprintUsingPOST
      deprecated: false
      description: >-
        Regenerate the fingerprint of a browser profile.


        - **Preconditions**: identify the profile by `envId` or `uniqueId`. Encrypted profiles are rejected. A running
        profile is not blocked, but the new fingerprint applies from the next start.

        - **Effect**: generates a fresh fingerprint, randomises host name and MAC address, and re-matches the browser
        kernel. Values supplied in the request win over the generated ones.

        - **Completion**: synchronous.

        - **Retry**: **never retry automatically.** Each call produces a different random fingerprint, so a blind retry
        after a timeout changes the profile a second time. Compare `/env/detail` first.


        Documented business errors: `19039`, `19104`, `19105`, `19106`, `19107`, `19108`, `19111`, `19142`, `19193`. See
        [Error Codes](../Getting%20Started/error-codes.md) for what each code means. Any operation can additionally
        return the common codes.
      tags:
        - Fingerprint & Device Config
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - envId
              properties:
                envId:
                  type: string
                  description: |
                    Profile ID (environment ID). Exactly one of `envId` or `uniqueId` must be provided.
                uniqueId:
                  type: string
                  description: |
                    Profile serial number (unique ID). Exactly one of `envId` or `uniqueId` must be provided.
                uaVersion:
                  type: integer
                  description: |
                    Target User-Agent version (e.g., Chrome 129). 
                    If omitted, uses the current UA version from the profile.
                  example: 129
                browserTypeId:
                  type: integer
                  description: |
                    Browser type. 1 = Chrome, 2 = Firefox.
                  enum:
                    - 1
                    - 2
                operatorSystemId:
                  type: integer
                  description: |
                    Operating system type. 1 = Windows, 2 = macOS, 3 = Android, 4 = iOS.
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                advancedSetting:
                  $ref: "#/components/schemas/browser_AdvancedSetting"
            example:
              envId: "1869988538611834880"
              uniqueId: ""
              uaVersion: 129
              browserTypeId: 1
              operatorSystemId: 2
              advancedSetting: {}
      responses:
        "200":
          description: Success. `data` is always null for this operation; the outcome is carried by `code`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: "null"
                  requestId:
                    type: string
              example:
                code: 0
                msg: null
                data: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
          headers: {}
      security: []
