        accuracy:
          type: number
          format: float
          description: Accuracy in meters. Required if base_on_ip=false.
    browser_LanguageConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Language policy. Default:1. 1 = Match IP, 2 = Custom.
        value:
          type: string
          description: |
            Required when switcher=2.
            Comma-separated language IDs from “Get Timezone & Language List” API.
    browser_ResolutionConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Resolution policy. Default:1. 1 = Real, 2 = Custom.
        id:
          type: string
          description: |
            Required when switcher=2.
            Resolution ID from “Get Resolution List” API.
    browser_FontConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Font policy. Default:1. 1 = Real, 2 = Custom.
        value:
          type: string
          description: Comma-separated custom font names (required if switcher=2).
    browser_CanvasConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Canvas policy. Default:1. 1 = Noise, 2 = Real.
    browser_WebGLImageConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: WebGL image policy. Default:1. 1 = Noise, 2 = Real.
    browser_WebGLMetadataConfig:
      type: object
      properties:
        switcher:
          type: integer
