  /api/cloudphone/create:
    post:
      summary: Create Cloud Phone
      description: >-
        Purchase and provision one or more Cloud Phones.


        - **Preconditions**: the plan must have remaining capacity and the daily creation quota must not be exhausted.
        `country`, `timezone` and `language` are validated against the list the selected device model supports, so an
        unsupported combination is rejected rather than silently adjusted. Coordinates are bounded to ±180 longitude,
        ±90 latitude. A phone number is discarded when the chosen SKU does not support one. Monthly SKUs are supported
        when returned by [`/api/cloudphone/monthly/skus`](./local-api.yaml#operation/listMonthlyCloudPhoneSkus); they
        currently use a 30-day term.

        - **Effect**: creates the Cloud Phone records. Pay-per-minute SKUs become usable after provisioning; monthly
        SKUs are created inactive. Creation never charges the wallet. Monthly phones are charged only by
        [`/api/cloudphone/monthly/activate`](./local-api.yaml#operation/activateMonthlyCloudPhones); pay-per-minute
        phones begin consuming balance or quota when powered on.

        - **Completion**: **accepted, not complete.** The Cloud Phone instance is not ready yet, and powering on too
        early is rejected. Poll [`/api/cloudphone/info`](./local-api.yaml#operation/infoUsingPOST) or
        [`/api/cloudphone/page`](./local-api.yaml#operation/pageUsingPOST) until `envStatus` reports the phone as
        powered off. For a monthly SKU, also complete
        [`/api/cloudphone/monthly/activate`](./local-api.yaml#operation/activateMonthlyCloudPhones) before powering it
        on.

        - **Retry**: not idempotent and not serialized. There is no idempotency key. Do not retry blindly after a
        timeout — query state first.


        Documented business errors: `19064`, `20018`, `33338`, `33339`, `33340`, `33341`, `33342`, `33343`, `33344`,
        `33345`, `33398`, `33399`, `33400`, `33408`. See [Error Codes](../Getting%20Started/error-codes.md) for what
        each code means. Any operation can additionally return the common codes.
      operationId: createUsingPOST
      tags:
        - Cloud Phone Management
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skuId:
                  type: string
                  description: >
                    Cloud Phone model

                    skuId:10002 model:Android 12

                    skuId:10013 model:Android 13

                    skuId:10005 model:Android 14

                    skuId:10004 model:Android 15

                    skuId:10014 model:Android 15A

                    skuId:10015 model:Android 16

                    See [Country Time Zone Table](/api-reference/appendix/country-time-zone) for supported regions and
                    timezone mappings
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: Number of cloud phone created. Range of values:[1-10]
                envRemark:
                  type: string
                  maxLength: 1500
                  description: Profile Remarks (Length limit 1500 characters)
                groupId:
                  type: string
                  description: Group ID. Use `"0"` for ungrouped.
                groupName:
                  type: string
                  maxLength: 50
                  description: Existing group name, or a new group name to create when no matching group exists.
                automaticGeo:
                  type: boolean
                  description: Whether to automatically match the geographic location. Default:true
                automaticLanguage:
                  type: boolean
                  description: Whether to automatically match the language. Default:true
                automaticLocation:
                  type: boolean
                  description: Whether to auto-match location (time zone, country). Default:true
                country:
                  type: string
                  description: Country code (e.g. `us`). See [Country Time Zone Table](/api-reference/appendix/country-time-zone) for the
                    full list
                timezone:
                  type: string
                  description: Time zone, e.g. America/New_York
                language:
                  type: string
                  description: Language, e.g. en-US
                altitude:
                  type: number
                  description: Altitude
                latitude:
                  type: number
                  description: Latitude. Example:22.309182
                longitude:
                  type: number
                  description: Longitude. Example:114.176817
                speed:
                  type: number
                  maximum: 400
                  description: Movement speed
                bearing:
                  type: number
                  maximum: 360
                  description: Direction of movement
                accuracy:
                  type: number
                  maximum: 100
                  description: Horizontal accuracy
                phoneNumber:
                  type: string
                  description: Customize your phone number. Format requirements:Must begin with a + sign, country code must be 1-3 digits
                    (excluding 86), total length 8-14 digits, and contain only + and numbers.
                brand:
                  type: string
                  description: device brand,You can query via the
                    https://guide.morelogin.com/api-reference/open-api/open-api/cloud-phone/paths/~1cloudphone~1brand~1models/post
                    interface.
                modelId:
                  type: number
                  description: device model id,You can query via the
                    https://guide.morelogin.com/api-reference/open-api/open-api/cloud-phone/paths/~1cloudphone~1brand~1models/post
                    interface.
                proxyId:
                  type: string
                  description: Proxy ID
                tags:
                  type: array
                  items:
                    type: string
                  description: Tag names. Blank values are ignored.
              required:
                - skuId
                - quantity
            example:
              skuId: "1661515884160372"
              quantity: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - "null"
                  data:
                    type: array
                    items:
                      type: string
                    description: This is Cloud phone IDS
                  requestId:
                    type: string
                  error:
                    type: object
                    properties: {}
                required:
                  - code
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                data:
                  - string
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
                error: {}
  /api/cloudphone/powerOn:
    post:
      summary: Start Cloud Phone
      description: >-
        Start a Cloud Phone.


        - **Preconditions**: the phone must currently be powered off. It is rejected when the SKU is delisted or under
        maintenance, when the phone is held by another member, while its proxy is still being checked, when the account
        is in arrears or the phone is deactivated, when a monthly term has expired, and when neither free minutes, a
        concurrency slot nor a positive balance is available. Some models additionally require the latest Windows
        client.

        - **Effect**: marks the phone as booting, claims it for the calling member, and reserves a concurrency slot or
        starts consuming time. The response reports which of the two was used.

        - **Completion**: **accepted, not complete.** Poll `/cloudphone/info` until `envStatus` is powered on; a failure
        surfaces there as `errorCode` and `errorMsg`. Members with a callback host configured also receive a webhook.

        - **Retry**: a concurrent second call is rejected outright rather than queued. After a timeout, read
        `/cloudphone/info` — do not resend.


        Documented business errors: `33300`, `33309`, `33315`, `33316`, `33317`, `33318`, `33321`, `33322`, `33323`,
        `33324`, `33325`, `33346`, `33347`, `33367`, `33376`, `33407`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means. Any operation can additionally return the
        common codes.
      operationId: powerOnUsingPOST
      tags:
        - Cloud Phone Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                headless:
                  type: boolean
                  description: Display Cloud Phone Window. false:Display, true:Do not display, Default:true
                disableMoneySavingMode:
                  type: boolean
                  description: Disable power saving mode, default:false
              required:
                - id
            example:
              id: "1637226321190925"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Return result code 0:Normal Other codes are exceptions.
                  msg:
                    type:
                      - string
                      - "null"
                    description: Error message
                  requestId:
                    type: string
                    description: Operation Request ID
                required:
                  - code
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/restart:
    post:
      summary: Restart Cloud Phone
      description: >-
        Restart the entire Cloud Phone. Running AI tasks are terminated and in-progress app installation records are
        cleared.


        Operate on one Cloud Phone by `id`. The caller must have access to the phone; it must be activated, not released
        or transferring, powered on (`envStatus=4`), and not occupied by another member. Success returns `data: null`
        with no task ID and means submission succeeded, not completion. Query `/api/cloudphone/info` or
        `/api/cloudphone/page` with bounded polling: processing is `envStatus=6`, success returns to `4`, and callback
        failure changes it to `2`. If subscribed, use the final `cloud_phone.restart` Webhook result. There is no
        idempotency key: after a timeout, query state before retrying; another call after completion may execute again.


        Documented business errors: `33300`, `33301`, `33310`, `33321`, `33325`, `33359`, `33382`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means. Any operation can additionally return the
        common codes.
      operationId: restartCloudPhone
      tags:
        - Cloud Phone Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
            example:
              id: "1596527092376632"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Return result code 0:Normal Other codes are exceptions.
                  msg:
                    type:
                      - string
                      - "null"
                    description: Error message
                  requestId:
                    type: string
                    description: Operation Request ID
                  data:
                    type: "null"
                required:
                  - code
                  - msg
                  - requestId
                  - data
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
                data: null
