      description: >-
        **Data deletion warning:** reset clears phone data and app installation records and terminates running AI tasks.
        Back up required data first. This is distinct from the one-click new device operation.


        Operate on one Cloud Phone by `id`. The caller must have access to the phone; it must be activated, not released
