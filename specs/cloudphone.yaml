  /api/cloudphone/page:
    post:
      summary: List Cloud Phone Profiles
      description: >-
        List the Cloud Phones visible to the authenticated team, page by page.


        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Note**: phones of all device types are returned. Passwords of
