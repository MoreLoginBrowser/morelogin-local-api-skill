        - **Note**: MoreLogin applies no Android version check — the documented
        model restriction comes from service capability, and package names are
        passed through verbatim.
      tags:
        - Apps
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: Cloud phone IDs
                packageName:
                  type: array
                  items:
                    type: string
                  description: >-
                    App package name, An empty string is equivalent to clearing,
                    while * or ALL hides all applications.
            example:
              ids:
                - '0'
              packageName:
                - '*'
      responses:
        '200':
          description: Success. `data` is a single boolean value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
