        - **Completion**: synchronous acceptance by the service. When ROOT takes
        effect on the device is device-specific behaviour; MoreLogin does not
        restart the phone.

        - **Note**: there is currently no endpoint to revoke ROOT for individual
        packages. Use `/cloudphone/enableRoot` to turn the global switch off.


        Documented business errors: `33300`, `33301`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
