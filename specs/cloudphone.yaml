  /api/cloudphone/enableRoot:
    post:
      tags:
        - Cloud Phone Management
      summary: Enable or disable global ROOT
      description: >-
        Turn the global ROOT switch on or off for a Cloud Phone.


        - **Preconditions**: the phone must be powered on and not held by
        another member. Supported on compatible device models; on incompatible
        models the call succeeds but has no effect.

        - **Effect**: unlike `/cloudphone/app/openRoot`, the setting **is
        persisted** on the phone's settings record and then pushed to the
        service as a device-wide switch.

        - **Completion**: synchronous. MoreLogin does not restart the phone;
        when the change takes effect on the device is device-specific behaviour.

        - **Retry**: idempotent.


        Documented business errors: `33300`, `33301`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      operationId: enableRoot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudPhoneEnableRootApiDTO'
            example:
              id: '1558968155668507'
              enableRoot: true
      responses:
        '200':
          description: >-
            Success. `data` is always null for this operation; the outcome is
            carried by `code`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response code: 0 = success, >0 = error'
                  data:
                    type: 'null'
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Message; populated if code > 0
                  requestId:
                    type: string
                    description: >-
                      Unique request identifier; include it when contacting
                      support
              example:
                code: 0
                data: null
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/screenCap:
    post:
      tags:
        - Cloud Phone Management
      summary: Cloud phone screen capture
      description: >-
        Capture the Cloud Phone screen and return a download URL.


        - **Preconditions**: the phone must be powered on and not held by
        another member. Supported on compatible device models only; incompatible
        models reject the call.

        - **Effect**: on some models the screenshot file is removed from the
        device after it is captured.

        - **Completion**: synchronous. The response includes a temporary image
        download URL.

        - **Caveat**: on some models the reported expiry is a fixed one hour
        from the response and `success` is always true — it is not the real
        signature lifetime. Download promptly rather than storing the URL.

        - **Retry**: no side effect beyond the capture itself, so it is safe to
        repeat.
      operationId: screenCap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: cloud phone ID
                  example: '1558968155668507'
            example:
              id: '1558968155668507'
      responses:
        '200':
          description: >-
            Success. `data` is an object with the fields `url`, `status`,
            `expireAt` and `success`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response code: 0 = success, >0 = error'
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        description: The screenshot access URL
                        example: http://oss.morelogin.com/test.png
                      status:
                        type: string
                        description: >-
                          Status representing immediate completion ("finish") or
                          pending status ("pending")
                        example: finish
                      expireAt:
                        type: string
                        description: >-
                          URL expiration timestamp in milliseconds (returned
                          only by some device models)
                        example: '1756024767163'
                      success:
                        type: boolean
                        description: Was successfully generated
                        example: true
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Message; populated if code > 0
                  requestId:
                    type: string
                    description: >-
                      Unique request identifier; include it when contacting
                      support
              example:
                code: 0
                data:
                  url: http://oss.morelogin.com/test.png
                  status: finish
                  expireAt: '1756024767163'
                  success: true
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/screenCapBase64:
    post:
      tags:
        - Cloud Phone Management
      summary: Cloud phone screen capture(response base64)
      description: >-
        Capture the Cloud Phone screen and return the image inline as base64.


        - **Preconditions**: the phone must be powered on and not held by
        another member. **Supported on compatible device models only** —
        incompatible models reject the call.

        - **Completion**: synchronous. On failure the response carries an error
        message instead of image data, so check `success` before decoding.

        - **Model support**: documented as available on Android 12 and Android
        15 images only.

        - **Use**: prefer this over `/cloudphone/screenCap` when you do not want
        to depend on a temporary download URL.
      operationId: screenCapBase64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
              properties:
                id:
                  type: string
                  description: cloud phone ID
                  example: '1558968155668507'
            example:
              id: '1558968155668507'
      responses:
        '200':
          description: >-
            Success. `data` is an object with the fields `captureBase64`,
            `errorMessage` and `success`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response code: 0 = success, >0 = error'
                  data:
                    type: object
                    properties:
                      captureBase64:
                        type: string
                        description: Base64-encoded image
                        example: data:image/png;base64,/9j/4AAQSkZJRgABAQAA.....
                      errorMessage:
                        type: string
                        description: error message
                        example: success
                      success:
                        type: boolean
                        description: Was successfully generated
                        example: true
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Message; populated if code > 0
                  requestId:
                    type: string
                    description: >-
                      Unique request identifier; include it when contacting
                      support
              example:
                code: 0
                data:
                  captureBase64: data:image/png;base64,/9j/4AAQSkZJRgABAQAA.....
                  errorMessage: success
                  success: true
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/brand/models:
    post:
      operationId: listCloudPhoneBrandsAndModelsLocal
      summary: List Device Brands & Models
      description: >-
        List the device brands and models a Cloud Phone SKU supports.


        - **Effect**: none. Read-only. Safe to retry with bounded backoff. No
        Cloud Phone is involved.

        - **Use**: pick a valid `brand` and `modelId` before calling
        `/cloudphone/create` or `/cloudphone/newMachine`, both of which reject a
        combination this endpoint does not return.

        - **Note**: an unknown `skuId` yields an empty list rather than an
        error.
      tags:
        - Cloud Phone Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skuId:
                  type: string
                  description: Cloud phone product ID
              required:
                - skuId
            example:
              skuId: '10002'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - 'null'
                  requestId:
                    type: string
                  timestamp:
                    type: integer
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        brand:
                          type: string
                        model:
                          type: string
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
                timestamp: 1
                data:
                  - brand: string
                    model: string
  /api/cloudphone/updateAdb:
    post:
      summary: Update ADB Connection Status
      description: >-
        Turn ADB access on or off for one or more Cloud Phones.


        - **Preconditions**: only phones whose SKU supports ADB are considered;
        if none of the supplied phones qualifies, the call is rejected. Phones
        that never had an instance allocated are skipped.

        - **Effect**: sets the ADB switch with the service and persists it for
        the phones the service accepted.

        - **Partial failure**: if some phones succeed and others do not, **the
        call still reports an error**. Treat a failure as “some phones may have
        been changed” and re-read state.

        - **Completion**: synchronous. Read the connection details with
        `/cloudphone/batchAdbInfo`, which only returns data for phones that are
        powered on and ADB-capable.


        Documented business errors: `33350`, `33401`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      operationId: updateAdbUsingPOST
      tags:
        - ADB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enableAdb:
                  type: boolean
                ids:
                  type: array
                  items:
                    type: string
              required:
                - enableAdb
                - ids
            example:
              enableAdb: true
              ids:
                - '1633612946805630'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Return result code 0:Normal Other codes are exceptions.
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Error message
                  requestId:
                    type: string
                    description: Operation Request ID
                required:
                  - code
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/batchAdbInfo:
    post:
      tags:
        - ADB
      summary: Batch Query ADB Info
      description: >-
        Fetch ADB connection details for up to 200 Cloud Phones.


        - **Preconditions**: the phones must belong to your team. They do
        **not** need to be claimed by you. Details are only fetched for phones
        that are powered on and whose SKU supports ADB.

        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Partial results**: results align with the requested ids and **never
        fail as a whole**. When details are unavailable, `remark` says why — the
        phone does not exist, is not powered on, does not support ADB, or the
        service lookup failed. Read `remark` before treating an empty entry as
        an error.

        - **Batch scope**: one request may include different device models;
        results are returned together.

        - **Note**: turn ADB on with `/cloudphone/updateAdb` first.
      operationId: batchAdbInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiBatchAdbInfoDto'
            example:
              envIds:
                - '1674380838117474'
                - '1675787900043353'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseDataListApiBatchAdbInfoResultDto'
              example:
                code: 0
                msg: success
                data:
                  - id: '1674380838117474'
                    supportAdb: true
                    envStatus: 4
                    adbIp: 192.168.1.100
                    adbPassword: abc12345
                    adbPort: '5555'
                    command: null
                    expireTime: null
                    remark: null
                  - id: '1675787900043353'
                    supportAdb: true
                    envStatus: 4
                    adbIp: 10.0.0.50
                    adbPassword: xyz78900
                    adbPort: '22'
                    command: ssh -L 5555:localhost:5555 user@10.0.0.50 -p 22
                    expireTime: '2026-05-23 12:00:00'
                    remark: null
  /api/cloudphone/exeCommand:
    post:
      summary: Execute ADB Shell Command
      description: >-
        Run a shell command on a Cloud Phone and return its output.


        - **Preconditions**: the phone must be powered on and not held by
        another member.

        - **Effect**: entirely determined by the command. MoreLogin stores
        nothing and applies **no command allow-list and no length limit**; the
        privileges the command runs with are set by the device service. Enable
        global root separately if a command needs it.

        - **Completion**: synchronous — `data` is the command output, not a task
        id.

        - **Retry**: there is no execution record to consult, so a timeout
        leaves the outcome unknown. Only retry commands you know are safe to run
        twice.


        Documented business errors: `33300`, `33301`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      operationId: executeShellCommand
      tags:
        - ADB
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Cloud phone ID
                command:
                  type: string
                  description: Shell command to execute
              required:
                - id
                - command
            example:
              command: >-
                am start -n
                com.android.chrome/com.google.android.apps.chrome.Main
              id: '1674153897828425'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response code: 0 indicates success, >0 indicates failure'
                  data:
                    type: string
                    description: Response Information
                  msg:
                    type:
                      - string
                      - 'null'
                    description: >-
                      Response message:An error message will be returned when
                      code is greater than 0
                  requestId:
                    type: string
                    description: >-
                      Unique request identifier; include it when contacting
                      support
                required:
                  - code
                  - data
                  - msg
              example:
                code: 0
                data: string
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/rpa/template/market/page:
