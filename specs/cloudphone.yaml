        - **Effect**: the list is pushed to the service and **not stored by
        MoreLogin**, so it cannot be read back. Supported on some models and
        Some device models; on other device models the call succeeds with no
        effect.

        - **Completion**: synchronous. On some models each package is sent as a
        separate service call, so a long list takes proportionally longer and a
