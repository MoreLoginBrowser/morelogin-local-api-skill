                msg: null
                data:
                  - appName: example-name
                    appIcon: string
                    packageName: example-name
                    versionCode: string
                    versionName: example-name
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
          headers: {}
      security: []
