  /api/cloudphone/create:
    post:
      summary: Create Cloud Phone
      description: >-
        Purchase and provision one or more Cloud Phones.


        - **Preconditions**: the plan must have remaining capacity and the daily
        creation quota must not be exhausted. `country`, `timezone` and
        `language` are validated against the list the selected device model
        supports, so an unsupported combination is rejected rather than silently
        adjusted. Coordinates are bounded to ±180 longitude, ±90 latitude. A
        phone number is discarded when the chosen SKU does not support one.
        Monthly SKUs are supported when returned by
        [`/api/cloudphone/monthly/skus`](./local-api.yaml#operation/listMonthlyCloudPhoneSkus);
        they currently use a 30-day term.

        - **Effect**: creates the Cloud Phone records. Pay-per-minute SKUs
        become usable after provisioning; monthly SKUs are created inactive.
        Creation never charges the wallet. Monthly phones are charged only by
        [`/api/cloudphone/monthly/activate`](./local-api.yaml#operation/activateMonthlyCloudPhones);
        pay-per-minute phones begin consuming balance or quota when powered on.

        - **Completion**: **accepted, not complete.** The Cloud Phone instance
        is not ready yet, and powering on too early is rejected. Poll
        [`/api/cloudphone/info`](./local-api.yaml#operation/infoUsingPOST) or
        [`/api/cloudphone/page`](./local-api.yaml#operation/pageUsingPOST) until
        `envStatus` reports the phone as powered off. For a monthly SKU, also
        complete
        [`/api/cloudphone/monthly/activate`](./local-api.yaml#operation/activateMonthlyCloudPhones)
        before powering it on.

        - **Retry**: not idempotent and not serialized. There is no idempotency
        key. Do not retry blindly after a timeout — query state first.


        Documented business errors: `19064`, `20018`, `33338`, `33339`, `33340`,
        `33341`, `33342`, `33343`, `33344`, `33345`, `33398`, `33399`, `33400`,
        `33408`. See [Error Codes](../Getting%20Started/error-codes.md) for what
        each code means. Any operation can additionally return the common codes.
      operationId: createUsingPOST
      tags:
        - Cloud Phone Management
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skuId:
                  type: string
                  description: >
                    Cloud Phone model

                    skuId:10002 model:Android 12

                    skuId:10013 model:Android 13

                    skuId:10005 model:Android 14

                    skuId:10004 model:Android 15

                    skuId:10014 model:Android 15A

                    skuId:10015 model:Android 16

                    See [Country Time Zone
                    Table](/api-reference/appendix/country-time-zone) for
                    supported regions and timezone mappings
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: Number of cloud phone created. Range of values:[1-10]
                envRemark:
                  type: string
                  maxLength: 1500
                  description: Profile Remarks (Length limit 1500 characters)
                groupId:
                  type: string
                  description: Group ID. Use `"0"` for ungrouped.
                groupName:
                  type: string
                  maxLength: 50
                  description: >-
                    Existing group name, or a new group name to create when no
                    matching group exists.
                automaticGeo:
                  type: boolean
                  description: >-
                    Whether to automatically match the geographic location.
                    Default:true
                automaticLanguage:
                  type: boolean
                  description: Whether to automatically match the language. Default:true
                automaticLocation:
                  type: boolean
                  description: >-
                    Whether to auto-match location (time zone, country).
                    Default:true
                country:
                  type: string
                  description: >-
                    Country code (e.g. `us`). See [Country Time Zone
                    Table](/api-reference/appendix/country-time-zone) for the
                    full list
                timezone:
                  type: string
                  description: Time zone, e.g. America/New_York
                language:
                  type: string
                  description: Language, e.g. en-US
                altitude:
                  type: number
                  description: Altitude
                latitude:
                  type: number
                  description: Latitude. Example:22.309182
                longitude:
                  type: number
                  description: Longitude. Example:114.176817
                speed:
                  type: number
                  maximum: 400
                  description: Movement speed
                bearing:
                  type: number
                  maximum: 360
                  description: Direction of movement
                accuracy:
                  type: number
                  maximum: 100
                  description: Horizontal accuracy
                phoneNumber:
                  type: string
                  description: >-
                    Customize your phone number. Format requirements:Must begin
                    with a + sign, country code must be 1-3 digits (excluding
                    86), total length 8-14 digits, and contain only + and
                    numbers.
                brand:
                  type: string
                  description: >-
                    device brand,You can query via the
                    https://guide.morelogin.com/api-reference/open-api/open-api/cloud-phone/paths/~1cloudphone~1brand~1models/post
                    interface.
                modelId:
                  type: number
                  description: >-
                    device model id,You can query via the
                    https://guide.morelogin.com/api-reference/open-api/open-api/cloud-phone/paths/~1cloudphone~1brand~1models/post
                    interface.
                proxyId:
                  type: string
                  description: Proxy ID
                tags:
                  type: array
                  items:
                    type: string
                  description: Tag names. Blank values are ignored.
              required:
                - skuId
                - quantity
            example:
              skuId: '1661515884160372'
              quantity: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - 'null'
                  data:
                    type: array
                    items:
                      type: string
                    description: This is Cloud phone IDS
                  requestId:
                    type: string
                  error:
                    type: object
                    properties: {}
                required:
                  - code
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                data:
                  - string
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
                error: {}
  /api/cloudphone/powerOn:
    post:
      summary: Start Cloud Phone
      description: >-
        Start a Cloud Phone.


        - **Preconditions**: the phone must currently be powered off. It is
        rejected when the SKU is delisted or under maintenance, when the phone
        is held by another member, while its proxy is still being checked, when
        the account is in arrears or the phone is deactivated, when a monthly
        term has expired, and when neither free minutes, a concurrency slot nor
        a positive balance is available. Some models additionally require the
        latest Windows client.

        - **Effect**: marks the phone as booting, claims it for the calling
        member, and reserves a concurrency slot or starts consuming time. The
        response reports which of the two was used.

        - **Completion**: **accepted, not complete.** Poll `/cloudphone/info`
        until `envStatus` is powered on; a failure surfaces there as `errorCode`
        and `errorMsg`. Members with a callback host configured also receive a
        webhook.

        - **Retry**: a concurrent second call is rejected outright rather than
        queued. After a timeout, read `/cloudphone/info` — do not resend.


        Documented business errors: `33300`, `33309`, `33315`, `33316`, `33317`,
        `33318`, `33321`, `33322`, `33323`, `33324`, `33325`, `33346`, `33347`,
        `33367`, `33376`, `33407`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      operationId: powerOnUsingPOST
      tags:
        - Cloud Phone Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                headless:
                  type: boolean
                  description: >-
                    Display Cloud Phone Window. false:Display, true:Do not
                    display, Default:true
                disableMoneySavingMode:
                  type: boolean
                  description: Disable power saving mode, default:false
              required:
                - id
            example:
              id: '1637226321190925'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Return result code 0:Normal Other codes are exceptions.
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Error message
                  requestId:
                    type: string
                    description: Operation Request ID
                required:
                  - code
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/restart:
    post:
      summary: Restart Cloud Phone
      description: >-
        Restart the entire Cloud Phone. Running AI tasks are terminated and
        in-progress app installation records are cleared.


        Operate on one Cloud Phone by `id`. The caller must have access to the
        phone; it must be activated, not released or transferring, powered on
        (`envStatus=4`), and not occupied by another member. Success returns
        `data: null` with no task ID and means submission succeeded, not
        completion. Query `/api/cloudphone/info` or `/api/cloudphone/page` with
        bounded polling: processing is `envStatus=6`, success returns to `4`,
        and callback failure changes it to `2`. If subscribed, use the final
        `cloud_phone.restart` Webhook result. There is no idempotency key: after
        a timeout, query state before retrying; another call after completion
        may execute again.


        Documented business errors: `33300`, `33301`, `33310`, `33321`, `33325`,
        `33359`, `33382`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the
        common codes.
      operationId: restartCloudPhone
      tags:
        - Cloud Phone Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
            example:
              id: '1596527092376632'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Return result code 0:Normal Other codes are exceptions.
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Error message
                  requestId:
                    type: string
                    description: Operation Request ID
                  data:
                    type: 'null'
                required:
                  - code
                  - msg
                  - requestId
                  - data
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
                data: null
  /api/cloudphone/reset:
    post:
      summary: Reset Cloud Phone
      description: >-
        **Data deletion warning:** reset clears phone data and app installation
        records and terminates running AI tasks. Back up required data first.
        This is distinct from the one-click new device operation.


        Operate on one Cloud Phone by `id`. The caller must have access to the
        phone; it must be activated, not released or transferring, powered on
        (`envStatus=4`), and not occupied by another member. Success returns
        `data: null` with no task ID and means submission succeeded, not
        completion. Query `/api/cloudphone/info` or `/api/cloudphone/page` with
        bounded polling: processing is `envStatus=5`, success returns to `4`,
        and callback failure changes it to `2`. If subscribed, use the final
        `cloud_phone.reset` Webhook result. There is no idempotency key: after a
        timeout, query state before retrying; another call after completion may
        execute again.


        Documented business errors: `33300`, `33301`, `33311`, `33321`, `33325`,
        `33359`, `33382`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the
        common codes.
      operationId: resetCloudPhone
      tags:
        - Cloud Phone Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
            example:
              id: '1596527092376632'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Return result code 0:Normal Other codes are exceptions.
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Error message
                  requestId:
                    type: string
                    description: Operation Request ID
                  data:
                    type: 'null'
                required:
                  - code
                  - msg
                  - requestId
                  - data
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
                data: null
  /api/cloudphone/powerOff:
    post:
      summary: Stop Cloud Phone
      description: >-
        Stop a Cloud Phone.


        - **Preconditions**: the phone must be booting or powered on. It cannot
        be stopped while held by another member, or while a one-click new
        device, restart or reset is in progress.

        - **Effect**: stops billing, releases the concurrency slot, settles
        usage, and invalidates the connection credentials issued for the
        session. Stopping a phone that was still booting interrupts the start
        instead.

        - **Completion**: billing and local state are settled synchronously;
        device shutdown continues afterwards, so confirm with
        `/cloudphone/info`.

        - **Retry**: a second call reports the phone as not running. Batches
        abort on the first failure, so re-read state before retrying.


        Documented business errors: `33300`, `33301`, `33308`, `33331`, `33332`,
        `33333`. See [Error Codes](../Getting%20Started/error-codes.md) for what
        each code means. Any operation can additionally return the common codes.
      operationId: powerOffUsingPOST
      tags:
        - Cloud Phone Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
              required:
                - id
            example:
              id: '1596527092376632'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Return result code 0:Normal Other codes are exceptions.
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Error message
                  requestId:
                    type: string
                    description: Operation Request ID
                required:
                  - code
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/edit/batch:
    post:
      summary: Update Cloud Phone Profile
      description: >-
        Update the configuration of one or more Cloud Phones.


        - **Preconditions**: the phones must belong to the team. Region,
        language and coordinate values are validated for each device model,
        exactly as on create. Moving a phone into a group you are not authorized
        for is rejected.

        - **Effect**: overwrites the phone settings and refreshes the GPS
        configuration; may create tag bindings. Nothing is charged and
        concurrency is unaffected.

        - **Completion**: synchronous, and idempotent for the same body.
      operationId: editBatchUsingPOST
      tags:
        - Cloud Phone Management
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: array
                  items:
                    type: string
                  description: Cloud phone IDs
                envName:
                  type: string
                  maxLength: 64
                  minLength: 1
                  description: Cloud phone name (≤64 chars)
                phoneNumber:
                  type: string
                  description: >-
                    Customize your phone number. Format requirements:Must begin
                    with a + sign, country code must be 1-3 digits (excluding
                    86), total length 8-14 digits, and contain only + and
                    numbers.
                powerOnBillingStrategy:
                  type: integer
                  enum:
                    - 0
                    - 1
                  description: >-
                    Non-Monthly cloud phone billing method (0:default,
                    1:parallel pack only)
                proxyId:
                  type: string
                  description: Proxy ID
                groupId:
                  type: string
                  description: Environment group ID
                groupName:
                  type: string
                  maxLength: 50
                  description: >-
                    Existing group name, or a new group name to create when no
                    matching group exists.
                tags:
                  type: array
                  items:
                    type: string
                  description: Replacement tag names. Blank values are ignored.
                envRemark:
                  type: string
                  maxLength: 1500
                  description: Environment remark (≤1500 chars, line breaks supported)
                automaticGeo:
                  type: boolean
                  description: Auto geolocation
                automaticLanguage:
                  type: boolean
                  description: Auto language
                automaticLocation:
                  type: boolean
                  description: Auto location (timezone & country)
                country:
                  type: string
                  description: Country
                timezone:
                  type: string
                  description: Timezone
                language:
                  type: string
                  description: Language
                latitude:
                  type: number
                  description: Latitude
                longitude:
                  type: number
                  description: Longitude
                enableRoot:
                  type: boolean
                  description: Enable global ROOT
              required:
                - id
            example:
              id:
                - '1637238770951311'
              proxyId: '0'
              automaticGeo: false
              automaticLanguage: false
              automaticLocation: false
              country: bo
              timezone: America/La_Paz
              language: de-CH
              latitude: 0
              longitude: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Return result code:0,Normal Other codes are exceptions.
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Error message
                  requestId:
                    type: string
                    description: Operation Request ID
                required:
                  - code
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/setProxy:
    post:
      tags:
        - Cloud Phone Management
      summary: Set cloud phone proxy
      description: >-
        Bind a proxy to one or more Cloud Phones.


        - **Preconditions**: provide at least one of `ids` or `uniqueIds`. The
        phones must belong to your team; they do **not** need to be powered on.
        A supplied `proxyId` must exist, otherwise the call is rejected.

        - **Effect**: when `proxyId` is omitted or `0`, an existing proxy with
        identical connection details is reused and **a new proxy record is
        created in your team if none matches**. The proxy check state is reset
        and the previous proxy is remembered.

        - **Completion**: synchronous. **Phones that are powered on receive the
        new proxy immediately — no restart is needed**; powered-off phones pick
        it up on next start.

        - **Retry**: rebinding an existing `proxyId` is idempotent, but
        repeating a call that carries raw connection details can create another
        proxy record each time deduplication misses.


        Documented business errors: `33300`, `33303`, `33320`, `14023`. See
        [Error Codes](../Getting%20Started/error-codes.md) for what each code
        means. Any operation can additionally return the common codes.
      operationId: setProxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudPhoneSetProxyApiDto'
            example:
              ids:
                - '1558968155668507'
              uniqueIds:
                - 1001
              proxy:
                proxyIp: 192.168.1.100
                proxyPort: 8080
                proxyProvider: 2
      responses:
        '200':
          description: >-
            Success. `data` is always null for this operation; the outcome is
            carried by `code`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response code: 0 = success, >0 = error'
                  data:
                    type: 'null'
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Message; populated if code > 0
                  requestId:
                    type: string
                    description: >-
                      Unique request identifier; include it when contacting
                      support
              example:
                code: 0
                data: null
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/delete/batch:
    post:
      summary: Delete Cloud Phone
      description: >-
        Release one or more Cloud Phones.


        - **Preconditions**: the phones must not be mid-transfer and the team
        must have no unpaid order for them. The phone does not have to be
        powered off.

        - **Effect**: the Cloud Phone instance is released immediately. A phone
        that was never activated is deleted outright; an activated phone is
        retained as a deactivated record, so it keeps appearing in listings with
        a deactivated status.

        - **Completion**: synchronous.

        - **Retry**: phones are processed one by one and the call aborts on the
        first failure, so a partially applied batch is possible. Re-read
        `/cloudphone/page` before retrying, and retry only the phones that are
        still active.
      operationId: deleteUsingPOST
      tags:
        - Cloud Phone Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
              required:
                - ids
            example:
              ids:
                - '1595755686723985'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Return result code 0:Normal Other codes are exceptions.
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Error message
                  requestId:
                    type: string
                    description: Operation Request ID
                required:
                  - code
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/newMachine:
    post:
      summary: One-click new machine
      description: >-
        Replace a Cloud Phone's device identity in place (one-click new device).


        - **Preconditions**: the phone must be powered on and not held by
        another member. A supplied brand and model must be one the phone's SKU
        supports. **This consumes the daily Cloud Phone creation quota**, the
        same quota `/cloudphone/create` uses.

        - **Effect**: pushes a new brand and model to the device, clears the
        installed-app records for that phone, resets its phone number, and
        aborts any running AI task. The exact set of identifiers the service
        regenerates is not defined by MoreLogin.

        - **Completion**: **accepted, not complete.** The phone sits in a
        one-click-new-device state; poll `/cloudphone/info` until it leaves that
        state.

        - **Concurrency**: while it runs, power on, power off and every command
        that needs a running phone are rejected. A concurrent second call is
        rejected rather than queued.


        Documented business errors: `33300`, `33301`, `33326`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      operationId: oneNewUsingPOST
      tags:
        - Cloud Phone Management
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Cloud phone ID
                brand:
                  type: string
                  description: Brand
                modelId:
                  type: integer
                  description: Model ID
            example:
              id: '1595372958075305'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response code:0 indicates success, >0 indicates failure
                  msg:
                    type:
                      - string
                      - 'null'
                  requestId:
                    type: string
                    description: >-
                      Unique request identifier; include it when contacting
                      support
                required:
                  - code
                  - msg
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
  /api/cloudphone/info:
    post:
      summary: Get Cloud Phone Details
      description: >-
        Return the full detail of a single Cloud Phone, including group and tag
        names.


        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Use**: the primary status endpoint for asynchronous operations.
        `envStatus` distinguishes new, creation failed, powered off, booting,
        powered on, resetting, restarting and one-click-new-device in progress;
        `errorCode` and `errorMsg` carry the reason when an asynchronous
        operation failed.
      operationId: infoUsingPOST
      tags:
        - Cloud Phone Management
      requestBody:
        required: true
        content:
          application/json:
