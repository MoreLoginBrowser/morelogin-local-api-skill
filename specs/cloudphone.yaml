        - Apps
      summary: Enable app ROOT
      description: >-
        Grant ROOT to specific app packages on a Cloud Phone.


        - **Preconditions**: the phone must be powered on and not held by
        another member. Supported on compatible device models; on incompatible
        models the call succeeds but has no effect.

        - **Effect**: pushes the package allow-list to the device and, as a side
        effect, turns the ROOT switch on. **Nothing is stored by MoreLogin**, so
