  /api/cloudphone/rpa/task/save:
    post:
      operationId: saveCloudPhoneRpaTaskLocal
      summary: Creating a schedule
      deprecated: false
      description: >
        Save cloud phone scheduled task.


        templateParameter Parameter Specification
         1. __Parameter Source__
        Parameter keys must be extracted from the `parameter` field returned by
        the following APIs:

        - Get market template pages

        - Get Personal template pages

        2.  __Data Structure__

        - Submit parameters in JSON object format: `{"key1": "value1", "key2":
        "value2"}`

        - Final parameter values must be deserialized according to business
        logic before use

        3. __Common Type Parameters__

        For the following parameter types, pass values directly in the
        corresponding format:

        - string: `{"name": "John"}`

        - decimal / number: `{"amount": 100.50}`

        - boolean: `{"enabled": true}`

        4. __Media Type Parameters__

        For media parameters such as image (pic) or video (video), in addition
        to basic information, a fixed key `"__Extra__"` must be included.
        Example format:

        ```json

        {
            "__Extra__": {
                "pic": {
                    "name": "pic_name",
                    "size": 204800
                },
                "video": {
                    "name": "video_name",
                    "size": 204800000
                }
            },
            "pic": "https://get.morelogin.com/prod/cloudPhoneTaskVideo/1556061681934880/1c62314c7e2b4d298abe8d5452d7c050/test.png",
            "video": "https://get.morelogin.com/pre/cloudPhoneTaskVideo/1542431036481556/4c4fed83685345ae8f1505fbe0c2f123/baby.mp4"
        }

        ```

        5. __Parameter Configuration Example__

        The following example demonstrates how to configure the
        `templateParameter` parameter when saving a plan using a market
        template:

        - __Step 1: Retrieve Template Parameters__

        Call the Market Template API:

        `GET /api/cloudphone/rpa/template/market/page`

        Extract the `parameter` field from the response, for example:


        ```json

        "parameter":
        "{\"videoDownloadUrl\":{\"type\":\"video\",\"extra\":{\"name\":\"Select
        Video\",\"type\":\"video\",\"required\":true,\"defaultValue\":{\"enabled\":false},\"index\":1,\"sizeLimit\":{\"value\":200,\"unit\":\"MB\"},\"formatType\":[\"mp4\",\"mov\"]}},\"videoDescription\":{\"type\":\"string\",\"extra\":{\"name\":\"Video
        Caption\",\"type\":\"string\",\"required\":false,\"charValid\":{\"enabled\":true,\"value\":1000},\"multiline\":{\"enabled\":true,\"value\":3},\"defaultValue\":{\"enabled\":false},\"index\":2}},\"coverUrl\":{\"type\":\"image\",\"extra\":{\"name\":\"Cover
        Image\",\"type\":\"image\",\"required\":false,\"defaultValue\":{\"enabled\":false},\"index\":3,\"sizeLimit\":{\"value\":5,\"unit\":\"MB\"},\"formatType\":[\"jpg\",\"png\",\"jpeg\"]}},\"enableAIGC\":{\"type\":\"boolean\",\"extra\":{\"name\":\"AI
        Label\",\"type\":\"boolean\",\"required\":false,\"defaultValue\":{\"enabled\":false},\"index\":4}},\"productId\":{\"type\":\"string\",\"extra\":{\"name\":\"Product
        ID\",\"type\":\"string\",\"required\":false,\"charValid\":{\"enabled\":true,\"value\":50},\"placeholder\":\"Product
        ID only supports digits, with a maximum of 50
        characters.\",\"defaultValue\":{\"enabled\":false},\"index\":5}},\"productTitle\":{\"type\":\"string\",\"extra\":{\"name\":\"Product
        Title\",\"type\":\"string\",\"required\":false,\"charValid\":{\"enabled\":true,\"value\":30},\"defaultValue\":{\"enabled\":false},\"index\":6}},\"getLeads\":{\"type\":\"boolean\",\"extra\":{\"name\":\"Get
        Leads\",\"type\":\"boolean\",\"required\":false,\"defaultValue\":{\"enabled\":false},\"index\":7}},\"comment\":{\"type\":\"string\",\"extra\":{\"name\":\"Comment\",\"type\":\"string\",\"required\":false,\"charValid\":{\"enabled\":true,\"value\":200},\"multiline\":{\"enabled\":true,\"value\":3},\"defaultValue\":{\"enabled\":false},\"index\":8}}}"

        ```


        - __Step 2: Build the Parameter JSON__

        Construct the JSON object according to the parameter requirements:

        ```json

        {
          "__Extra__": {
            "videoDownloadUrl": {
              "name": "video_name.mp4",
              "size": 204800000
            }
          },
          "videoDownloadUrl": "https://get.morelogin.com/pre/cloudPhoneTaskVideo/1542431036481556/4c4fed83685345ae8f1505fbe0c2f123/baby.mp4"
        }

        ```

        - __Step 3: Escape the JSON String__

        Convert the JSON object into an escaped string format:

        ```json

        "{\"__Extra__\": {\"videoDownloadUrl\": {\"name\":
        \"video_name.mp4\",\"size\": 204800000}},\"videoDownloadUrl\":
        \"https://get.morelogin.com/pre/cloudPhoneTaskVideo/1542431036481556/4c4fed83685345ae8f1505fbe0c2f123/baby.mp4\"}"

        ```

        - __Step 4: API Call__

        Pass the escaped string as the value of the `templateParameter`
        parameter to the target API.
      tags:
        - Schedules
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                taskName:
                  type: string
                  description: Task name
                templateId:
                  type: string
                  description: Template ID
                templateType:
                  type: string
                  description: Template type. PERSONAL:personal; MARKET:marketplace
                taskType:
                  type: string
                  description: Task type. TEMPORARY or SCHEDULED
                notes:
                  type: string
                  description: Plan notes
                cloudPhoneConfigs:
                  type: array
                  items:
                    type: object
                    properties:
                      cloudPhoneId:
                        type: string
                        description: Cloud phone ID
                      triggerTime:
                        type: string
                        description: Task execution time, UTC+0 time zone
                      templateParameter:
                        type: string
                        description: >-
                          Template parameters are defined in personal templates
                          or market templates. The parameters in the template
                          are defined
                          as:{"Test":{"extra":{"type":"string","required":true,"multiline":{"enabled":false},"name":"Test","index":1},"type":"string"}}
                          When requesting parameters, the parameter passed
                          is:{"Test":"xxxx"}
                    required:
                      - cloudPhoneId
                      - triggerTime
                      - templateParameter
                  description: Collection of cloud phone schedule configurations
                scheduleConfig:
                  type: object
                  properties:
                    endTime:
                      type: string
                      description: date-time
                    scheduleType:
                      type: string
                      description: Schedule type. ONCE:one-time; DAILY:daily
                  required:
                    - endTime
                    - scheduleType
                  description: Task schedule configuration
              required:
                - cloudPhoneConfigs
                - scheduleConfig
                - taskName
                - taskType
                - templateId
                - templateType
            example:
              cloudPhoneConfigs:
                - cloudPhoneId: '1661515884160372'
                  triggerTime: string
                  templateParameter: string
              scheduleConfig:
                endTime: string
                scheduleType: string
              taskName: example-name
              taskType: string
              templateId: '1661515884160372'
              templateType: string
        required: true
      responses:
        '200':
          description: Success. `data` is a single integer value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response code, 0 indicates success,>0 indicates failure
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Error msg
                  requestId:
                    type: string
                    description: Request trace id
                  data:
                    type: integer
                    description: Schedules id
                required:
                  - code
                  - data
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
                data: 1
          headers: {}
  /api/cloudphone/rpa/onceTask/save:
    post:
      operationId: saveCloudPhoneRpaOneTimeTaskLocal
      summary: Create One-Time Schedule
      deprecated: false
      description: >-
        Create a one-time scheduled task for a cloud phone using a marketplace
        or personal RPA template.


        ---


        ### `templateParameter` Reference


        The `templateParameter` field accepts a **JSON-escaped string**
        containing key-value pairs that correspond to the template's declared
        parameters.


        #### 1. Where to find parameter keys


        Retrieve the `parameter` field from either:

        - `POST /api/cloudphone/rpa/template/market/page` (marketplace
        templates)

        - `POST /api/cloudphone/rpa/template/personal/page` (personal templates)


        #### 2. Supported value types


        | Type | Example |

        |------|---------|

        | `string` | `{"name": "John"}` |

        | `number` | `{"amount": 100.50}` |

        | `boolean` | `{"enabled": true}` |

        | `image` / `video` | See media format below |


        #### 3. Media parameters (image / video)


        Media parameters require an additional `__Extra__` key containing file
        metadata:


        For files already uploaded to MoreLogin Cloud Storage, use the cloud
        file protocol as the parameter value:

        `morelogin://cloudfile?ids=1,2`. The `ids` value is a comma-separated
        list of Cloud Storage file IDs.


        ```json

        {
          "__Extra__": {
            "pic": { "name": "photo.png", "size": 204800 },
            "video": { "name": "clip.mp4", "size": 204800000 }
          },
          "pic": "https://example.com/photo.png",
          "video": "https://example.com/clip.mp4"
        }

        ```


        #### 4. Step-by-step example


        **Step 1** — Call the marketplace template API and extract the
        `parameter` field from the response.


        **Step 2** — Build a JSON object with the required parameter keys and
        values:


        ```json

        {
          "__Extra__": {
            "videoDownloadUrl": { "name": "video.mp4", "size": 204800000 }
          },
          "videoDownloadUrl": "morelogin://cloudfile?ids=1,2"
        }

        ```


        **Step 3** — Escape the JSON object into a string:


        ```

        "{\"__Extra__\":{\"videoDownloadUrl\":{\"name\":\"video.mp4\",\"size\":204800000}},\"videoDownloadUrl\":\"morelogin://cloudfile?ids=1,2\"}"

        ```


        **Step 4** — Pass the escaped string as the `templateParameter` value in
        your API request.


        Documented business errors: `33814`, `33818`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      tags:
        - Schedules
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cloudPhoneId:
                  type: string
                  description: Cloud phone ID
                scheduleName:
                  type: string
                  description: Schedule name
                templateId:
                  type: string
                  description: Template ID,  Personal template or market template ID
                templateParameter:
                  type: string
                  description: >-
                    JSON-escaped string of template parameter key-value pairs.
                    Extract parameter keys from the `parameter` field returned
                    by the List Marketplace Templates or List Personal Templates
                    APIs. See the endpoint description above for the full
                    specification and step-by-step example.
                description:
                  type: string
                  description: Schedule description
              required:
                - cloudPhoneId
                - scheduleName
                - templateId
            example:
              cloudPhoneId: '1678331966138097'
              scheduleName: test
              templateId: '1678347487160296'
              templateParameter: '{"keyword": "abc"}'
              description: schedule description
        required: true
      responses:
        '200':
          description: Success. `data` is a single integer value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response code, 0 indicates success,>0 indicates failure
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Error msg
                  requestId:
                    type: string
                    description: Request trace id
                  data:
                    type: integer
                    description: Schedules id
                required:
                  - code
                  - data
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
                data: 1
          headers: {}
      security: []
  /api/cloudphone/rpa/task/cancel:
    post:
      operationId: cancelCloudPhoneRpaTaskLocal
      summary: Cancel Schedule
      deprecated: false
      description: >-
        Cancel an RPA schedule and every execution of it that has not finished.


        - **Preconditions**: the schedule must exist in the team. A finished
        schedule cannot be cancelled; an already cancelled one returns success
        without doing anything.

        - **Effect**: the schedule is marked cancelled **synchronously**, and a
        cancel request is queued for each pending, waiting, executing or
        checking execution.

        - **Completion**: mixed. Read the schedule state from
        `/cloudphone/rpa/task/page`, but confirm individual executions through
        `/cloudphone/rpa/subTask/page` — an execution already running stops
        asynchronously, not at once.

        - **Retry**: idempotent.
      tags:
        - Schedules
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Plan id
              required:
                - id
            example:
              id: '1678919049331329'
        required: true
      responses:
        '200':
          description: >-
            Success. `data` is always null for this operation; the outcome is
            carried by `code`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response code, 0 indicates success,>0 indicates failure
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Error msg
                  requestId:
                    type: string
                    description: Request trace id
                  data:
                    type: 'null'
                required:
                  - code
                  - data
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
                data: null
          headers: {}
      security: []
