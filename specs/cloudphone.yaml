                taskState:
                  type:
                    - integer
                    - 'null'
                  description: >-
                    Plan status; 0:awaiting execution; 1:Executing; 2:Execution
                    completed 3:Cancel
                  maximum: 9
                  minimum: 0
                templateId:
                  type:
                    - string
                    - 'null'
                  description: Template id
                  maximum: 99999999999
                  minimum: 0
                templateTitle:
                  type:
                    - string
                    - 'null'
                  description: Template title
                  maxLength: 255
                  minLength: 0
                cloudPhoneId:
                  type:
                    - string
                    - 'null'
                  description: cloud phone id
                  example: '1559133625483282'
                cloudPhoneName:
                  type:
                    - string
                    - 'null'
                  description: Cloud phone name
                  maxLength: 100
                  minLength: 0
                beginTime:
                  type:
                    - string
                    - 'null'
                  description: Task start time UTC+0 time zone
                  example: '2025-01-01 23:59:59'
                endTime:
                  type:
                    - string
                    - 'null'
                  description: |
                    Task end time UTC+0 time zone
                  example: '2025-01-02 23:59:59'
                pageNo:
                  type:
                    - integer
                    - 'null'
                  description: Default:1
                  example: 1
                pageSize:
                  type:
                    - integer
                    - 'null'
                  description: Default:10
            example:
              taskId: null
              taskName: null
              taskState: null
        required: true
      responses:
        '200':
          description: >-
            Success. `data` is an object with the fields `id`, `taskName`,
            `taskState`, `cloudPhoneId`, `cloudPhoneName`, `templateName`, ….
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response code, 0 indicates success,>0 indicates failure
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Error msg
                  requestId:
                    type: string
                    description: Request trace id
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Execution record id
                      taskName:
                        type: string
                        description: Schedule Task name
                      taskState:
                        type: integer
                        description: >-
                          Schedule status; 0:awaiting execution; 1:Executing;
                          2:Execution completed 3:Cancel
                      cloudPhoneId:
                        type: string
                        description: Cloud phone ID
                      cloudPhoneName:
                        type: string
                        description: Cloud phone name
                      templateName:
                        type: string
                        description: Template title
                      handleFailCode:
                        type: string
                        description: Task failure code
                      handleFailReason:
                        type: string
                        description: Task failure reason
                      handleResult:
                        type: integer
                        description: Task result. 0:failed; 1:succeeded
                      handleResultAttachment:
                        type: string
                        description: Task execution result attachment
                      handleTime:
                        type: string
                        description: Execution time
                      endTime:
                        type: string
                        description: Task end time
                      powerOnTime:
                        type: string
                        description: Cloud phone power-on time
                      triggerNextTime:
                        type: string
                        description: Next scheduled trigger time
                      triggerTime:
                        type: string
                        description: Scheduled trigger time
                      createDate:
                        type: string
                        description: Creation time
                      createMember:
                        type: string
                        description: Creator
                      updateDate:
                        type: string
                        description: Last update time
                      updateMember:
                        type: string
                        description: Last updater
                required:
                  - code
                  - msg
                  - data
                  - requestId
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
                data:
                  id: '1673823102599682'
                  taskName: example-name
                  taskState: 1
                  cloudPhoneId: '1673823102599682'
                  cloudPhoneName: example-name
                  templateName: example-name
                  handleFailCode: string
                  handleFailReason: string
                  handleResult: 1
                  handleResultAttachment: string
                  handleTime: '2026-09-01 12:00:00'
                  endTime: '2026-09-01 12:00:00'
                  powerOnTime: '2026-09-01 12:00:00'
                  triggerNextTime: '2026-09-01 12:00:00'
                  triggerTime: '2026-09-01 12:00:00'
                  createDate: '2026-09-01 12:00:00'
                  createMember: string
                  updateDate: '2026-09-01 12:00:00'
                  updateMember: '2026-09-01 12:00:00'
          headers: {}
      security: []
  /api/cloudphone/rpa/subTask/cancel/{id}:
    post:
      operationId: cancelCloudPhoneRpaSubTaskLocal
      summary: Cancel Execution
      deprecated: false
      description: >-
        Cancel a single RPA execution without touching its schedule.


        - **Preconditions**: the execution record must exist in the team. A
        finished one cannot be cancelled; an already cancelled one returns
        success without doing anything.

        - **Effect**: **queues a cancel request only — no state is written by
        this call.** The schedule keeps running and later executions are
        unaffected. Use `/cloudphone/rpa/task/cancel` to stop the schedule
        itself.

        - **Completion**: asynchronous. Poll `/cloudphone/rpa/subTask/page` or
        the execution detail until the state becomes cancelled. An execution
        that is already running is not stopped instantly.

        - **Retry**: idempotent; a repeat only re-queues the request.
      tags:
        - Schedules
      parameters:
        - name: id
          in: path
          description: ''
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Plan id
              required:
                - id
            example:
              id: '1678919049331329'
        required: true
      responses:
        '200':
          description: >-
            Success. `data` is always null for this operation; the outcome is
            carried by `code`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response code, 0 indicates success,>0 indicates failure
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Error msg
                  requestId:
                    type: string
                    description: Request trace id
                  data:
                    type: 'null'
                required:
                  - code
                  - data
                  - msg
                  - requestId
              example:
                code: 0
                msg: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
                data: null
          headers: {}
      security: []
  /api/cloudphone/touch/click:
    post:
      tags:
        - Touch
      summary: Touch - Click
      description: >-
        Tap a point on the Cloud Phone screen.


        - **Preconditions**: the phone must be powered on and not held by
        another member. Supported on compatible device models only; incompatible
        models reject the call.

        - **Coordinates**: `pos` must hold exactly two values, `[x, y]`. **They
        are not checked against the screen resolution** — an off-screen point is
        passed through to the service.

        - **Completion**: synchronous. `data.status` is `finish` when the
        gesture completed, or `pending` when the service queued it. Some models
        always report `finish`. There is no endpoint to poll a `pending`
        gesture.

        - **Retry**: no deduplication. Two calls are two taps, so a blind retry
        after a timeout can double-tap.

        - **Note**: `duration` is accepted but ignored here; only long press
        reads it.


        Documented business errors: `33300`, `33301`, `33401`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      operationId: touchClick
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TouchClickRequest'
            example:
              id: '1558968155668507'
              pos:
                - 540
                - 960
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TouchResultResponse'
              example:
                code: 0
                msg: success
                data:
                  status: finish
  /api/cloudphone/touch/doubleClick:
    post:
      tags:
        - Touch
      summary: Touch - Double Click
      description: >-
        Double-tap a point on the Cloud Phone screen.


        - **Preconditions**: the phone must be powered on and not held by
        another member. Supported on compatible device models only; incompatible
        models reject the call.

        - **Effect**: on some models this is emulated as four touch events with
        fixed 50/100/50 ms gaps, so the tap rhythm is not configurable.
        `duration` is ignored.

        - **Completion**: synchronous. `data.status` is `finish` or `pending`,
        as for a single tap.

        - **Retry**: no deduplication; a repeat call double-taps again.


        Documented business errors: `33300`, `33301`, `33401`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      operationId: touchDoubleClick
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TouchClickRequest'
            example:
              id: '1558968155668507'
              pos:
                - 540
                - 960
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TouchResultResponse'
              example:
                code: 0
                msg: success
                data:
                  status: finish
  /api/cloudphone/touch/longClick:
    post:
      tags:
        - Touch
      summary: Touch - Long Press
      description: >-
        Press and hold a point on the Cloud Phone screen.


        - **Preconditions**: the phone must be powered on and not held by
        another member. Supported on compatible device models only; incompatible
        models reject the call.

        - **Values**: `duration` is the hold time in milliseconds, capped at
        60000. **There is no lower bound**, so a negative value passes
        validation and is handed to the service. On some models an omitted
        `duration` defaults to 1000 ms.

        - **Completion**: synchronous. `data.status` is `finish` or `pending`.

        - **Retry**: no deduplication; a repeat call presses again.


        Documented business errors: `33300`, `33301`, `33401`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      operationId: touchLongClick
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TouchClickRequest'
            example:
              id: '1558968155668507'
              pos:
                - 540
                - 960
              duration: 2000
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TouchResultResponse'
              example:
                code: 0
                msg: success
                data:
                  status: finish
  /api/cloudphone/touch/swipe:
    post:
      tags:
        - Touch
      summary: Touch - Swipe
      description: >-
        Swipe between two points on the Cloud Phone screen.


        - **Preconditions**: the phone must be powered on and not held by
        another member. Supported on compatible device models only; incompatible
        models reject the call.

        - **Values**: `pos1` is the start point and `pos2` the end point, each
        exactly `[x, y]`. `duration` is the gesture time in milliseconds, capped
        at 60000; on some models it defaults to 300 ms and the path is
        interpolated into five intermediate move events.

        - **Completion**: synchronous. `data.status` is `finish` or `pending`.

        - **Retry**: no deduplication; a repeat call swipes again.


        Documented business errors: `33300`, `33301`, `33401`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      operationId: touchSwipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TouchSwipeRequest'
            example:
              id: '1558968155668507'
              pos1:
                - 540
                - 1500
              pos2:
                - 540
                - 500
              duration: 300
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TouchResultResponse'
              example:
                code: 0
                msg: success
                data:
                  status: finish
  /api/cloudphone/touch/drag:
    post:
      tags:
        - Touch
      summary: Touch - Drag
      description: >-
        Drag between two points on the Cloud Phone screen.


        - **Preconditions**: the phone must be powered on and not held by
        another member. Supported on compatible device models only; incompatible
        models reject the call.

        - **Note**: **on some models this is the same implementation as swipe**
        — the service delegates drag straight to the swipe routine, so the two
        are indistinguishable there. Other models have a separate drag action.

        - **Completion**: synchronous. `data.status` is `finish` or `pending`.

        - **Retry**: no deduplication; a repeat call drags again.


        Documented business errors: `33300`, `33301`, `33401`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      operationId: touchDrag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TouchSwipeRequest'
            example:
              id: '1558968155668507'
              pos1:
                - 200
                - 500
              pos2:
                - 800
                - 500
              duration: 500
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TouchResultResponse'
              example:
                code: 0
                msg: success
                data:
                  status: finish
components:
  schemas:
    ResponseDataPageResultCloudPhoneAppDto:
      type: object
      properties:
        code:
          type: integer
          description: Status code, 0 means success
          example: 0
        msg:
          type:
            - string
            - 'null'
          description: Description message
          example: Success
        data:
          description: Response data
          $ref: '#/components/schemas/PageResultCloudPhoneAppDto'
    PageResultCloudPhoneAppDto:
      type: object
      properties:
        total:
          type: string
          description: Total number of records
          example: '15'
        current:
          type: string
          description: Current page number
          example: '1'
        pages:
          type: string
          description: Total number of pages
          example: '2'
        dataList:
          type: array
          items:
            $ref: '#/components/schemas/CloudPhoneAppDto'
          description: List of team applications
    CloudPhoneAppDto:
      type: object
      properties:
        id:
          type: string
          description: Record ID
          example: '123456'
        appName:
          type: string
          description: Application name
          example: Facebook
        packageName:
          type: string
          description: Android package name
          example: com.facebook.katana
        versionName:
          type: string
          description: Version display name
          example: 450.0.0.1
        versionCode:
          type: string
          description: Version code
          example: '450000000'
        enabled:
          type: boolean
          description: Whether the application is enabled
          example: true
        desc:
          type: string
          description: Application description
          example: Social media application
        enableRoot:
          type: boolean
          description: Whether ROOT access is enabled for the application
          example: false
    ApiAppRootOperateDto:
      type: object
      required:
        - id
        - packageNames
      properties:
        id:
          type: string
          description: Cloud Phone ID
          example: '12345678'
        packageNames:
          type: array
          items:
            type: string
          description: List of application package names to allow ROOT access
          example:
            - com.test
    CloudPhoneSetProxyApiDto:
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
          description: List of cloud phone environment IDs
          example:
            - '1558968155668507'
        uniqueIds:
          type: array
          items:
            type: integer
          description: >-
            List of display sequence IDs of cloud phone environments (used as
            reference mapping if envIds are not provided)
          example:
            - 1001
        proxy:
          description: Proxy settings
          $ref: '#/components/schemas/CloudPhoneProxyDto'
    CloudPhoneProxyDto:
      type: object
      required:
        - proxyIp
        - proxyPort
        - proxyProvider
      properties:
        proxyId:
          type: string
          description: >-
            Proxy Configuration ID (If this value is greater than 0, it means
            reusing an existing proxy configuration; if empty or <=0, it
            represents using the subsequent detailed parameters to create/update
            proxy details)
          example: '10002'
        proxyIp:
          type: string
          description: Proxy server IP address
          example: 192.168.1.100
        proxyPort:
          type: integer
          description: Proxy server port
          minimum: 1
          maximum: 65535
          example: 8080
        proxyName:
          type: string
          maxLength: 600
          description: Proxy configuration name/description
          example: test_proxy_01
        proxyProvider:
          type: integer
          description: Proxy type 0:http, 1:https, 2:socks5
          example: 2
        username:
          type: string
          maxLength: 200
          description: Proxy authentication username
          example: admin
        password:
          type: string
          maxLength: 100
          description: Proxy authentication password
          example: pwd123
        refreshUrl:
          type: string
          description: API URL to refresh dynamic proxy IP
          example: http://api.proxy.com/refresh
        country:
          type: string
          description: Country code of the proxy location (e.g. CN, US)
          example: US
        state:
          type: string
          description: State/Province of the proxy location
          example: California
        city:
          type: string
          description: City of the proxy location
          example: Los Angeles
    CloudPhoneEnableRootApiDTO:
      type: object
      required:
        - id
        - enableRoot
      properties:
        id:
          type: string
          description: Cloud Phone ID
          example: '1558968155668507'
        enableRoot:
          type: boolean
          description: Whether to enable global system-level ROOT permission
          example: true
    CloudPhoneProfile:
      type: object
      properties:
        abnormalStatus:
          type: integer
          description: >-
            Abnormal status 0-No abnormality 1-Unactivated 2-Out-of-contract
            3-Oversold 4-Deactivated
        adbInfo:
          description: ADB connection information
          $ref: '#/components/schemas/AdbInfo'
        billingType:
          type: integer
          description: 'Billing type: 1 = Pay-per-minute (On-demand), 2 = Monthly'
        createDate:
          description: Creation time
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
        createMember:
          description: Creator member ID
          type: integer
        createMemberName:
          description: Creator member name
          type: string
        enableAdb:
          description: Whether to enable ADB
          type: boolean
        envName:
          type: string
          description: Cloud Phone Name
        envRemark:
          type: string
          description: Profile Remarks
        envStatus:
          type: integer
          description: |
            Profile Status:
            - 0: New
            - 1: Creation failed
            - 2: Powered off
            - 3: Booting
            - 4: Powered on
            - 5: Resetting
            - 6: Restarting
            - 7: One-click new machine in progress
        expireTime:
          type: string
          description: expiration time
        groupId:
          description: Group ID
          type: string
        groupName:
          description: Group name. Null when the cloud phone is ungrouped
          type:
            - string
            - 'null'
        id:
          description: Cloud phone ID
          type: string
        androidId:
          type: string
          description: cloud phone android id
        gaid:
          type: string
          description: cloud phone gaid
        lastConnectDate:
          description: Last connection time
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
        lastConnectMemberId:
          description: Last connected member ID
          type: string
        lastConnectMemberName:
          description: Last connected member name
          type: string
        lastStartDate:
          description: Last boot time
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
        lastStartMemberId:
          description: Last boot member ID
          type: string
        lastStartMemberName:
          description: Last boot member name
          type: string
        proxy:
          description: Proxy settings
          $ref: '#/components/schemas/ProxyInfo'
        proxyStatus:
          type: integer
          description: >-
            Proxy Status:0-Not Detected 1-Detecting 2-Detecting Failed
            3-Detecting Successful
        supportAdb:
          description: 'Whether ADB is supported: 0 = no, 1 = yes'
          type: boolean
        tagInfos:
          description: Tag details. Empty array when no tags are assigned
          type: array
          items:
            type: object
            properties:
              id:
                description: Tag ID
                type: string
              tagName:
                description: Tag name
                type: string
            required:
              - id
              - tagName
        updateDate:
          description: Update time
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
        updateMember:
          description: Updater member ID
          type: integer
    AdbInfo:
      type: object
      description: >-
        ADB info is only available when the phone is powered on (envStatus >=
        4); it cannot be queried when powered off or booting
      properties:
        adbIp:
          type: string
          description: adb ip
        adbPassword:
          type: string
          description: adb connection password
        adbPort:
          type: string
          description: adb port
        command:
          type:
            - string
            - 'null'
          description: ADB SSH tunnel connection command
        expireTime:
          type:
            - string
            - 'null'
          description: ADB connection expiration time
        remark:
          type: string
          description: Failure Remarks Information
        success:
          type: integer
          description: Successful acquisition 1=Yes 0=No
      required:
        - adbIp
        - adbPassword
        - adbPort
        - remark
        - success
    ProxyInfo:
      type: object
      properties:
        country:
          description: Country
          type: string
        countryCode:
          description: Country code
          type: string
        createDate:
          description: Creation time
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
        delFlag:
          type: integer
          description: 1 - deleted 2 - not deleted
        expiryTime:
          description: Expiration time
          type: string
        exportIp:
          description: Outgoing IP address
          type: string
        groupId:
          description: Group ID
          type: string
        id:
          description: ID
          type: string
        providerCode:
          description: Device type code
          type: string
        proxyAreaCode:
          description: Proxy location area code
          type: string
        proxyCatagoryType:
          type: integer
          description: >-
            Proxy type:0:site group 1:cloud platform 2:own IP 3:vps 4:virtual
            machine
        proxyCheckStatus:
          type: integer
          description: >-
            Detection status:0:pending detection 1:successful detection
            2:detection failure 3:unknown error
        proxyInfo:
          description: Proxy details string
          type: string
        state:
          type:
            - string
            - 'null'
          description: >-
            Proxy state or province. Uses detected exit-IP location when
            available, otherwise the configured location; may be null or empty.
          example: California
        city:
          type:
            - string
            - 'null'
          description: >-
            Proxy city. Uses detected exit-IP location when available, otherwise
            the configured location; may be null or empty.
          example: Los Angeles
        proxyIp:
          description: Proxy server IP address
          type: string
        proxyName:
          description: Proxy configuration name
          type: string
        proxyPort:
          type:
            - integer
            - 'null'
          format: int32
          description: >-
            Proxy connection port, not a port inferred from the proxy name. May
            be null when unavailable.
          example: 1080
        proxyRegionCode:
          description: Proxy location region code
          type: string
        proxyStatus:
          type: integer
          description: 0-Normal 1-Pending allocation 2-Upgrading 3-Expired
        proxySub:
          description: Proxy subscription information
          $ref: '#/components/schemas/ProxySubscription'
        proxyType:
          type: integer
          description: >-
            Proxy type：0-http 1-https 2-socks5 4-Oxylabs 5-Proxys.io 6-GeoSurf
            9-Oxylabsauto 10-Trogan 11-Shadowsocks 12-vmess
        proxyTypeCode:
          description: Proxy protocol type code
          type: string
        regionKey:
          description: Cloud platform region key
          type: string
        releaseTime:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
          description: Release time:deletion time if deleted, expiration time if expired
        uniqueId:
          description: Display sort sequence ID
          type: integer
      required:
        - country
        - countryCode
        - createDate
        - delFlag
        - expiryTime
        - exportIp
        - groupId
        - id
        - providerCode
        - proxyAreaCode
        - proxyCatagoryType
        - proxyCheckStatus
        - proxyInfo
        - proxyIp
        - proxyName
        - proxyPort
        - proxyRegionCode
        - proxyStatus
        - proxySub
        - proxyType
        - proxyTypeCode
        - regionKey
        - releaseTime
        - uniqueId
    ProxySubscription:
      type: object
      properties:
        activeRecordId:
          description: Active subscription record ID
          type: string
        businessId:
          description: Proxy service business ID
          type: string
        createMember:
          description: Creator member ID
          type: integer
        endTime:
          description: End time
          type: string
        id:
          description: Subscription ID
          type: string
        nextBillingTime:
          description: Next billing/payment time
          type: string
        startTime:
          description: Start time of validity
          type: string
        subPayMethod:
          description: Subscription payment method
          type: string
        subStatus:
          type: integer
          description: Subscription Status:0-Pending 1-Subscribed 2-Cancelled
        subType:
          type: integer
          description: Subscription Type:1-Agent 2-Package
        teamId:
          description: Team ID
          type: string
      required:
        - activeRecordId
        - businessId
        - createMember
        - endTime
        - id
        - nextBillingTime
        - startTime
        - subPayMethod
        - subStatus
        - subType
        - teamId
    CloudPhoneDetail:
      type: object
      properties:
        id:
          type: string
          description: cloud phone id
        androidId:
          type: string
          description: cloud phone android id
        gaid:
          type: string
          description: cloud phone gaid
        envName:
          type: string
          description: cloud phone name
        groupId:
          description: Group ID
          type: string
        groupName:
          description: Group name. Null when the cloud phone is ungrouped
          type:
            - string
            - 'null'
        skuId:
          description: Product SKU ID
          type: string
        tagInfos:
          description: Tag details. Empty array when no tags are assigned
          type: array
          items:
            type: object
            properties:
              id:
                description: Tag ID
                type: string
              tagName:
                description: Tag name
                type: string
            required:
              - id
              - tagName
        billingType:
          description: 'Billing type: 1 = Pay-per-minute (On-demand), 2 = Monthly'
          type: integer
        proxyStatus:
          description: >-
            Proxy status: 0 = not detected, 1 = detecting, 2 = detection failed,
            3 = detection successful
          type: integer
        settings:
          description: Advanced fingerprint settings
          type: object
          properties:
            automaticGeo:
              type: boolean
            automaticLocation:
              type: boolean
            automaticLanguage:
              type: boolean
            longitude:
              type:
                - number
                - 'null'
            latitude:
              type:
                - number
                - 'null'
          required:
            - automaticGeo
            - automaticLocation
            - automaticLanguage
            - longitude
            - latitude
        device:
          description: Device hardware information
          type: object
          properties:
            server:
              type:
                - string
                - 'null'
            countryName:
              type: string
            rom:
              type: integer
            wifiBssid:
              type:
                - string
                - 'null'
            bluetoothMac:
              type: string
          required:
            - server
            - countryName
            - rom
            - wifiBssid
            - bluetoothMac
        proxy:
          description: Proxy settings
          type: object
          properties:
            id:
              type: string
            proxyName:
              type: string
            state:
              type:
                - string
                - 'null'
              description: >-
                Proxy state or province. Uses detected exit-IP location when
                available, otherwise the configured location; may be null or
                empty.
              example: California
            city:
              type:
                - string
                - 'null'
              description: >-
                Proxy city. Uses detected exit-IP location when available,
                otherwise the configured location; may be null or empty.
              example: Los Angeles
            proxyPort:
              type:
                - integer
                - 'null'
              format: int32
              description: >-
                Proxy connection port, not a port inferred from the proxy name.
                May be null when unavailable.
              example: 1080
            proxyIp:
              type: string
          required:
            - id
            - proxyName
            - proxyIp
        lastStartMemberId:
          description: Last boot member ID
          type: string
        lastStartMemberName:
          description: Last boot member name
          type:
            - string
            - 'null'
        lastStartDate:
          description: Last boot time
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
        lastConnectMemberId:
          description: Last connected member ID
          type: string
        lastConnectMemberName:
          description: Last connected member name
          type:
            - string
            - 'null'
        lastConnectDate:
          description: Last connection time
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
        envStatus:
          description: >-
            Environment status: 0 = new, 1 = creation failed, 2 = powered off, 3
            = booting, 4 = powered on, 5 = resetting, 6 = restarting, 7 =
            one-click new machine in progress
          type: integer
        abnormalStatus:
          description: >-
            Abnormal status: 0 = normal, 1 = unactivated, 2 = arrears, 3 =
            oversold, 4 = deactivated
          type: integer
        expireTime:
          description: Expiration time
          type: string
        envRemark:
          description: Environment remark
          type: string
        createMember:
          description: Creator member ID
          type: string
        updateMember:
          description: Updater member ID
          type: string
        updateDate:
          description: Update time
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
        createDate:
          description: Creation time
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
        createMemberName:
          description: Creator member name
          type:
            - string
            - 'null'
      required:
        - id
        - envName
        - groupId
        - skuId
        - tagInfos
        - billingType
        - proxyStatus
        - settings
        - device
        - proxy
        - lastStartMemberId
        - lastStartMemberName
        - lastStartDate
        - lastConnectMemberId
        - lastConnectMemberName
        - lastConnectDate
        - envStatus
        - abnormalStatus
        - expireTime
        - envRemark
        - createMember
        - updateMember
        - updateDate
        - createDate
        - createMemberName
    ExecutionDTO:
      type: object
      properties:
        id:
          type: string
          description: Execution record id
        taskName:
          type: string
          description: Schedule Task name
        taskState:
          type: integer
          description: >-
            Schedule status; 0:awaiting execution; 1:Executing; 2:Execution
            completed 3:Cancel
        cloudPhoneId:
          type: string
          description: Cloud phone ID
        cloudPhoneName:
          type: string
          description: Cloud phone name
        templateName:
          type: string
          description: Template title
        handleFailCode:
          type: string
          description: Task failure code
        handleFailReason:
          type: string
          description: Task failure reason
        handleResult:
          type: integer
          description: Task result. 0:failed; 1:succeeded
        handleResultAttachment:
          type: string
          description: Task execution result attachment
        handleTime:
          type: string
          description: Execution time
        endTime:
          type: string
          description: Task end time
        powerOnTime:
          type: string
          description: Cloud phone power-on time
        triggerNextTime:
          type: string
          description: Next scheduled trigger time
        triggerTime:
          type: string
          description: Scheduled trigger time
        createDate:
          type: string
          description: ' Creation time'
        createMember:
          type: string
          description: Creator
        updateDate:
          type: string
          description: Last update time
        updateMember:
          type: string
          description: Last updater
    ApiBatchAdbInfoDto:
      type: object
      required:
        - envIds
      properties:
        envIds:
          type: array
          description: List of environment IDs, maximum 200
          maxItems: 200
          minItems: 1
          items:
            type: string
          example:
            - '1674380838117474'
            - '1675787900043353'
    ApiBatchAdbInfoResultDto:
      type: object
      description: Batch ADB info query result
      properties:
        id:
          type: string
          description: Environment ID
        supportAdb:
          type: boolean
          description: Whether ADB is supported
        enableAdb:
          type: boolean
          description: Enable ADB 0 = Disabled, 1 = Enabled
        envStatus:
          type: integer
          description: |
            Environment status:
            - 0: New
            - 1: Creation failed
            - 2: Powered off
            - 3: Booting
            - 4: Powered on
            - 5: Resetting
            - 6: Restarting
            - 7: One-click new machine in progress
        adbIp:
          type:
            - string
            - 'null'
          description: ADB connection IP address
        adbPassword:
          type:
            - string
            - 'null'
          description: ADB connection password
        adbPort:
          type:
            - string
            - 'null'
          description: ADB connection port
        command:
          type:
            - string
            - 'null'
          description: ADB SSH tunnel connection command
        expireTime:
          type:
            - string
            - 'null'
          description: ADB connection expiration time
        remark:
          type:
            - string
            - 'null'
          description: >
            Remark info. When ADB info cannot be retrieved, the reason is
            provided:

            - Environment does not exist

            - Environment is not powered on, unable to query ADB info

            - This environment does not support ADB

            - Failed to retrieve ADB info
    ResponseDataListApiBatchAdbInfoResultDto:
      type: object
      properties:
        code:
          type: integer
          description: Response code, 0 indicates success
          example: 0
        msg:
          type:
            - string
            - 'null'
          description: Response message
          example: success
        data:
          type: array
          description: ADB info list, in the same order as the requested envIds
          items:
            $ref: '#/components/schemas/ApiBatchAdbInfoResultDto'
    TouchClickRequest:
      type: object
      required:
        - id
        - pos
      properties:
        id:
          type: string
          description: Cloud Phone ID
          example: '1558968155668507'
        pos:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
          description: >-
            Tap coordinates [x, y]. The coordinate system uses the top-left
            corner as origin (0, 0).
          example:
            - 540
            - 960
        duration:
          type: integer
          description: >-
            Press duration in milliseconds (used for long press). If omitted,
            the default duration is used.
          example: 2000
    TouchSwipeRequest:
      type: object
      required:
        - id
        - pos1
        - pos2
      properties:
        id:
          type: string
          description: Cloud Phone ID
          example: '1558968155668507'
        pos1:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
          description: Start coordinates [x, y]
          example:
            - 540
            - 1500
        pos2:
          type: array
          items:
            type: integer
          minItems: 2
          maxItems: 2
          description: End coordinates [x, y]
          example:
            - 540
            - 500
        duration:
          type: integer
          description: >-
            Swipe/drag duration in milliseconds. A larger value results in a
            slower action.
          example: 300
    TouchResultResponse:
      type: object
      properties:
        code:
          type: integer
          description: Status code, 0 means success
          example: 0
        msg:
          type:
            - string
            - 'null'
          description: Response message
          example: success
        data:
          type: object
          properties:
            status:
              type: string
              description: Execution status
              example: finish
    ResponseEnvelopeBase:
      type: object
      required:
        - code
        - msg
        - requestId
      properties:
        code:
          type: integer
          description: Business result code; `0` indicates success
          example: 0
        msg:
          type:
            - string
            - 'null'
          description: Error message; null when successful
          example: null
        requestId:
          type: string
          description: Request ID for troubleshooting
          example: 1d4f3ea968664593860b94b35d4ebf5e
    MonthlyCloudPhoneSkuPrice:
      type: object
      required:
        - price
        - period
        - periodUnit
      properties:
        price:
          type: integer
          minimum: 0
          description: Configured price in US cents
        period:
          type: integer
          description: Billing-period count returned by the product service
        periodUnit:
          type: string
          description: Localized billing-period unit returned by the product service
        priceDesc:
          type:
            - string
            - 'null'
          description: Localized display price, when configured
    MonthlyCloudPhoneSku:
      type: object
      required:
        - skuId
        - skuName
        - prices
      properties:
        skuId:
          type: string
          description: Monthly Cloud Phone product ID
        skuName:
          type: string
          description: Product name returned in the product-service language
        cloudPhoneAndroidVersion:
          type:
            - string
            - 'null'
          description: Android version, or null when the product has no configured value
        cloudPhoneStorage:
          type:
            - integer
            - 'null'
          description: >-
            Storage capacity in GB, or null when the product has no configured
            value
        prices:
          type: array
          minItems: 1
          description: Active monthly price configurations
          items:
            $ref: '#/components/schemas/MonthlyCloudPhoneSkuPrice'
    MonthlyCloudPhoneActivateRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: >-
            One to ten distinct positive Cloud Phone IDs, encoded as strings to
            preserve 64-bit precision
          items:
            type: string
            pattern: ^[1-9][0-9]*$
    MonthlyCloudPhoneActivationResult:
      type: object
      required:
        - id
        - status
      properties:
        id:
          type: string
          description: Cloud Phone ID
        status:
          type: string
          enum:
            - ACTIVATED
            - FAILED
            - UNKNOWN
          description: Activation result
        expireTime:
          type:
            - string
            - 'null'
          pattern: ^[0-9]+$
          description: Unix time in milliseconds; present for a successful activation
        errorCode:
          type:
            - integer
            - 'null'
          description: Business error code for a failed item
    MonthlyCloudPhoneActivationData:
      type: object
      required:
        - orderId
        - orderStatus
        - results
      properties:
        orderId:
          type: string
          description: Paid balance-order ID
        orderStatus:
          type: integer
          enum:
            - 1
          description: Order status; 1 means completed
        results:
          type: array
          description: One result per requested ID, in request order
          items:
            $ref: '#/components/schemas/MonthlyCloudPhoneActivationResult'
    CloudPhoneLiveStartRequest:
      type: object
      required:
        - phoneId
        - fileId
      properties:
        phoneId:
          type: string
          description: Cloud phone ID
          example: '190000000000000001'
        fileId:
          type: string
          description: ID of an uploaded MP4 live-streaming file (`uploadType=2`)
          example: '820000000000000001'
    CloudPhoneLivePhoneRequest:
      type: object
      required:
        - phoneId
      properties:
        phoneId:
          type: string
          description: Cloud phone ID
          example: '190000000000000001'
  securitySchemes: {}
  responses:
    BalanceResponse:
      description: Request processed; inspect `code` for the business result
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ResponseEnvelopeBase'
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - balance
                      - remainingDuration
                      - remainingConcurrency
                    properties:
                      balance:
                        type: integer
                        format: int32
                        description: Available wallet balance in cents
                      remainingDuration:
                        type: string
                        pattern: ^[0-9]+$
                        description: >-
                          Remaining cloud phone duration in minutes, serialized
                          as a numeric string
                      remainingConcurrency:
                        type: integer
                        minimum: 0
                        description: Remaining team-level cloud phone concurrency
          example:
            code: 0
            msg: null
            data:
              balance: 12500
              remainingDuration: '120'
              remainingConcurrency: 3
            requestId: 1d4f3ea968664593860b94b35d4ebf5e
    MonthlyCloudPhoneSkusResponse:
      description: >-
        Request processed; `data` is an empty array when no monthly product is
        available
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ResponseEnvelopeBase'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MonthlyCloudPhoneSku'
          example:
            code: 0
            msg: null
            data:
              - skuId: '10015'
                skuName: Android 14
                cloudPhoneAndroidVersion: Android 14
                cloudPhoneStorage: 64
                prices:
                  - price: 2500
                    period: 30
                    periodUnit: days
                    priceDesc: $25/30 days
            requestId: 36d574df5b9e41b5b3c796133ff5a079
    MonthlyCloudPhoneActivateResponse:
      description: >-
        Request processed; inspect `code`, and inspect `data.results` when
        returned
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ResponseEnvelopeBase'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MonthlyCloudPhoneActivationData'
          example:
            code: 0
            msg: null
            data:
              orderId: '1724032801202461'
              orderStatus: 1
              results:
                - id: '1724032706822188'
                  status: ACTIVATED
                  expireTime: '1791103955843'
                  errorCode: null
            requestId: db5e04c2eb804cdfb96b1469c7379bbc
    CloudPhoneLiveBooleanResponse:
      description: Request processed; inspect `code` for the business result
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ResponseEnvelopeBase'
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: boolean
                    description: Whether the live-streaming operation succeeded
          example:
            code: 0
            msg: null
            data: true
            requestId: 1d4f3ea968664593860b94b35d4ebf5e
    CloudPhoneLiveStatusResponse:
      description: Request processed; inspect `code` for the business result
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ResponseEnvelopeBase'
              - type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      liveStatus:
                        type: integer
                        enum:
                          - 0
                          - 1
                        description: Live status (`0` = stopped, `1` = running)
                      writeFileId:
                        type:
                          - string
                          - 'null'
                        description: Current file ID, when available
                      liveFilePath:
                        type:
                          - string
                          - 'null'
                        description: Current file path or URL, when available
          example:
            code: 0
            msg: null
            data:
              liveStatus: 1
              writeFileId: '820000000000000001'
              liveFilePath: null
            requestId: 1d4f3ea968664593860b94b35d4ebf5e
servers:
  - url: http://127.0.0.1:40000
    description: MoreLogin  Local endpoint
security: []
