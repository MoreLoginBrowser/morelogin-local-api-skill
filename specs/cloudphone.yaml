openapi: 3.1.0
info:
  title: Cloud Phone Local API
  description: |
    Manage cloud phone instances through the MoreLogin Local API.

    **Base URL**: `http://127.0.0.1:40000`

    The Local API runs on your machine alongside the MoreLogin desktop app.
    All requests must originate from the same machine.
  version: '2026-09-05'
tags:
  - name: Cloud Phone Management
    description: APIs for Cloud Phone Management.
  - name: Live Streaming
    description: Start, inspect, and stop Cloud Phone live streaming.
  - name: Account & Quotas
    description: Query wallet balance and Cloud Phone usage quotas.
  - name: ADB
    description: APIs for ADB.
  - name: Files
    description: APIs for Files.
  - name: Apps
    description: APIs for Apps.
  - name: Schedules
    description: APIs for Schedules.
  - name: Touch
    description: APIs for Touch.
  - name: Monthly Billing
    description: Query purchasable monthly plans and activate monthly Cloud Phones.
x-tagGroups:
  - name: ''
    tags:
      - Cloud Phone Management
      - Live Streaming
      - Account & Quotas
      - ADB
      - Files
      - Apps
      - Schedules
      - Touch
      - Monthly Billing
paths:
  /api/balance:
    get:
      operationId: getAccountAndCloudPhoneQuotasLocal
      summary: Get Account Balance and Cloud Phone Quotas
      description: >-
        Return the team's wallet balance and Cloud Phone usage allowances.


        - **Preconditions**: the calling member needs the cost permission. The
        wallet is looked up by team, so the figures are team-wide rather than
        per member.

        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Units**: `balance` is the wallet balance **in cents**, not in
        currency units. `remainingDuration` is Cloud Phone minutes and
        `remainingConcurrency` a slot count; both are clamped at 0 rather than
        going negative.

        - **Contents**: exactly these three figures. Frozen wallet amounts,
        used-versus-granted minute splits and expiry dates exist upstream but
        are deliberately not exposed here.

        - **Note**: the call fails as a whole if either the wallet or the quota
        lookup fails; it never returns partial figures.
      tags:
        - Account & Quotas
      responses:
        '200':
          $ref: '#/components/responses/BalanceResponse'
  /api/cloudphone/monthly/skus:
    get:
      operationId: listMonthlyCloudPhoneSkus
      summary: List Purchasable Monthly Cloud Phone Plans
      description: >-
        Return the monthly Cloud Phone products currently available to the
        calling team.


        - **Effect**: none. The call does not reserve capacity or charge the
        wallet. Read-only. Safe to retry with bounded backoff.

        - **Use**: pass the returned `skuId` to
        [`/api/cloudphone/create`](./local-api.yaml#operation/createUsingPOST).
        The price is in US cents and the current monthly term is 30 days.

        - **Empty result**: an empty `data` array means no monthly product is
        currently available.


        See [Error Codes](../Getting%20Started/error-codes.md) for common
        business errors.

        - **Client version**: requires MoreLogin desktop client v2.65.0 or
        later; older clients do not expose this Local API route.
      tags:
        - Monthly Billing
      responses:
        '200':
          $ref: '#/components/responses/MonthlyCloudPhoneSkusResponse'
  /api/cloudphone/monthly/activate:
    post:
      operationId: activateMonthlyCloudPhones
      summary: Purchase and Activate Monthly Cloud Phones
      description: >-
        Purchase and activate one to ten monthly Cloud Phones for 30 days.


        - **Billing warning**: **this operation charges the team wallet.**

        - **Permission**: the calling member must have **Fees / Payment
        Management** permission; otherwise the request returns `99012`.

        - **Create first**: create the phones with
        [`/api/cloudphone/create`](./local-api.yaml#operation/createUsingPOST).
        Creation only provisions inactive records and does not charge.

        - **Selection rules**: IDs must be distinct, belong to the team, use
        active 30-day monthly products and have compatible purchase states.
        Different monthly SKUs may be purchased together. Mixing paid and unpaid
        phones, phones from different paid orders, pending client orders or
        concurrent purchases rejects the entire request.

        - **Charging and restoration**: validation and charging are
        all-or-nothing, so there is no partial charge. If every phone belongs to
        the same paid order, the server restores the existing paid entitlement
        and does not charge again. The Local API, Open API and desktop client
        share the same order state.

        - **Completion**: success means every phone was confirmed active for 30
        days. It does not power the phones on and does not enable automatic
        renewal.

        - **Unconfirmed activation**: when the service returns `33422`,
        `data.results` is still complete and preserves request order. Inspect
        each `status`, `expireTime` and `errorCode`; do not treat the whole
        result as missing.

        - **Retry**: there is no caller-supplied idempotency key. After a
        timeout, query
        [`/api/cloudphone/info`](./local-api.yaml#operation/infoUsingPOST) or
        [`/api/cloudphone/page`](./local-api.yaml#operation/pageUsingPOST) and
        inspect billing and expiry state before deciding whether to retry.

        - **Client version**: requires MoreLogin desktop client v2.65.0 or
        later; older clients do not expose this Local API route.


        Documented business errors: `20002`, `20003`, `20004`, `20008`, `20041`,
        `20055`, `20068`, `20070`, `20071`, `33420`, `33421`, `33422`, `99001`,
        `99002`, `99012`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the
        common codes.

        - **Client version**: requires MoreLogin desktop client v2.65.0 or
        later; older clients do not expose this Local API route.
      tags:
        - Monthly Billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonthlyCloudPhoneActivateRequest'
            example:
              ids:
                - '1724032706822188'
                - '1724032729890861'
      responses:
        '200':
          $ref: '#/components/responses/MonthlyCloudPhoneActivateResponse'
  /api/cloudphone/live/start:
    post:
      operationId: startCloudPhoneLiveStreamingLocal
      summary: Start Live Streaming
      description: >-
        Start live streaming an uploaded MP4 on a Cloud Phone.


        - **Preconditions**: the phone must be powered on and not held by
        another member, and the device must support live streaming. The `fileId`
        must refer to a file uploaded as live-stream media that finished
        uploading; anything else is rejected as invalid or expired.

        - **Completion**: **accepted, not complete.** The response only confirms
        the service took the request. Poll `/cloudphone/live/status` until
        `liveStatus` is `1`.

        - **Note**: the MP4-only restriction is enforced when you upload the
        file, not here.

        - **Retry**: no deduplication; a repeat call re-issues the start
        command.


        Documented business errors: `33300`, `33301`, `33401`, `33418`. See
        [Error Codes](../Getting%20Started/error-codes.md) for what each code
        means. Any operation can additionally return the common codes.
      tags:
        - Live Streaming
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudPhoneLiveStartRequest'
            example:
              phoneId: '190000000000000001'
              fileId: '820000000000000001'
      responses:
        '200':
          $ref: '#/components/responses/CloudPhoneLiveBooleanResponse'
  /api/cloudphone/live/status:
    post:
      operationId: getCloudPhoneLiveStreamingStatusLocal
      summary: Get Live Streaming Status
      description: >-
        Report whether a Cloud Phone is currently live streaming.


        - **Preconditions**: the phone must belong to your team and the device
        must support live streaming. Unlike start and stop, this does **not**
        require the phone to be powered on or claimed by you.

        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Values**: `liveStatus` is `0` (not streaming) or `1` (streaming).
        **There is no failure state** — a start that never took effect simply
        stays at `0`, so bound your polling with a timeout.


        Documented business errors: `33300`, `33401`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      tags:
        - Live Streaming
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudPhoneLivePhoneRequest'
            example:
              phoneId: '190000000000000001'
      responses:
        '200':
          $ref: '#/components/responses/CloudPhoneLiveStatusResponse'
  /api/cloudphone/live/end:
    post:
      operationId: stopCloudPhoneLiveStreamingLocal
      summary: Stop Live Streaming
      description: >-
        Stop live streaming on a Cloud Phone.


        - **Preconditions**: the phone must be powered on and not held by
        another member, and the device must support live streaming. **Whether a
        stream is actually running is not checked** — the stop command is sent
        regardless.

        - **Completion**: accepted, not complete. Poll `/cloudphone/live/status`
        until `liveStatus` is `0`.

        - **Retry**: idempotent in effect; a repeat call simply re-sends the
        stop command.


        Documented business errors: `33300`, `33301`, `33401`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      tags:
        - Live Streaming
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudPhoneLivePhoneRequest'
            example:
              phoneId: '190000000000000001'
      responses:
        '200':
          $ref: '#/components/responses/CloudPhoneLiveBooleanResponse'
  /api/cloudphone/uploadFile:
    post:
      summary: Upload File (Multipart)
      deprecated: false
      description: >-
        Upload a local file straight to a Cloud Phone (legacy multipart flow).


        - **Preconditions**: the phone must be powered on and not held by
        another member. The upload code obtained from the signed-URL step is
        single-use.

        - **Completion**: the response only confirms the Local API accepted the
        transfer. **No task id and no polling state are exposed**, so progress
        cannot be observed.

        - **Use instead**: `/api/cloudphone/upload/file/signedUrl` → `PUT` →
        `/api/cloudphone/upload/file` → `/api/cloudphone/upload/file/result`
        when you need observable progress and retry handling.

        - **Note**: this path is not the same operation as
        `/cloudphone/uploadFile` on the Open API, which registers an
        already-uploaded object.


        Documented business errors: `33401`, `33419`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      operationId: fileUploadUsing
      tags:
        - Files
      parameters: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - id
                - file
                - uploadDest
              properties:
                id:
                  description: Cloud phone ID
                  type: string
                  examples:
                    - '1661515884160372'
                  example: '1661515884160372'
                file:
                  format: binary
                  type: string
                  description: File to upload
                  examples:
                    - file://D:\application\apifox\LICENSE.electron.txt
                  example: file://D:\application\apifox\LICENSE.electron.txt
                uploadDest:
                  description: Upload destination directory
                  type: string
                  examples:
                    - /Download
                  example: /Download
            example:
              id: '1661515884160372'
              file: file://D:\application\apifox\LICENSE.electron.txt
              uploadDest: /Download
      responses:
        '200':
          description: >-
            The Local API accepted the direct upload and returns an empty JSON
            object.
          content:
            application/json:
              schema:
                type: object
                maxProperties: 0
                properties: {}
              example: {}
      security: []
  /api/cloudphone/upload/file/signedUrl:
    post:
      operationId: getCloudPhoneUploadSignedUrlLocal
      summary: Request Temporary Upload URL
      deprecated: false
      description: >-
        Request a pre-signed URL for uploading a file that a Cloud Phone will
        receive.


        - **Preconditions**: the phone must be powered on and not held by
        another member.

        - **Completion**: synchronous. **The pre-signed URL is valid for one
        hour.** `PUT` the file content to it, then register the upload with
        `/api/cloudphone/upload/file`.

        - **Note**: temporary objects are removed automatically after 7 days.

        - **Surface note**: this is the same implementation as
        `/cloudphone/uploadUrl` on the Open API.
      tags:
        - Files
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Cloud phone ID
                fileName:
                  type: string
                  description: File name
              required:
                - fileName
                - id
            example:
              fileName: icon.png
              id: '1666625111121936'
        required: true
      responses:
        '200':
          description: Success. `data` is an object with the fields `presignedUrl`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - 'null'
                  data:
                    type: object
                    properties:
                      presignedUrl:
                        type: string
                        description: >-
                          Upload file url.Please use HTTP PUT request for file
                          upload
                    required:
                      - presignedUrl
                  requestId:
                    type: string
                required:
                  - code
                  - msg
                  - data
                  - requestId
                description: Response code, 0 indicates success,>0 indicates failure
              example:
                code: 0
                msg: null
                data:
                  presignedUrl: >-
                    https://example-bucket.s3.amazonaws.com/prod/cloudPhoneOpenApi/1666625111121936/20260901/demo.mp4?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=3600&X-Amz-Signature=EXAMPLE
                requestId: d0b850e2c3d54279b524e9540a358e0a
          headers: {}
      security: []
  /api/cloudphone/upload/file:
    post:
      operationId: uploadCloudPhoneFileByUrlLocal
      summary: Upload File via URL
      deprecated: false
      description: >-
        Register an uploaded file so the Cloud Phone downloads it.


        - **Preconditions**: the phone must be powered on and not held by
        another member, and **the object must already exist at the URL**.
        Live-stream uploads must be MP4 and target a device that supports
        streaming.

        - **Completion**: **accepted, not complete.** The response returns
        `fileId` with an in-progress status; poll
        `/api/cloudphone/upload/file/result`.

        - **Surface note**: this is the same implementation as
        `/cloudphone/uploadFile` on the Open API. Do not confuse it with the
        older `/api/cloudphone/uploadFile` multipart flow on this surface.


        Documented business errors: `33401`, `33419`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      tags:
        - Files
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Cloud phone ID
                url:
                  type: string
                  description: >-
                    Upload url, which can be the link returned by the
                    cloudphone/upload/file/signedURL interface or other publicly
                    accessible file download address
                uploadDest:
                  type: string
                  description: Storage directory
                uploadType:
                  type: integer
                  enum:
                    - 1
                    - 2
                  default: 1
                  description: File type (1 = regular file, 2 = MP4 live-streaming file)
              required:
                - url
                - id
                - uploadDest
            example:
              url: >-
                https://example-bucket.s3.amazonaws.com/prod/cloudPhoneOpenApi/1666625111121936/20260901/demo.mp4
              id: '1666625111121936'
              uploadDest: /Download
              uploadType: 2
        required: true
      responses:
        '200':
          description: >-
            Success. `data` is an object with the fields `id`, `fileId` and
            `status`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response code, 0 indicates success,>0 indicates failure
                  msg:
                    type:
                      - string
                      - 'null'
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Cloud phone id
                      fileId:
                        type: string
                        description: Upload file id
                      status:
                        type: integer
                        description: >-
                          Upload status;0:uploading in progress, 1:upload
                          successful, 2:upload failed
                    required:
                      - id
                      - fileId
                      - status
                  requestId:
                    type: string
                required:
                  - code
                  - msg
                  - data
                  - requestId
              example:
                code: 0
                msg: null
                data:
                  id: '1666625111121936'
                  fileId: '10069435'
                  status: 0
                requestId: e5d69c5e2d364106a0715dab1d9a03d3
          headers: {}
      security: []
  /api/cloudphone/upload/file/result:
    post:
      operationId: getCloudPhoneUploadResultLocal
      summary: Get File Upload Status
      deprecated: false
      description: >-
        Poll the status of a file upload to a Cloud Phone.


        - **Values**: `0` uploading, `1` succeeded, `2` failed.

        - **Empty result**: when the `fileId` cannot be found the call still
        succeeds but `data` is null. Treat that as “not visible yet or no longer
        present”, not as a failure.

        - **Cost**: the lookup scans the device file list; poll at a modest
        interval.

        - **Surface note**: same implementation as
        `/cloudphone/uploadFileResult` on the Open API.
      tags:
        - Files
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                fileId:
                  type: string
              required:
                - id
                - fileId
            example:
              id: '1666625111121936'
              fileId: '10069434'
        required: true
      responses:
        '200':
          description: >-
            Success. `data` is an object with the fields `id`, `fileId` and
            `status`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response code, 0 indicates success,>0 indicates failure
                  msg:
                    type:
                      - string
                      - 'null'
                  data:
                    type:
                      - object
                      - 'null'
                    properties:
                      id:
                        type: string
                        description: Cloud phone id
                      fileId:
                        type: string
                        description: Upload file id
                      status:
                        type: integer
                        description: >-
                          Upload file status;0:uploading in progress, 1:upload
                          successful, 2:upload failed
                    required:
                      - id
                      - fileId
                      - status
                  requestId:
                    type: string
                required:
                  - code
                  - msg
                  - data
                  - requestId
              example:
                code: 0
                msg: null
                data:
                  id: '1666625111121936'
                  fileId: '10069435'
                  status: 0
                requestId: e5d69c5e2d364106a0715dab1d9a03d3
          headers: {}
      security: []
  /api/cloudphone/download:
    post:
      operationId: downloadCloudPhoneFileLocal
      summary: Request File Download
      deprecated: false
      description: >-
        Download a file from a Cloud Phone.


        - **Preconditions**: the phone must be powered on and not held by
        another member.

        - **Effect**: the service scans the parent directory first and only then
        starts the transfer, so a missing path fails **here** rather than on the
        status poll. It must match a regular file, not a directory.

        - **Completion**: **accepted, not complete.** The response returns
        `downId`; poll `/cloudphone/download/result` until the status is
        succeeded, failed or cancelled. The status endpoint re-checks that the
        phone is still powered on and still yours.

        - **Retry**: not idempotent — each call rescans and issues a new
        `downId`.


        Documented business errors: `33300`, `33301`, `33507`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      tags:
        - Files
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Cloud phone ID
                filePath:
                  type: string
                  description: |
                    file path: /sdcard/Download/a.txt
              required:
                - filePath
                - id
            example:
              filePath: /sdcard/Download/report.csv
              id: '1661515884160372'
        required: true
      responses:
        '200':
          description: Success. `data` is an object with the fields `id` and `downId`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response code, 0 indicates success,>0 indicates failure
                  msg:
                    type:
                      - string
                      - 'null'
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: Cloud phone id
                      downId:
                        type: string
                        description: 'File download id '
                    required:
                      - id
                      - downId
                  requestId:
                    type: string
                required:
                  - code
                  - msg
                  - data
                  - requestId
              example:
                code: 0
                msg: ''
                data:
                  id: '1661515884160372'
                  downId: '1661515884160999'
                requestId: 7dcf166a597842139af5ce12d25fe0f8
          headers: {}
      security: []
  /api/cloudphone/download/result:
    post:
      operationId: getCloudPhoneDownloadResultLocal
      summary: Get File Download Status
      deprecated: false
      description: >-
        Poll the status of a file download from a Cloud Phone.


        - **Preconditions**: the phone must be powered on and not held by
        another member. Pass the `downId` returned by the download request.

        - **Values**: **a different scale from uploads** — `10` running, `20`
        succeeded, `30` failed, `40` cancelled. `downUrl` is only populated once
        the download has succeeded.

        - **Note**: “file does not exist” is reported by the download request
        itself, which scans the parent directory first, not by this endpoint.
      tags:
        - Files
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Cloud phone ID
                downId:
                  type: string
                  description: File download ID
              required:
                - downId
                - id
            example:
              downId: '1661515884160999'
              id: '1661515884160372'
        required: true
      responses:
        '200':
          description: >-
            Success. `data` is an object with the fields `status`, `downId` and
            `downUrl`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Response code, 0 indicates success,>0 indicates failure
                  msg:
                    type:
                      - string
                      - 'null'
                  data:
                    type: object
                    properties:
                      status:
                        type: integer
                        description: >-
                          Download file status;10:Running, 20:Successful,
                          30:Failed, 40:Cancelled
                      downUrl:
                        type: string
                        description: File download URL; use it only when status is 20
                      downId:
                        type: string
                        description: File download task ID
                    required:
                      - status
                      - downId
                  requestId:
                    type: string
                required:
                  - code
                  - msg
                  - data
                  - requestId
              example:
                code: 0
                msg: null
                data:
                  status: 20
                  downId: '1661515884160999'
                  downUrl: https://get.morelogin.com/...
                requestId: 17d9dbfd958e4f40a51897520138d3ff
          headers: {}
      security: []
  /api/cloudphone/setKeyBox:
    post:
      operationId: setCloudPhoneKeyBoxLocal
      summary: Configure Keybox
      deprecated: false
      description: >-
        Install a keybox certificate on a Cloud Phone.


        - **Preconditions**: `filePath` must point to an `.xml` file, and the
        phone must be powered on and not held by another member.

        - **Effect**: hands the certificate path to the device service.
        MoreLogin stores nothing, and the service defines no activation step —
        whether the device needs a restart for the certificate to take effect is
        device-specific behaviour.

        - **Completion**: synchronous acceptance by the service. There is no
        endpoint that reports the installed certificate.
      tags:
        - Files
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                filePath:
                  type: string
                  description: File path, e.g., /sdcard/Download/xxx.xml
                id:
                  type: string
                  description: Cloud phone ID
            example:
              filePath: ''
              id: '0'
      responses:
        '200':
          description: Success. `data` is a single boolean value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 'Response code: 0 = success, >0 = error'
                  msg:
                    type:
                      - string
                      - 'null'
                  data:
                    type: boolean
                  requestId:
                    type: string
                    description: >-
                      Unique request identifier; include it when contacting
                      support
              example:
                code: 0
                msg: null
                data: true
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
          headers: {}
      security: []
  /api/cloudphone/app/install:
    post:
      operationId: installCloudPhoneAppLocal
      summary: Install app on cloud phone
      deprecated: false
      description: >-
        Install an app from the team app library onto a Cloud Phone.


        - **Preconditions**: the phone must be powered on and not held by
        another member. The app must already exist in the team library or the
        public catalogue — identify it either by `appVersionId`, or by
        `packageName` plus `versionCode`. The app must also be available for
        installation on this phone, otherwise installation fails.

        - **Rate limit**: at most one install per phone per second; a faster
        second call is rejected.

        - **Completion**: **accepted, not complete.** The response only confirms
        the request was queued. Poll `/cloudphone/app/installedList` to see
        whether the app arrived.

        - **Retry**: safe to retry after checking the installed list, subject to
        the one-per-second limit.


        Documented business errors: `33005`, `33014`, `33714`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      tags:
        - Apps
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                appVersionId:
                  description: App version ID
                  type: string
                id:
                  description: Cloud phone ID
                  type: string
                packageName:
                  description: Package name — required only if appVersionId is not provided
                  type: string
                versionCode:
                  description: Version code — required only if appVersionId is not provided
                  type: integer
              required:
                - id
            example:
              appVersionId: '1672940217990530'
              id: '1673823102599682'
      responses:
        '200':
          description: Success. `data` is a single boolean value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - 'null'
                  data:
                    type: boolean
                  requestId:
                    type: string
              example:
                code: 0
                msg: null
                data: true
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
          headers: {}
      security: []
  /api/cloudphone/app/page:
    post:
      operationId: listCloudPhoneAppsLocal
      summary: List Available Apps
      deprecated: false
      description: >-
        List apps that can be installed on a Cloud Phone.


        - **Effect**: none. Read-only. Safe to retry with bounded backoff. No
        Cloud Phone is involved, so the phone does not need to be running.

        - **Contents**: the public app catalogue — globally available apps plus
        apps published to your team. Each entry carries its versions in
        `appVersionList`, newest first; take `appVersionList[].id` as the
        `appVersionId` for `/cloudphone/app/install`.

        - **Paging caveat**: results are re-sorted after the page is fetched, so
        ordering is stable only within a page and `total` reflects the current
        page rather than the whole catalogue. Use `pages` for navigation.
      tags:
        - Apps
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                appName:
                  description: App name (partial match)
                  type: string
                pageNum:
                  description: Page number; Default:1
                  type: integer
                pageSize:
                  description: Items per page; Default:10
                  type: integer
            example:
              appName: de
              pageNum: 1
              pageSize: 10
      responses:
        '200':
          description: >-
            Success. `data.dataList` holds the apps available to your team for
            the requested page; each app carries its versions in
            `appVersionList`, newest first. `data.total` is the number of
            records on this page, not the overall count — use `data.pages` for
            paging.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type:
                      - string
                      - 'null'
                  data:
                    type: object
                    properties:
                      total:
                        type: string
                        description: Number of records on the current page
                      current:
                        type: string
                        description: Current page number
                      pages:
                        type: string
                        description: Total number of pages
                      dataList:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              description: >-
                                App ID. This is not the value
                                `/cloudphone/app/install` expects.
                            appName:
                              type: string
                              description: App name
                            appIcon:
                              type: string
                              description: App icon URL
                            packageName:
                              type: string
                              description: Android package name
                            categoryValue:
                              type: integer
                              description: Category ID
                            sortNo:
                              type: integer
                              description: Sort order used by the app library
                            appVersionList:
                              type: array
                              description: >-
                                Versions of this app, ordered by `versionCode`
                                descending (newest first)
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: >-
                                      App version ID. Pass this as
                                      `appVersionId` to
                                      `/cloudphone/app/install`.
                                  versionCode:
                                    type: string
                                    description: Version code
                                  versionName:
                                    type: string
                                    description: Version display name
                                  installStatus:
                                    type:
                                      - integer
                                      - 'null'
                                    description: >-
                                      Always null for this operation. Query
                                      installation state with
                                      `/cloudphone/app/installedList`.
                                  packageName:
                                    type:
                                      - string
                                      - 'null'
                                    description: >-
                                      Always null for this operation; read
                                      `packageName` from the app instead.
                  requestId:
                    type: string
              example:
                code: 0
                msg: null
                data:
                  total: '1'
                  current: '1'
                  pages: '1'
                  dataList:
                    - id: '1672940217990529'
                      appName: Depop
                      appIcon: https://cdn.morelogin.com/app/depop.png
                      packageName: com.depop
                      categoryValue: 1
                      sortNo: 0
                      appVersionList:
                        - id: '1672940217990530'
                          versionCode: '450000000'
                          versionName: 4.50.0
                          installStatus: null
                          packageName: null
                requestId: 0d8b6f1c-9f4e-4d02-9d1a-7c3f5a1b2c3d
          headers: {}
      security: []
  /api/cloudphone/team/app/page:
