        - **Preconditions**: provide at least one of `envIds` or `uniqueIds`;
        `groupName` is required and at most 50 characters. There is no way to
        clear a profile's group through this endpoint.

        - **Effect**: the group is created automatically when the name does not
        exist, which **counts against the 1000-group team limit** and fails once
        that is reached. A profile belongs to exactly one group, so the previous
        group is replaced. When your team authorizes access per group, a group
        created here is also granted to you.

