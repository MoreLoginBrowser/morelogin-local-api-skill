  /api/env/core/download:
    post:
      operationId: downloadBrowserKernelsLocal
      summary: Download browser kernel
      deprecated: false
      description: >
        Download and install browser kernel(s). Supports batch downloading up to
        20 kernels per request. The timeout for this operation can be up to
        approximately 30 minutes; callers should set their timeout to greater
        than 1805 seconds.


        Requires MoreLogin client version **2.61.1** or higher.


        ### Duplicate Request Handling


        - If the same browser type and major version appears multiple times in a
        single request, only one lookup and download is performed, but each
        entry gets its own result.

        - Concurrent requests for the same version will join the in-flight task
        instead of starting a new download.

        - If the requested version is already installed with the latest minor
        version, the status will be `already_installed`.

        - If an older minor version is installed, it will be updated to the
        latest available minor version.


        ### Error Code Reference


        | errorCode | Description |

        |---|---|

        | `INVALID_JSON` | Malformed JSON body |

        | `INVALID_REQUEST` | Invalid request structure |

        | `BATCH_LIMIT_EXCEEDED` | `Cores` array exceeds 20 items |

        | `UNSUPPORTED_BROWSER_TYPE` | Unsupported browser type |

        | `INVALID_VERSION` | Invalid version format |

        | `METADATA_LOOKUP_FAILED` | Failed to query kernel metadata |

        | `UNSUPPORTED_VERSION` | Kernel version does not exist or is not
        supported on this platform |

        | `CLIENT_NOT_READY` | Client not ready |

        | `SDK_NOT_READY` | SDK not initialized |

        | `INSUFFICIENT_DISK_SPACE` | Insufficient disk space |

        | `DOWNLOAD_FAILED` | Download failed |

        | `CHECKSUM_MISMATCH` | MD5 checksum verification failed |

        | `EXTRACTION_FAILED` | Extraction or installation failed |

        | `TIMEOUT` | Operation timed out |

        | `UNKNOWN` | Unknown error |
      tags:
        - Runtime
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Cores:
                  type: array
                  description: List of kernels to download (1–20 items)
                  items:
                    type: object
                    properties:
                      BrowserType:
                        type: integer
                        description: Browser type. `1`:Chrome, `2`:Firefox
                      Version:
                        type: string
                        description: Kernel major version number, e.g. `"124"`, `"146"`
                    required:
                      - BrowserType
                      - Version
              required:
                - Cores
            example:
              Cores:
                - BrowserType: 1
                  Version: '124'
      responses:
        '200':
          description: >-
            Success. `data` is an object with the fields `total`, `succeeded`,
            `failed` and `results`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: >-
                      Response code. `0`:all succeeded; `-1`:partial success;
                      `-2`:all failed
                  msg:
                    type:
                      - string
                      - 'null'
                    description: Request-level error message; normally `null` on success
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: Total number of requested tasks
                      succeeded:
                        type: integer
                        description: >-
                          Number of succeeded tasks (including already
                          installed)
                      failed:
                        type: integer
                        description: Number of failed tasks
                      results:
                        type: array
                        description: >-
                          Execution result for each input item, in the same
                          order as the request
                        items:
                          type: object
                          properties:
                            index:
                              type: integer
                              description: >-
                                Corresponding index in the `Cores` array
                                (0-based)
                            browserType:
                              type:
                                - integer
                                - 'null'
                              description: Browser type
                            requestedVersion:
                              type:
                                - string
                                - 'null'
                              description: The requested major version
                            resolvedVersion:
                              type: string
                              description: >-
                                The actual full version resolved; returned on
                                success or when metadata is resolved
                            status:
                              type: string
                              description: >-
                                Task status:`installed`, `already_installed`, or
                                `failed`
                            source:
                              type: string
                              description: >-
                                Download source:`downloaded`,
                                `already_installed`, or `joined_in_flight`
                            errorCode:
                              type: string
                              description: >-
                                Stable error classification code returned on
                                failure
                            serverCode:
                              type: integer
                              description: >-
                                Optional. Original business error code from the
                                platform service
                            msg:
                              type: string
                              description: >-
                                Display message; may vary by client language. Do
                                not use for programmatic result checking
                    required:
                      - total
                      - succeeded
                      - failed
                      - results
                  requestId:
                    type: string
                    description: >-
                      Unique request identifier; include it when contacting
                      support
                required:
                  - code
                  - data
              example:
                code: 0
                msg: null
                data:
                  total: 1
                  succeeded: 1
                  failed: 0
                  results:
                    - index: 0
                      browserType: 1
                      requestedVersion: '124'
                      resolvedVersion: '124.5'
                      status: installed
                      source: downloaded
                      msg: Download successful
          headers: {}
      security: []
  /api/cloudbrowser/start:
    post:
      summary: Start cloud runtime
      description: >-
        Start a browser profile as a cloud runtime.


        - **Preconditions**: the profile must exist in your team and must not be
        end-to-end encrypted or mid-transfer. **A proxy is required** and its
        reachability is checked before the start is accepted. The browser kernel
        must be one the cloud browser supports, which rules out Firefox. Team
        open limits are enforced, and on deployments with cloud-browser billing
        enabled the AI credit balance is checked too.

        - **One run per profile**: a member may hold only one active run for a
        profile. When the team enables the security lock, another member's run
        blocks yours.

        - **Completion**: **accepted, not complete.** `data` is empty; the
        runtime is provisioned asynchronously. Poll `/cloudbrowser/page` until
        `cloudBrowserStatus` is `RUNNING`, then call `/cloudbrowser/connect` for
        `cdpUrl`. A start can be accepted and still fail later, which surfaces
        on that page.

        - **Concurrency**: concurrent starts for one profile are serialized by a
        lock; the loser is rejected rather than queued.

        - **Retry**: after a timeout, read `/cloudbrowser/page` — do not resend.


        Documented business errors: `19039`, `19065`, `40001`, `40003`, `40015`,
        `40016`, `40021`, `40023`, `40024`, `40025`, `40026`, `40027`, `40028`,
        `40029`, `40037`. See [Error Codes](../Getting%20Started/error-codes.md)
        for what each code means. Any operation can additionally return the
        common codes.
      operationId: startCloudRuntimeLocal
      tags:
        - Cloud Runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudBrowserStartRequest'
            example:
              envId: '1800000000000001'
      responses:
        '200':
          $ref: '#/components/responses/VoidDataResponse'
      security: []
  /api/cloudbrowser/stop:
    post:
      summary: Stop cloud runtime
      description: >-
        Stop the cloud runtime a profile is running in.


        - **Preconditions**: there must be an active run started by you for that
        profile. Calling it while the runtime is already stopped or releasing
        succeeds without doing anything.

        - **Effect**: stops billing, settles usage, releases the profile lock,
        and asks the client to archive the profile and cookies back to the cloud
        before the runtime is released.

        - **Completion**: **accepted, not complete.** Poll `/cloudbrowser/page`
        until `cloudBrowserStatus` is `CLOSED` and `cloudBrowserArchiveStatus`
        reaches `COMPLETED` or `FAILED`.

        - **When archiving fails**: the run stays billable and still shows as
        `RUNNING`. `force` is honoured **only** in that state: it skips
        archiving and releases the runtime, which discards this session's
        profile changes.

        - **Concurrency**: concurrent stops for one run are serialized, so a
        duplicate call is safe.


        Documented business errors: `40002`, `40006`, `40008`, `40020`. See
        [Error Codes](../Getting%20Started/error-codes.md) for what each code
        means. Any operation can additionally return the common codes.
      operationId: stopCloudRuntimeLocal
      tags:
        - Cloud Runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudBrowserStopRequest'
            example:
              envId: '1800000000000001'
              force: false
      responses:
        '200':
          $ref: '#/components/responses/VoidDataResponse'
      security: []
  /api/cloudbrowser/page:
    post:
      summary: Page cloud runtimes
      description: >-
        List browser profiles together with the cloud runtime state for the
        calling member.


        - **Effect**: none. Read-only. Safe to retry with bounded backoff.

        - **Status values**: `cloudBrowserStatus` is only ever `STARTING`,
        `RUNNING` or `CLOSED`. **`RUNNING` does not mean the browser is usable**
        — a runtime that is stopping, archiving, or that failed to stop is also
        reported as `RUNNING`. `cloudBrowserArchiveStatus` (`PENDING`,
        `ARCHIVING`, `COMPLETED`, `FAILED`) tells the two apart and is null when
        there is no activity.

        - **Consistency**: the runtime lookup is all-or-nothing. If it cannot be
        resolved for the whole page the call fails rather than returning partial
        data.
      operationId: pageCloudRuntimesLocal
      tags:
        - Cloud Runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudBrowserPageRequest'
            example:
              pageNo: 1
              pageSize: 10
              keyword: marketing
      responses:
        '200':
          $ref: '#/components/responses/CloudBrowserPageResponse'
      security: []
  /api/cloudbrowser/connect:
    post:
      summary: Connect cloud runtime
      description: >-
        Return the connection details for a running cloud runtime.


        - **Preconditions**: the runtime must be exactly in the `RUNNING` state
        and must have been started by you. A runtime that is stopping or
        archiving is rejected even though `/cloudbrowser/page` still reports
        `RUNNING`.

        - **Effect**: mints a fresh desktop access token and records you as the
        connected member.

        - **Repeat calls**: the returned `cdpUrl` is stable and existing CDP
        sessions keep working, but each call issues a new desktop token and
        overwrites the recorded connected member. **Earlier desktop URLs are not
        revoked**, so treat every returned URL as a live credential: do not log
        or persist them.

        - **Session limit**: the runtime is stopped automatically once it
        reaches its maximum duration, and archiving starts shortly before that,
        so a long-lived automation run must handle the runtime disappearing.

        - **Use**: attach Puppeteer, Playwright or Selenium to `cdpUrl`.


        Documented business errors: `40008`, `40009`, `40010`. See [Error
        Codes](../Getting%20Started/error-codes.md) for what each code means.
        Any operation can additionally return the common codes.
      operationId: connectCloudRuntimeLocal
      tags:
        - Cloud Runtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudBrowserConnectRequest'
            example:
              envId: '1800000000000001'
      responses:
        '200':
          $ref: '#/components/responses/CloudBrowserConnectResponse'
      security: []
components:
  schemas:
    CreateEnvironmentRequest:
      allOf:
        - $ref: '#/components/schemas/EnvironmentBase'
        - type: object
          required:
            - browserTypeId
            - operatorSystemId
          properties:
            proxy:
              type: object
              properties:
                proxyId:
                  description: Proxy ID
                  type: string
                proxyName:
                  description: Proxy name (maximum 600 characters)
                  type: string
                proxyType:
                  description: >-
                    Proxy type, 0: http, 1: https. Cannot be empty when
                    proxyProvider is 7/8
                  type: integer
                proxyProvider:
                  description: >-
                    Proxy type 0: http, 1: https, 2: socks5, 3: ssh, 4: Oxylabs,
                    5: Proxys.io, 7: Luminati, 8: Lumauto, 9: Oxylabsauto, 10:
                    Trojan, 11: Shadowsocks, 13: ABCPROXY, 14: LunaProxy, 15:
                    IPHTML, 16: PiaProxy, 17: 922S5, 18: 360Proxy
                  type: string
                proxyIp:
                  description: >-
                    Proxy IP. Can be empty when proxyProvider is 16/17/18;
                    required for others
                  type: string
                proxyPort:
                  description: >-
                    Proxy port (only numbers 1-65535 allowed). Can be empty when
                    proxyProvider is 16/17/18; required for others
                  type: integer
                username:
                  description: Username (maximum 200 characters)
                  type: string
                password:
                  description: Password (maximum 100 characters)
                  type: string
                refreshUrl:
                  description: Refresh URL
                  type: string
                country:
                  description: >-
                    Country code (e.g. `us`). See [Country Time Zone
                    Table](/api-reference/appendix/country-time-zone) for
                    supported codes. Required when proxyProvider is 16/17/18
                  type: string
                city:
                  description: City
                  type: string
                state:
                  description: State/Province
                  type: string
                encryptionType:
                  description: >-
                    Encryption method. Cannot be empty when proxyProvider is 11.
                    1: aes-128-gcm, 2: aes-192-gcm, 3: aes-256-gcm, 4:
                    aes-128-cfb, 5: aes-192-cfb, 6: aes-256-cfb, 7: aes-128-ctr,
                    8: aes-192-ctr, 9: aes-256-ctr, 10: rc4-md5, 11:
                    chacha20-ietf, 12: xchacha20, 13: chacha20-ietf-poly1305,
                    14: xchacha20-ietf-poly1305
                  type: integer
                ipMonitor:
                  description: 'Enable IP change monitoring? true: On, false: Off'
                  type: boolean
                ipChangeAction:
                  description: 'IP change monitoring 0: Block access, 1: Warn'
                  type: integer
              description: Proxy information
    UpdateEnvironmentRequest:
      allOf:
        - $ref: '#/components/schemas/EnvironmentBase'
        - type: object
          required:
            - envId
          properties:
            envId:
              type: string
              description: Environment ID
    EnvironmentBase:
      type: object
      properties:
        browserTypeId:
          type: integer
          description: Browser type ID; 1=Chrome, 2=Firefox
        operatorSystemId:
          type: integer
          description: OS type ID; 1:Windows 2:macOS 3:Android 4:IOS 5:Linux
        isEncrypt:
          type: integer
          description: Whether to encrypt the profile; 0=No, 1=Yes
        startupParams:
          type: array
          items:
            type: string
          description: Additional browser startup parameters
        accountInfo:
          description: Account information
          $ref: '#/components/schemas/AccountInfo'
        advancedSetting:
          description: Advanced browser fingerprint settings
          $ref: '#/components/schemas/AdvancedSetting'
        afterStartupConfig:
          description: Configurations after startup
          $ref: '#/components/schemas/AfterStartupConfig'
        browserCore:
          type: integer
          description: >-
            Kernel version; default:0 (auto-match). Fetch available versions via
            `/api/env/advanced/ua/versions`.
        cookies:
          type: string
          description: Cookie string to preload (optional)
        envName:
          type: string
          description: Environment name
        envRemark:
          type: string
          description: Environment remark; max length:1500 chars
        groupId:
          type: string
          description: Environment group ID; default:ungrouped (0)
        groupName:
          type: string
          maxLength: 50
          description: >-
            Group name (max 50 characters). If provided, the system first checks
            groupId: if a valid group is found, it is used; otherwise, it
            searches by groupName. If a group with that name exists, it is
            referenced; if not, a new group is created. Each team is limited to
            1,000 groups.
        proxyId:
          type: string
          description: Proxy ID; default:0
        tagIds:
          type: array
          items:
            type: string
          description: Tag IDs; default:none
        uaVersion:
          type: integer
          description: UA preset version; default:0 (all)
        disableAudio:
          type: integer
          description: Disable audio:0 = off, 1 = on
        disableImg:
          type: integer
          description: Disable image loading:0 = off, 1 = on
        disableVideo:
          type: integer
          description: Disable video loading:0 = off, 1 = on
        imgLimitSize:
          type: integer
          description: Max image size (KB)
    AccountInfo:
      type: object
      properties:
        customerUrl:
          type: string
          description: >-
            Custom platform URL — required if platformId=9999, must be a valid
            URL
        password:
          type: string
          description: Password; max length:50 characters
        platformId:
          type: string
          description: >-
            Platform ID; use 9999 for custom URL. Refer to
            /api/system/platform/list.
        siteId:
          type: string
          description: >-
            Site ID; obtain via ""Get Configurable Platforms"" API
            (/api/system/platform/list)
        username:
          type: string
          maxLength: 64
          description: Username; max length:64 characters
    AdvancedSetting:
      type: object
      description: Advanced browser fingerprint and behavior configuration.
      properties:
        ua:
          type: string
          description: >
            Customize the profile User-Agent (UA). Must follow standard UA
            format.

            Available via the “Get Browser UA” API.
        time_zone:
          description: Timezone settings
          $ref: '#/components/schemas/TimeZoneConfig'
        web_rtc:
          description: WebRTC settings
          $ref: '#/components/schemas/WebRTCConfig'
        geo_location:
          description: Geolocation settings
          $ref: '#/components/schemas/GeoLocationConfig'
        language:
          description: Language
          $ref: '#/components/schemas/LanguageConfig'
        resolution:
          description: Resolution settings
          $ref: '#/components/schemas/ResolutionConfig'
        font:
          description: Font settings
          $ref: '#/components/schemas/FontConfig'
        canvas:
          description: Canvas fingerprinting setting
          $ref: '#/components/schemas/CanvasConfig'
        webgl_image:
          description: WebGL image settings
          $ref: '#/components/schemas/WebGLImageConfig'
        webgl_metadata:
          description: WebGL metadata settings
          $ref: '#/components/schemas/WebGLMetadataConfig'
        audio_context:
          description: 'AudioContext: 1 = noise, 2 = authentic'
          $ref: '#/components/schemas/AudioContextConfig'
        media_device:
          description: 'Media device: 1 = noise, 2 = authentic'
          $ref: '#/components/schemas/MediaDeviceConfig'
        client_rects:
          description: 'ClientRects: 1 = noise, 2 = authentic'
          $ref: '#/components/schemas/ClientRectsConfig'
        speech_voise:
          description: 'Speech voice: 1 = privacy, 2 = authentic'
          $ref: '#/components/schemas/SpeechVoiseConfig'
        hardware_concurrency:
          type: integer
          description: |
            Simulated number of logical CPU cores.
            default:4. Options: 0 (real), 2, 3, 4, 6, 8, 10, 12.
        memery_device:
          type: integer
          description: |
            Simulated device memory (GB).
            default:8. Options: 0 (real), 2, 4, 6, 8.
        do_not_track:
          type: integer
          description: Do Not Track setting. Default:2. 1 = on, 2 = off.
        bluetooth:
          description: 'Bluetooth: 1 = privacy, 2 = authentic'
          $ref: '#/components/schemas/BluetoothConfig'
        battery:
          description: 'Battery: 1 = privacy, 2 = authentic'
          $ref: '#/components/schemas/BatteryConfig'
        port_scan_protection:
          description: Port scan protection
          $ref: '#/components/schemas/PortScanProtectionConfig'
        os_version:
          type: string
          description: macOS system version (e.g., macOS 12, macOS 13, macOS 14).
        web_gpu:
          description: WebGPU settings
          $ref: '#/components/schemas/WebGPUConfig'
        ciphers:
          description: Cipher suite configurations
          $ref: '#/components/schemas/CiphersConfig'
        mobile_device:
          type: string
          description: |
            Phone model ID (as string). Obtain via "Get Phone Model List" API.
            Example: "1826502391344832512"
    TimeZoneConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Timezone option. Default:1. 1 = Match IP, 2 = Custom.
        value:
          type: string
          description: |
            Required when switcher=2.
            Timezone ID from “Get Timezone & Language List” API.
    WebRTCConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: >
            WebRTC policy. Default:2. 1 = Privacy, 2 = Replacement, 3 = Real, 4
            = Disabled, 5 = Forwarding.
    GeoLocationConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Geolocation policy. Default:1. 1 = Prompt, 2 = Disabled.
        base_on_ip:
          type: boolean
          description: >-
            Generate location based on IP? Default:true. true = prompt, false =
            manual.
        latitude:
          type: number
          format: float
          description: Latitude. Required if base_on_ip=false.
        longitude:
          type: number
          format: float
          description: Longitude. Required if base_on_ip=false.
        accuracy:
          type: number
          format: float
          description: Accuracy in meters. Required if base_on_ip=false.
    LanguageConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Language policy. Default:1. 1 = Match IP, 2 = Custom.
        value:
          type: string
          description: >
            Required when switcher=2.

            Comma-separated language IDs from “Get Timezone & Language List”
            API.
    ResolutionConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Resolution policy. Default:1. 1 = Real, 2 = Custom.
        id:
          type: string
          description: |
            Required when switcher=2.
            Resolution ID from “Get Resolution List” API.
    FontConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Font policy. Default:1. 1 = Real, 2 = Custom.
        value:
          type: string
          description: Comma-separated custom font names (required if switcher=2).
    CanvasConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Canvas policy. Default:1. 1 = Noise, 2 = Real.
    WebGLImageConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: WebGL image policy. Default:1. 1 = Noise, 2 = Real.
    WebGLMetadataConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: >-
            WebGL metadata policy. Default:3. 1 = Real, 2 = Disable HW
            acceleration, 3 = Custom.
        provider:
          type: string
          description: WebGL renderer brand string (e.g., "Google Inc.")
        render:
          type: string
          description: WebGL renderer string (e.g., "ANGLE (...)")
    AudioContextConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: AudioContext policy. Default:1. 1 = Noise, 2 = Realistic.
    MediaDeviceConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Media device policy. Default:1. 1 = Noise, 2 = Real.
    ClientRectsConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: ClientRects policy. Default:1. 1 = Noise, 2 = Real.
    SpeechVoiseConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: SpeechVoices policy. Default:1. 1 = Privacy, 2 = Real
    BluetoothConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Bluetooth policy. Default:1. 1 = Privacy, 2 = Authenticity.
    BatteryConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Battery policy. Default:1. 1 = Privacy, 2 = Authenticity.
    PortScanProtectionConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: Port scan protection. Default:1. 1 = On, 2 = Off.
        value:
          type: string
          description: Allowed local network ports to connect (comma-separated).
    WebGPUConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: >-
            WebGPU policy. Default:1. 1 = WebGL-based matching, 2 = true, 3 =
            disabled.
    AfterStartupConfig:
      type: object
      properties:
        afterStartup:
          type: integer
          format: int32
          description: |
            Action after startup. Default:1.
            1 = Continue last page,
            2 = Open specified URLs,
            3 = Open URLs + platform,
            4 = Continue last page + platform.
        autoOpenUrls:
          type: array
          items:
            type: string
            format: uri
          description: List of valid URLs to open automatically (required for options 2–3).
    CiphersConfig:
      type: object
      properties:
        switcher:
          type: integer
          description: TLS cipher policy. Default:1. 1 = Default, 2 = Custom.
        value:
          type: string
          description: >
            Required when switcher=2.

            Comma-separated list of TLS protocols to disable (e.g.,
            "TLSv1,TLSv1.1").
    BrowserPhoneList:
      type: object
      properties:
        code:
          description: Return result code 0:Normal Other codes are exceptions.
          type: integer
        msg:
          description: Error message
          type:
            - string
            - 'null'
        data:
          description: Response data
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              resolution:
                type: string
              os:
                type: integer
              platform:
                type: string
        requestId:
          description: Operation request ID
          type: string
      required:
        - code
        - msg
        - data
        - requestId
    EnvironmentId:
      type: string
      pattern: ^[1-9]\d*$
      description: >
        Browser profile (environment) ID. Serialized as a decimal string to
        avoid JavaScript

        precision loss on 64-bit integers.
      example: '1800000000000001'
    CloudBrowserStartRequest:
      type: object
      properties:
        envId:
          $ref: '#/components/schemas/EnvironmentId'
      required:
        - envId
    ApiResponseBase:
      type: object
      properties:
        code:
          type: integer
          description: >-
            Return result code. `0` means success; other codes indicate
            exceptions.
          example: 0
        msg:
          type:
            - string
            - 'null'
          description: Error message. Usually `null` on success.
          example: null
        requestId:
          type: string
          description: >-
            Operation request ID. This field may be present when the request
            passes through the API gateway.
          example: 1d4f3ea968664593860b94b35d4ebf5e
      required:
        - code
        - msg
    CloudBrowserStopRequest:
      type: object
      properties:
        envId:
          $ref: '#/components/schemas/EnvironmentId'
        force:
          type: boolean
          description: >
            Whether to forcibly release the cloud runtime. Only takes effect
            when the current run has

            an archive status of `FAILED`; in that case the archive step is
            skipped and runtime

            resources are reclaimed. Ignored in all other cases.
          default: false
          example: false
      required:
        - envId
    CloudBrowserPageRequest:
      type: object
      properties:
        uniqueIds:
          type: array
          description: Environment sequence numbers. Up to 100 items.
          maxItems: 100
          items:
            type: integer
            format: int32
          example:
            - 1001
            - 1002
        envId:
          allOf:
            - $ref: '#/components/schemas/EnvironmentId'
          description: Environment ID. The request also accepts the field alias `id`.
        envName:
          type: string
          description: Environment name.
          example: marketing-01
        keyword:
          type: string
          description: >-
            Keyword filter. Matches environment name, group name, tag name, and
            remark.
          example: marketing
        groupId:
          type: string
          pattern: ^\d+$
          description: Group ID. `0` means ungrouped.
          example: '0'
        pageNo:
          type: integer
          format: int64
          description: Current page number, starting from 1. Default is 1.
          minimum: 1
          default: 1
          example: 1
        pageSize:
          type: integer
          format: int64
          description: Number of items per page. Default is 10, maximum 100.
          minimum: 1
          maximum: 100
          default: 10
          example: 10
      required:
        - pageNo
        - pageSize
    CloudBrowserStatus:
      type: string
      description: |
        Cloud runtime status:
        - `STARTING` — starting up
        - `RUNNING` — running and ready to connect
        - `CLOSED` — not started, closed, or failed to start
      enum:
        - STARTING
        - RUNNING
        - CLOSED
      example: RUNNING
    CloudBrowserArchiveStatus:
      type:
        - string
        - 'null'
      description: >
        Archive status of the current cloud run. `null` when there is no active
        run record:

        - `PENDING` — pending archive

        - `ARCHIVING` — archiving

        - `COMPLETED` — archive completed

        - `FAILED` — archive failed
      enum:
        - PENDING
        - ARCHIVING
        - COMPLETED
        - FAILED
        - null
      example: null
    CloudBrowserPageItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/EnvironmentId'
        envName:
          type: string
          description: Environment name.
          example: marketing-01
        proxyId:
          type:
            - string
            - 'null'
          pattern: ^\d+$
          description: >-
            Proxy ID currently bound to the profile. `null` when no proxy is
            configured.
          example: '1800000000000101'
        cloudBrowserStatus:
          $ref: '#/components/schemas/CloudBrowserStatus'
        cloudBrowserArchiveStatus:
          $ref: '#/components/schemas/CloudBrowserArchiveStatus'
        startDate:
          type:
            - string
            - 'null'
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$
          description: >-
            Cloud runtime start time. `null` while starting, or when not started
            or closed.
          example: '2026-01-15 10:30:00'
      required:
        - id
        - envName
        - cloudBrowserStatus
    CloudBrowserPageData:
      type: object
      properties:
        total:
          type: string
          pattern: ^\d+$
          description: Total number of records.
          example: '42'
        current:
          type: string
          pattern: ^\d+$
          description: Current page number.
          example: '1'
        pages:
          type: string
          pattern: ^\d+$
          description: Total number of pages.
          example: '5'
        dataList:
          type: array
          description: >-
            Environments on the current page. Empty array when there are no
            results.
          items:
            $ref: '#/components/schemas/CloudBrowserPageItem'
      required:
        - total
        - current
        - pages
        - dataList
    CloudBrowserConnectRequest:
      type: object
      properties:
        envId:
          $ref: '#/components/schemas/EnvironmentId'
      required:
        - envId
    CloudBrowserConnectResult:
      type: object
      properties:
        cdpUrl:
          type: string
          description: >
            Full CDP (Chrome DevTools Protocol) address including the access
            `token` parameter. Pass this

            URL to an automation framework such as Puppeteer, Playwright, or
            Selenium to attach to the

            remote browser.
          example: >-
            https://runtime1.morelogin.com:16167?token=c62fedaaac524e41a0f02fc4345d41cb
        accessUrl:
          type:
            - string
            - 'null'
          description: >
            Cloud browser page wrapper address. Open it in a browser to view and
            control the cloud

            browser desktop. `null` when the page wrapper is not configured.


            The `token` parameter is a Base64-encoded payload carrying the
            desktop URL, desktop token,

            expiry, and team, user, member, and environment IDs. The `envName`
            and `lang` parameters set

            the displayed environment name and interface language.
          example: >-
            https://official-website.morelogin.com/browser-remote?token=eyJkZXNrdG9wVXJsIjoi...ZW52SWQiOiIyMDczMzk1NDg5NzM4OTE5OTM2In0%3D&envName=P-1267&lang=en-US
      required:
        - cdpUrl
  responses:
    VoidDataResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseBase'
              - type: object
                properties:
                  data:
                    type: 'null'
                    example: null
    CloudBrowserPageResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseBase'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CloudBrowserPageData'
                required:
                  - data
    CloudBrowserConnectResponse:
      description: Success
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiResponseBase'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CloudBrowserConnectResult'
                required:
                  - data
          example:
            code: 0
            msg: null
            data:
              cdpUrl: >-
                https://runtime1.morelogin.com:16167?token=c62fedaaac524e41a0f02fc4345d41cb
              accessUrl: >-
                https://official-website.morelogin.com/browser-remote?token=eyJkZXNrdG9wVXJsIjoi...ZW52SWQiOiIyMDczMzk1NDg5NzM4OTE5OTM2In0%3D&envName=P-1267&lang=en-US
            requestId: 1d4f3ea968664593860b94b35d4ebf5e
